  .account-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-email{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-actions{ display:flex; gap:8px; flex-wrap:wrap; flex:0 0 auto; }

  .kami-feature{
    display:flex; align-items:center; gap:16px; cursor:pointer;
    background:var(--card); border:2px solid var(--gold); border-radius:12px; padding:16px; margin-bottom:4px;
  }
  .kami-feature-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:18px; }
  .kami-feature-name span{ color:var(--ink-soft); font-weight:500; font-size:14px; }

  /* The stage above already shows the faces at size. Down here the roster
     only has to be scannable, so it is a wrapping row of chips rather than
     a grid of cards — 16 members fit in three lines instead of five. */
  .grid-mini{ display:flex; flex-wrap:wrap; gap:6px; }
  .mini-card{
    position:relative; display:inline-flex; align-items:center; gap:7px;
    box-sizing:border-box; padding:4px 11px 4px 4px; min-width:0; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    transition:border-color .16s ease, transform .16s ease;
  }
  .mini-card:hover{ border-color:var(--c); transform:translateY(-1px); }
  .mini-card .avatar-sm{
    width:28px; height:28px; font-size:12px; flex:none;
    box-shadow:0 0 0 2px var(--c);
  }
  .mini-names{ display:flex; align-items:baseline; gap:5px; min-width:0; }
  .mini-name{ font-size:12.5px; font-weight:700; line-height:1.2; white-space:nowrap; }
  .mini-name-th{ font-size:11px; color:var(--ink-soft); line-height:1.2; white-space:nowrap; }
  .mini-crown{ width:12px; height:12px; color:var(--gold); flex:none; }
  .mini-crown svg{ width:100%; height:100%; display:block; }
  /* The oshi list mixes groups, so the chip border carries the group colour;
     the crown is what marks the kami oshi. */
  .grid-mini-oshi .mini-card{ border-color:var(--c); }
  .mini-card.is-centre{
    border-color:var(--gold); background:color-mix(in srgb, var(--gold) 12%, var(--card));
  }
  .mini-card.is-centre .mini-name{ color:var(--gold-ink, var(--ink)); }
  .mini-card.is-centre .avatar-sm{ box-shadow:0 0 0 2px var(--gold); }
  @media (max-width:560px){
    .mini-name-th{ display:none; }
    .grid-mini{ gap:5px; }
    .mini-card{ padding:3px 9px 3px 3px; gap:6px; }
    .mini-card .avatar-sm{ width:24px; height:24px; font-size:11px; }
    .mini-name{ font-size:12px; }
  }

  /* auth */
  .auth-card{ max-width:420px; }
  .resume-card{
    display:flex; align-items:center; gap:12px;
    background:var(--paper-dim); border-radius:12px; padding:14px 16px;
  }
  .auth-error{ font-size:13px; color:var(--danger); background:var(--danger-soft); border-radius:8px; padding:10px 12px; margin:0 0 12px; line-height:1.5; }
  .auth-switch{ font-size:13px; color:var(--ink-soft); margin-top:16px; }
  .auth-switch button{ background:none; border:none; color:var(--bnk); font-weight:600; font-size:13px; cursor:pointer; padding:0; }

  /* ======================== INTERACTION MOTION ========================
     Shared feel: quick dip on press, springy release, soft lift on hover. */

  .btn-add, .btn-secondary, .btn-danger, .signin-btn, .pill, .gen-filter-chip,
  .oshi-btn, .kami-btn, .team-row, .mini-card, .kami-feature, .modal-close-btn,
  .back-btn, .fav-btn, .fav-btn-sm, .mini-avatar-btn, .profile-dropdown button,
  .auth-switch button, .dtable .row:not(.head){
    transition:
      transform .34s var(--ease-spring),
      box-shadow .3s var(--ease-out),
      background-color .22s var(--ease-out),
      border-color .22s var(--ease-out),
      color .22s var(--ease-out),
      filter .22s var(--ease-out);
  }

  /* --- ripple: expands from the exact point you touched --- */
  .btn-add, .btn-secondary, .btn-danger, .signin-btn, .pill, .gen-filter-chip,
  .oshi-btn, .kami-btn, .team-row, .profile-dropdown button{
    position:relative; overflow:hidden;
  }
  /* Already absolutely positioned — must keep it, so only clip the ripple. */
  .modal-close-btn{ overflow:hidden; }
  .btn-add::after, .btn-secondary::after, .btn-danger::after, .signin-btn::after,
  .pill::after, .gen-filter-chip::after, .oshi-btn::after, .kami-btn::after,
  .team-row::after, .modal-close-btn::after, .profile-dropdown button::after{
    content:''; position:absolute; pointer-events:none; opacity:0;
    left:var(--rx,50%); top:var(--ry,50%);
    width:var(--rs,140px); height:var(--rs,140px);
    margin:calc(var(--rs,140px) / -2) 0 0 calc(var(--rs,140px) / -2);
    border-radius:50%;
    background:radial-gradient(circle closest-side, currentColor, transparent);
  }
  .dtable .row:not(.head) .cell,
  .dtable .row:not(.head) .group-chip,
  .dtable .row:not(.head) .avatar-sm{
    transition:background-color .25s var(--ease-out), box-shadow .25s var(--ease-out);
  }

  .rippling::after{ animation:rippleOut .6s var(--ease-out) forwards; }
  @keyframes rippleOut{
    0%{ transform:scale(0); opacity:.3; }
    65%{ opacity:.13; }
    100%{ transform:scale(1); opacity:0; }
  }

  /* --- hover (pointer devices only) --- */
  @media (hover:hover){
    .btn-add:hover{ filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 8px 20px rgba(192,138,46,.4); }
    .btn-secondary:hover{ background:var(--card); border-color:var(--ink-soft); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.11); }
    .btn-danger:hover{ background:var(--danger); color:#fff; transform:translateY(-2px); box-shadow:0 7px 18px rgba(184,69,69,.3); }
    .signin-btn:hover{ background:rgba(255,255,255,calc(.75*var(--glass-k))); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.13); }
    .pill:hover{ border-color:var(--bnk); color:var(--bnk); transform:translateY(-1px); }
    .gen-filter-chip:hover{ filter:brightness(1.35); }
    .oshi-btn:hover, .kami-btn:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.1); }
    .team-row:hover{ background:var(--pink-soft); transform:translateX(4px); }
    .mini-card:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 26px rgba(var(--shadow-rgb),.15);
      box-shadow:0 12px 26px -6px color-mix(in srgb, var(--c) 55%, transparent);
      border-color:color-mix(in srgb, var(--c) 40%, var(--line));
    }
    .kami-feature:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(192,138,46,.26); }
    .modal-close-btn:hover{ background:var(--card); transform:rotate(90deg); }
    .fav-btn:hover, .fav-btn-sm:hover{ transform:scale(1.3) rotate(10deg); }
    .back-btn:hover{ transform:translateX(-4px); }
    .mini-avatar-btn:hover{ transform:scale(1.08); }
    .profile-dropdown button:hover{ transform:translateX(3px); }
    /* member rows glow in their own group's colour (--c is set per row) */
    .dtable .row:not(.head):hover{
      z-index:3;
      background:var(--paper-dim);
      background:color-mix(in srgb, var(--c) 15%, var(--card));
      box-shadow:0 6px 22px -4px rgba(var(--shadow-rgb),.28);
      box-shadow:
        0 6px 22px -4px color-mix(in srgb, var(--c) 70%, transparent),
        inset 10px 0 22px -14px var(--c);
    }
    .dtable .row:not(.head):hover .cell{
      background:var(--paper-dim);
      background:color-mix(in srgb, var(--c) 15%, var(--card));
    }
    .dtable .row:not(.head):hover .group-chip{
      box-shadow:0 2px 9px color-mix(in srgb, var(--c) 50%, transparent);
    }
    .dtable .row:not(.head):hover .avatar-sm{
      box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent);
    }
  }

  /* --- press: dips fast, springs back --- */
  .btn-add:active, .btn-secondary:active, .btn-danger:active, .signin-btn:active,
  .pill:active, .gen-filter-chip:active, .oshi-btn:active, .kami-btn:active,
  .modal-close-btn:active, .profile-dropdown button:active{
    transform:scale(.93); transition-duration:.09s;
  }
  .btn-add:active{ box-shadow:0 2px 6px rgba(192,138,46,.3); }
  body:not(.is-scrolling) :is(.team-row, .mini-card, .kami-feature):active{
    transform:scale(.977); transition-duration:.09s;
  }
  /* rows are too wide to scale nicely — deepen the group tint instead */
  body:not(.is-scrolling) .dtable .row:not(.head):active .cell,
  body:not(.is-scrolling) .dtable .row:not(.head):active .cell.sticky-name{
    background:var(--paper-dim);
    background:color-mix(in srgb, var(--c) 26%, var(--card));
    transition-duration:.08s;
  }
  .back-btn:active{ transform:translateX(-5px); transition-duration:.09s; }
  .mini-avatar-btn:active{ transform:scale(.9); transition-duration:.09s; }
  .fav-btn:active, .fav-btn-sm:active{ transform:scale(.82); transition-duration:.08s; }
  .auth-switch button:active{ transform:scale(.94); transition-duration:.09s; }

  /* --- oshi / kami toggle: star wobble + ring burst, pill gets a gold pulse --- */
  .fav-btn-sm{ position:relative; }
  .fav-btn.star-pop::before, .fav-btn-sm.star-pop::before{
    content:''; position:absolute; left:50%; top:50%;

function applyTheme(theme){
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  try{ localStorage.setItem('48thdb-theme', theme); }catch(e){}
  const btn = document.querySelector('.theme-btn');
  if(btn) btn.innerHTML = theme==='dark' ? ICONS.sun : ICONS.moon;
}

// ============================= HELPERS =============================
function getGroup(id){ return GROUPS.find(g=>g.id===id); }
function getTeam(id){ return TEAMS.find(t=>t.id===id); }
function getTeamsForGroup(gid){ return TEAMS.filter(t=>t.groupId===gid); }
function getMember(id){ return state.members.find(m=>m.id===id); }

const TH_SHORT_RE = 'ม\\.ค\\.|ก\\.พ\\.|มี\\.ค\\.|เม\\.ย\\.|พ\\.ค\\.|มิ\\.ย\\.|ก\\.ค\\.|ส\\.ค\\.|ก\\.ย\\.|ต\\.ค\\.|พ\\.ย\\.|ธ\\.ค\\.';
const TH_FULL_RE = 'มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม';

const TH_MONTH_RE = '(?:' + TH_SHORT_RE + '|' + TH_FULL_RE + ')';

/** Thai month name -> English, keeping short short and full full. */
function enMonth(th){
  let i = THAI_MONTHS.indexOf(th);
  if(i >= 0) return EN_MONTHS_SHORT[i];
  i = MONTH_NAMES.indexOf(th);
  return i >= 0 ? EN_MONTHS[i] : th;
}
/** Buddhist years are written as they come; the English side counts from AD. */
function enYear(y){ return +y > 2400 ? +y - 543 : +y; }
/** A captured fragment may itself be translatable — a name, a team, a phrase. */
function enPart(s){ return toEn(s) || s; }
/** " · "-joined lists are common enough to be worth translating piece by piece. */
function enList(s){ return s.split(' · ').map(enPart).join(' · '); }

/** Marks the page as the language being read, for anything outside the body:
    screen readers, the share sheet, and a browser offering to translate. */
function applyDocumentLanguage(){
  document.documentElement.lang = state.lang;
  const meta = document.querySelector('meta[name="description"]');
  if(meta) meta.content = isEN() ? (EN[META_DESC_TH] || META_DESC_TH) : META_DESC_TH;

function toEn(s){
  const key = s.trim().replace(/\s+/g, ' ');
  if(!key) return null;
  if(EN[key] != null) return EN[key];
  for(const [re, out] of EN_PATTERNS){
    const m = key.match(re);
    if(!m) continue;
    /* A pattern may match the shape but decline the string — the name-pair rule
       only speaks for names it knows — so keep looking rather than give up. */
    const hit = typeof out === 'function' ? out(m) : out;
    if(hit != null) return hit;
  }
  return null;
}

function enFragments(s){
  let out = s;
  for(const [re, to] of EN_FRAGMENTS) out = out.replace(re, to);
  return out === s ? null : out;
}

const LOCALIZE_ATTRS = ['title', 'aria-label', 'placeholder', 'alt'];

function localize(root){
  if(!isEN() || !root) return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE)$/.test(n.parentElement.tagName))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const seen = [];
  for(let n = walk.nextNode(); n; n = walk.nextNode()) seen.push(n);
  for(const n of seen){
    const raw = n.nodeValue;
    const out = toEn(raw) ?? enFragments(raw.trim().replace(/\s+/g, ' '));
    if(out == null) continue;
    // keep whatever spacing sat around the phrase
    const [, before, , after] = n.nodeValue.match(/^(\s*)([\s\S]*?)(\s*)$/);
    n.nodeValue = before + out + after;
  }
  const els = root.querySelectorAll ? root.querySelectorAll('*') : [];
  for(const el of els){
    for(const a of LOCALIZE_ATTRS){
      const v = el.getAttribute && el.getAttribute(a);
      if(!v) continue;
      const out = toEn(v) ?? enFragments(v);
      if(out != null) el.setAttribute(a, out);
    }
  }
}

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

   rather than pattern-matched back out of the page afterwards. */

function formatDate(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return '-';
  return `${dt.getDate()} ${THAI_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}
function formatDateShort(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return '-';
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function calcAge(d){
  if(!d) return null;
  const b = new Date(d+'T00:00:00'); const t = new Date();
  if(isNaN(b)) return null;
  let age = t.getFullYear()-b.getFullYear();
  const m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}

/* Hometown and hobbies used to be written as facts ("บ้านเกิดชลบุรี"). Copies
   saved to Firestore before they became fields still hold them that way, so
   they are lifted out on load — only into an empty field, and a fact that
   disagrees with a field already set is left where it is. */
/* Values the seed once held and has since corrected. A stored copy still
   holding one of these exact values takes the new one; anything else — an edit
   made in the app — is left alone. */
const SEED_REPLACES = {
  'bnk-mail':   { hobby:['ดูทีวี ท่องเที่ยว เล่นเกม'] },
  'bnk-marine': { hobby:['ร้องเพลง กินข้าว ดูอนิเมะ'] },
};

function liftProfileFacts(m){
  if(!Array.isArray(m.facts) || !m.facts.length) return false;
  let changed = false;
  const take = (field, value) => {
    if(!m[field]){ m[field] = value; return true; }
    return m[field] === value;
  };
  m.facts = m.facts.flatMap(f => {
    const born = /^เกิดที่(\S+) ภูมิลำเนา(.+)$/.exec(f);
    if(born && take('hometown', born[2])){ changed = true; return ['เกิดที่' + born[1]]; }
    if(f.startsWith('บ้านเกิด') && take('hometown', f.slice('บ้านเกิด'.length))){ changed = true; return []; }
    if(f.startsWith('งานอดิเรก') && take('hobby', f.slice('งานอดิเรก'.length))){ changed = true; return []; }
    return [f];
  });
  return changed;
}

async function loadMembers(){
  const snap = await fbDb.collection('members').get();
  let stored = snap.docs.map(d => d.data());

  if(stored.length === 0){
    const batch = fbDb.batch();
    SEED_ALL_MEMBERS.forEach(m => batch.set(fbDb.collection('members').doc(m.id), m));
    await batch.commit();
    return SEED_ALL_MEMBERS.slice();
  }

  // Reconcile with the current seed: add any brand-new members that weren't
  // there before, and push a fresh photo/data change out to everyone else's
  // saved copy — same idea as the old window.storage version, just backed
  // by Firestore now so it's shared across every device instead of per-browser.
  const byId = new Map(stored.map(m => [m.id, m]));
  const batch = fbDb.batch();
  let changed = false;
  for(const seedM of SEED_ALL_MEMBERS){
    const existing = byId.get(seedM.id);
    if(!existing){
      stored.push({ ...seedM });
      batch.set(fbDb.collection('members').doc(seedM.id), seedM);
      changed = true;
    } else {
      let touched = liftProfileFacts(existing);
      for(const [field, stale] of Object.entries(SEED_REPLACES[seedM.id] || {})){
        if(stale.includes(existing[field]) && existing[field] !== seedM[field]){
          existing[field] = seedM[field];
          touched = true;
        }
      }
      if(seedM.photo && existing.photo !== seedM.photo){
        existing.photo = seedM.photo;
        touched = true;
      }
      // Fill gaps the seed has since learned about — heights, Thai names,
      // last teams. A value the stored copy already holds always wins, so
      // anything edited in the app survives.
      for(const [k, v] of Object.entries(seedM)){
        const cur = existing[k];
        // An empty list counts as a gap too: facts that arrive after a member
        // was first saved would otherwise never reach the stored copy.
        const blank = cur === null || cur === undefined || cur === '' || (Array.isArray(cur) && !cur.length);
        const filled = v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && !v.length);
        if(blank && filled){
          existing[k] = v;
          touched = true;
        }
      }
      if(touched){
        batch.set(fbDb.collection('members').doc(seedM.id), existing);
        changed = true;
      }
    }
  }
  if(changed){ try{ await batch.commit(); }catch(e){} }
  return stored;
}

  const batch = fbDb.batch();
  members.forEach(m => batch.set(fbDb.collection('members').doc(m.id), m));
  await batch.commit();

function isCaptainType(m, type){

  if(type==='group-captain') return g.captain===m.name;

// A blank bound means "no limit"; a member missing the value drops out only
// once a bound is actually set.
function applyRange(list, min, max, valueOf){
  const lo = min==='' ? null : Number(min);
  const hi = max==='' ? null : Number(max);
  if(lo===null && hi===null) return list;
  return list.filter(m=>{
    const v = valueOf(m);
    if(v==null || isNaN(v)) return false;
    return (lo===null || v>=lo) && (hi===null || v<=hi);
  });
}

// The roster as it stands before the advanced panel narrows it — kept so the

function applyAdvFilters(list){
  if(state.birthMonth!=='all') list = list.filter(m=>m.birthday && m.birthday.slice(5,7)===state.birthMonth);
  list = applyRange(list, state.ageMin, state.ageMax, m=>calcAge(m.birthday));

}

function filterAndSort(){
  let list = state.members.slice();
  const q = state.query.trim();
  // Graduated members are hidden from the default roster. The "จบการศึกษา"
  // tab shows them on their own, and a search reaches them from anywhere so
  // they stay findable without leaving the main list.
  if(state.showGraduated) list = list.filter(m=>!!m.graduated);
  else if(!q && !state.favoritesOnly) list = list.filter(m=>!m.graduated);
  if(state.favoritesOnly) list = list.filter(m=>state.oshi.includes(m.id));
  if(state.groupFilter!=='all') list = list.filter(m=>m.groupId===state.groupFilter);
  if(state.teamFilter!=='all') list = list.filter(m=>m.teamId===state.teamFilter);
  if(state.genFilter!=='all') list = list.filter(m=>m.gen===state.genFilter);
  if(state.captainFilter!=='all') list = list.filter(m=>isCaptainType(m, state.captainFilter));
  _advBase = list.slice();
  list = applyAdvFilters(list);
  if(q){
    const ql = q.toLowerCase();
    list = list.filter(m=>
      (m.name||'').toLowerCase().includes(ql) ||
      (m.nameTh||'').includes(q) ||
      (m.realName||'').toLowerCase().includes(ql) ||
      (m.realNameTh||'').includes(q)
    );
  }
  const cmp = {
    name: (a,b)=>a.name.localeCompare(b.name),
    group: (a,b)=>getGroup(a.groupId).name.localeCompare(getGroup(b.groupId).name),
    team: (a,b)=>shortTeamLabel(getTeam(a.teamId)).localeCompare(shortTeamLabel(getTeam(b.teamId))),
    gen: (a,b)=>(a.gen||99)-(b.gen||99),
    age: (a,b)=>(a.birthday||'9999-99-99').localeCompare(b.birthday||'9999-99-99'),
    birthday: (a,b)=>{
      const norm = d => d ? d.slice(5) : '99-99'; // compare month-day only, ignore birth year
      return norm(a.birthday).localeCompare(norm(b.birthday));
    },
    height: (a,b)=> state.showGraduated
      ? (a.graduated||'').localeCompare(b.graduated||'')
      : (a.height||0)-(b.height||0),
  }[state.sortBy] || ((a,b)=>a.name.localeCompare(b.name));
  list.sort(cmp);
  if(state.sortDir==='desc') list.reverse();
  return list;
}

const ALL_WORKS = () => [...SEED_SINGLES, ...SEED_ALBUMS];
/* The id used to decide this with includes('-a'), which a special such as
   bnk-sp-all-the-way would have tripped. Specials say what they are. */
const WORK_KIND = w => w.kind || (/-a\d+$/.test(w.id) ? 'album' : 'single');
const isSpecialWork = w => ['special', 'digital'].includes(WORK_KIND(w));
const findWork = id => ALL_WORKS().find(w => w.id === id) || SEED_SPECIALS.find(w => w.id === id);
const workGroups = w => w.groups || [w.groupId];
const workGroupNames = w => workGroups(w).map(id => getGroup(id).name).join(' × ');

/** How a release is referred to: its number when it has one, its kind when not. */
function workLabel(w){
  const k = WORK_KIND(w);
  return k === 'album' ? `อัลบั้มที่ ${w.num}`
       : k === 'single' ? `ซิงเกิลที่ ${w.num}`
       : k === 'special' ? 'ซิงเกิลพิเศษ' : 'ซิงเกิลดิจิทัล';
}

/** Every track of the main releases; the statistics read only these. Pass
    true to take the special releases in as well. */
function allTracks(withSpecials){
  const out = [];
  for(const w of withSpecials ? [...ALL_WORKS(), ...SEED_SPECIALS] : ALL_WORKS()){
    for(const t of (SEED_SENBATSU[w.id] || [])) out.push({ work:w, ...t });
  }
  return out;
}

/** A member's tracks: 'main' (the default), 'special', or 'all'. */
function worksOf(id, which = 'main'){
  return allTracks(which !== 'main')
    .filter(t => t.members.includes(id))
    .filter(t => which === 'all' || (which === 'special') === isSpecialWork(t.work))
    .map(t => ({ work:t.work, track:t.track, centre:t.centers.includes(id) }))
    .sort((a,b) => b.work.year-a.work.year || (b.work.num||0)-(a.work.num||0)
      || String(b.work.date||'').localeCompare(String(a.work.date||'')));
}

/* The page is locked against zooming, which is what stops the app sliding
   around under a thumb. A poster is the one thing that has to zoom, so it does
   its own: pinch to scale, drag to move once it is larger than the screen,
   double tap to go in and out. A single tap still closes, but only at rest —
   otherwise letting go of a drag would shut the picture. */
/* An installed app has no address bar to pull on, so the gesture that means
   "refresh" everywhere else had nowhere to live here. It only arms at the very
   top of the page and only when nothing is open over it: a sheet fixes the body,
   which would otherwise look exactly like being scrolled to the top. */
function bindPullToRefresh(){
  const TRIGGER = 70;
  let startY = null, startX = 0, locked = false, pulled = 0;

  const pill = document.createElement('div');
  pill.className = 'ptr';
  pill.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v5h-5"/></svg>`;
  document.body.appendChild(pill);

  // A pull that starts inside a frame scrolled away from its own top is that
  // frame's scroll, not a refresh — the zoomed position chart is one.
  const scrolledFrame = el => {
    for(; el && el !== document.body; el = el.parentElement) if(el.scrollTop > 0) return true;
    return false;
  };
  const armed = target => (window.scrollY || window.pageYOffset || 0) <= 0
    && !document.body.classList.contains('modal-locked')
    && !document.querySelector('.poster-viewer')
    && !scrolledFrame(target);

  // It slides out from under the sticky header rather than being drawn across
  // it, which is where the rest of the app's chrome already lives.
  const draw = (d) => {
    pulled = d;
    const hdr = document.querySelector('header.top');
    pill.style.top = ((hdr ? hdr.getBoundingClientRect().bottom : 0) - 40) + 'px';
    pill.style.transform = `translateX(-50%) translateY(${Math.min(d, TRIGGER + 16)}px) rotate(${d * 3}deg)`;
    pill.style.opacity = Math.max(0, Math.min(1, (d - 24) / 30));
    pill.classList.toggle('is-ready', d >= TRIGGER);
  };
  const settle = () => {
    pill.style.transition = 'transform .22s var(--ease-out), opacity .22s';
    draw(0);
    setTimeout(()=>{ pill.style.transition = ''; pill.classList.remove('is-ready'); }, 240);
  };

  // The screen's edges belong to the system: iOS swipes back from the left edge,
  // and every new screen opens scrolled to the top, which is exactly where a pull
  // arms. A thumb swiping back drifts down as it goes, so a pull that started at
  // the edge claimed the gesture and the back swipe was cancelled.
  const EDGE = 28;
  document.addEventListener('touchstart', (e)=>{
    const x = e.touches[0] ? e.touches[0].clientX : 0;
    const atEdge = x < EDGE || x > window.innerWidth - EDGE;
    startY = (!atEdge && armed(e.target) && e.touches.length === 1) ? e.touches[0].clientY : null;
    startX = startY === null ? 0 : x;
    locked = false; pulled = 0;
  }, { passive:true });

  document.addEventListener('touchmove', (e)=>{
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;
    // The top of the feed has rows that scroll sideways. A sideways swipe drifts
    // a few pixels down as a thumb moves, and without deciding which way the
    // gesture is going before claiming it, that drift was blocking the swipe.
    if(!locked){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      // Only a clearly downward drag is a pull; anything diagonal is left alone.
      if(dy <= 0 || dy < Math.abs(dx) * 1.4){ startY = null; return; }
      locked = true;
    }
    if(dy <= 0 || !armed(e.target)){ if(pulled) settle(); startY = null; return; }
    // Half distance, so it takes a deliberate pull rather than a stray swipe.
    draw(dy * 0.5);
    // Deliberately passive, and never preventDefault: this only watches. Claiming
    // the drag is what cancelled iOS's back swipe, and at the top of the page
    // there is nothing to stop anyway — iOS simply rubber-bands, which is the
    // native look of a pull.
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(startY === null) return;
    const go = pulled >= TRIGGER;
    startY = null;
    if(go){ pill.classList.add('is-loading'); location.reload(); }
    else settle();
  });

  // A cancelled gesture is one the system took away — a call arriving, an edge
  // swipe winning — not a decision to refresh. It puts the indicator back and
  // reloads nothing.
  document.addEventListener('touchcancel', ()=>{
    if(startY === null) return;
    startY = null;
    settle();
  });
}

function bindPosterZoom(){
  const view = document.querySelector('.poster-viewer');
  const img = view && view.querySelector('.poster-full');
  if(!img) return;

  let scale = 1, tx = 0, ty = 0;
  let pinchFrom = 0, scaleFrom = 1, panFrom = null, dragged = false;

  const limits = () => ({
    x: Math.max(0, (img.clientWidth  * scale - view.clientWidth)  / 2),
    y: Math.max(0, (img.clientHeight * scale - view.clientHeight) / 2),
  });
  const apply = () => {
    scale = Math.min(5, Math.max(1, scale));
    const l = limits();
    tx = Math.min(l.x, Math.max(-l.x, tx));
    ty = Math.min(l.y, Math.max(-l.y, ty));
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    view.classList.toggle('is-zoomed', scale > 1.01);
  };
  const spread = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  img.addEventListener('touchstart', (e)=>{
    dragged = false;
    if(e.touches.length === 2){ pinchFrom = spread(e.touches); scaleFrom = scale; panFrom = null; }
    else if(e.touches.length === 1 && scale > 1.01){
      panFrom = { x:e.touches[0].clientX - tx, y:e.touches[0].clientY - ty };
    }
  }, { passive:true });

  img.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchFrom){
      scale = scaleFrom * (spread(e.touches) / pinchFrom);
      dragged = true; apply();
      if(e.cancelable) e.preventDefault();
    } else if(e.touches.length === 1 && panFrom){
      tx = e.touches[0].clientX - panFrom.x;
      ty = e.touches[0].clientY - panFrom.y;
      dragged = true; apply();
      if(e.cancelable) e.preventDefault();
    }
  }, { passive:false });

  img.addEventListener('touchend', (e)=>{
    // Lifting one finger of a pinch leaves the other on the glass; it should
    // carry straight on as a drag instead of doing nothing until lifted too.
    if(e.touches.length === 1){
      pinchFrom = 0;
      if(scale > 1.01) panFrom = { x:e.touches[0].clientX - tx, y:e.touches[0].clientY - ty };
      return;
    }
    if(e.touches.length) return;
    pinchFrom = 0; panFrom = null;
    if(scale <= 1.01){ scale = 1; tx = ty = 0; apply(); }
  }, { passive:true });

  /* Double tap zooms; a single tap on the picture does nothing. Closing on a
     lone tap needed a timer to tell the two apart, and that timer kept winning
     the race and shutting the poster mid-gesture. Image viewers everywhere else
     work this way too: tap the surround to dismiss, never the picture.

     The moment of the last tap lives on the element rather than in this closure,
     so a re-render between the two halves of a double tap cannot forget it. */
  img.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(dragged){ dragged = false; return; }
    const now = Date.now();
    const prev = Number(img.dataset.tapAt || 0);
    if(now - prev < 320){
      img.dataset.tapAt = 0;
      if(scale > 1.01){ scale = 1; tx = ty = 0; } else scale = 2.5;
      apply();
      return;
    }
    img.dataset.tapAt = now;
  });

  // The dark surround dismisses, but only when it is itself what was tapped —
  // the close button sits on it and has its own handler.
  view.addEventListener('click', (e)=>{ if(e.target === view) closePoster(); });

  apply();
}

function closePoster(){ goBack(()=>{ state.posterOf = null; }); }

/* Opening a poster full screen. The larger copy is a second file fetched only

// ============================= CALENDAR =============================
// The feed answers "what is next". A month at a glance answers the other
// question — which days are busy, and what falls on the same day as what.

const THAI_DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];

function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

function shiftMonth(key, by){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m-1+by, 1);
  return monthKey(d);
}

/** Every day an event covers, not only the day it starts. */
function eventDays(ev){
  const out = [];
  const last = eventLastDay(ev);
  for(let d = new Date(ev.start+'T00:00:00'); toYmd(d) <= last; d.setDate(d.getDate()+1))
    out.push(toYmd(d));
  return out;
}

/* With the filter on, the schedule narrows to the people the reader follows.
   An event whose line-up is still unannounced cannot be said to include them,
   so it drops out — the filter only ever claims what the data actually says. */
function hasMyOshi(ev){
  return (ev.members || []).some(id => state.oshi.includes(id));
}
function isMyOshi(m){ return state.oshi.includes(m.id); }
function filteringByOshi(){ return state.oshiOnly && state.oshi.length > 0; }

function calendarIndex(){
  const events = {}, births = {};
  const mine = filteringByOshi();
  SEED_SCHEDULE.filter(ev => !mine || hasMyOshi(ev))
    // A period marks the day it opens and the day it closes; a dot on every
    // day of a six-week vote would hide the days something actually happens.
    .forEach(ev => (ev.period ? [...new Set([ev.start, eventLastDay(ev)])] : eventDays(ev))
      .forEach(day => (events[day] ??= []).push(ev)));
  activeMembers().filter(m => m.birthday).filter(m => !mine || isMyOshi(m))
    .forEach(m => (births[m.birthday.slice(5)] ??= []).push(m));   // MM-DD, any year
  return { events, births };
}

function renderCalendar(){
  const today = toYmd(todayStart());
  const key = state.calMonth || today.slice(0,7);
  const [year, month] = key.split('-').map(Number);
  const { events, births } = calendarIndex();

  const first = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const lead = first.getDay();

  const cells = [];
  for(let i=0; i<lead; i++) cells.push('<div class="cal-cell is-empty"></div>');

  for(let day=1; day<=daysInMonth; day++){
    const iso = `${key}-${String(day).padStart(2,'0')}`;
    const evs = events[iso] || [];
    const bds = births[iso.slice(5)] || [];
    const classes = ['cal-cell'];
    if(iso === today) classes.push('is-today');
    if(state.calDay === iso) classes.push('is-picked');
    if(evs.length || bds.length) classes.push('has-any');

    // At most three dots: past that the row stops being readable and the count
    // below the grid carries the detail anyway.
    const dots = [
      ...evs.slice(0,3).map(ev => {
        const g = (ev.groups||[]).length===1 ? getGroup(ev.groups[0]) : null;
        return `<i style="background:${g?g.color:'var(--ink-soft)'}"></i>`;
      }),
      ...(bds.length ? [`<i class="is-bday"></i>`] : []),
    ].slice(0,4).join('');

    cells.push(`<button class="${classes.join(' ')}" ${evs.length||bds.length?`data-action="pick-day" data-id="${iso}"`:''}>
      <span class="cal-num">${day}</span>
      <span class="cal-dots">${dots}</span>
    </button>`);
  }

  const picked = state.calDay && state.calDay.startsWith(key) ? state.calDay : null;
  const pickedEvs = picked ? (events[picked] || []) : [];
  const pickedBds = picked ? (births[picked.slice(5)] || []) : [];

  return `
  <section class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" data-action="cal-move" data-id="-1" aria-label="เดือนก่อนหน้า">‹</button>
      <div class="cal-title">${MONTH_NAMES[month-1]} ${year}</div>
      <button class="cal-nav" data-action="cal-move" data-id="1" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="cal-dow">${THAI_DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    ${picked ? `
      <div class="cal-day-detail">
        <div class="cal-day-title">${formatDate(picked)}</div>
        ${pickedBds.map(m=>{
          const g = getGroup(m.groupId);
          return `<button class="cal-item" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
            <span class="cal-item-tag">วันเกิด</span>
            <span>${escapeHtml(m.nameTh)} · ${escapeHtml(m.name)}</span>
          </button>`;
        }).join('')}
        ${pickedEvs.map(ev=>{
          const g = (ev.groups||[]).length===1 ? getGroup(ev.groups[0]) : null;
          return `<button class="cal-item" style="--c:${g?g.color:'var(--ink-soft)'}" data-action="open-event" data-id="${ev.id}">
            ${ev.time ? `<span class="cal-item-tag">${escapeHtml(ev.time)}</span>` : ''}
            <span>${escapeHtml(ev.title)}</span>
          </button>`;
        }).join('')}
      </div>` : `<p class="muted-note cal-hint">แตะวันที่มีจุดเพื่อดูว่ามีอะไร</p>`}
  </section>`;
}

/** Whole months between two dates, so a gap reads as "1 ปี 4 เดือน". */
function monthsBetween(aIso, bIso){
  const a = new Date(aIso), b = new Date(bIso);
  const [early, late] = a <= b ? [a, b] : [b, a];
  let months = (late.getFullYear()-early.getFullYear())*12 + (late.getMonth()-early.getMonth());
  if(late.getDate() < early.getDate()) months--;
  return Math.max(0, months);
}

function humanMonths(months){
  const y = Math.floor(months/12), mo = months%12;
  if(!y && !mo) return 'เท่ากัน';
  return [y ? `${y} ปี` : '', mo ? `${mo} เดือน` : ''].filter(Boolean).join(' ');
}

/** Earliest date the member is recorded as being with the group. */
function joinedOn(m){
  const hist = SEED_TEAM_HISTORY[m.id];
  if(hist && hist.length) return hist.map(r=>r.from).filter(Boolean).sort()[0] || null;
  return null;
}

function compareRows(a, b){
  const rows = [];
  const push = (label, left, right, note) => rows.push({ label, left, right, note });

  const ga = getGroup(a.groupId), gb = getGroup(b.groupId);
  push('วง', ga ? ga.name : '—', gb ? gb.name : '—',
    a.groupId === b.groupId ? 'วงเดียวกัน' : 'คนละวง');
  rows[rows.length-1].html = [ga ? linkGroup(ga) : '—', gb ? linkGroup(gb) : '—'];

  const ta = getTeam(a.teamId), tb = getTeam(b.teamId);
  push('ทีม', ta ? ta.name : '—', tb ? tb.name : '—',
    a.teamId && a.teamId === b.teamId ? 'ทีมเดียวกัน' : null);
  rows[rows.length-1].html = [ta ? linkTeam(ta) : '—', tb ? linkTeam(tb) : '—'];

  push('รุ่น', `รุ่น ${a.gen}`, `รุ่น ${b.gen}`,
    a.gen === b.gen ? 'รุ่นเดียวกัน' : `ห่างกัน ${Math.abs(a.gen-b.gen)} รุ่น`);

  const ageGap = monthsBetween(a.birthday, b.birthday);
  const older = a.birthday === b.birthday ? null : (a.birthday < b.birthday ? a : b);
  push('อายุ', `${calcAge(a.birthday)} ปี`, `${calcAge(b.birthday)} ปี`,
    older ? `${older.nameTh} โตกว่า ${humanMonths(ageGap)}` : 'เกิดวันเดียวกัน');

  push('วันเกิด', formatDateShort(a.birthday), formatDateShort(b.birthday), null);

  if(a.height && b.height){
    const d = Math.abs(a.height-b.height);
    const taller = a.height === b.height ? null : (a.height > b.height ? a : b);
    push('ส่วนสูง', `${a.height} ซม.`, `${b.height} ซม.`,
      taller ? `${taller.nameTh} สูงกว่า ${d} ซม.` : 'สูงเท่ากัน');
  } else {
    push('ส่วนสูง', a.height ? `${a.height} ซม.` : '—', b.height ? `${b.height} ซม.` : '—', null);
  }

  if(a.blood || b.blood)
    push('กรุ๊ปเลือด', a.blood || '—', b.blood || '—',
      a.blood && a.blood === b.blood ? 'กรุ๊ปเดียวกัน' : null);

  const ja = joinedOn(a), jb = joinedOn(b);
  if(ja && jb){
    const today = new Date().toISOString().slice(0,10);
    const gap = monthsBetween(ja, jb);
    push('อยู่กับวงมา', humanMonths(monthsBetween(ja, today)), humanMonths(monthsBetween(jb, today)),
      gap ? `เข้ามาห่างกัน ${humanMonths(gap)}` : 'เข้าวงพร้อมกัน');
  }

  const wa = worksOf(a.id, 'all'), wb = worksOf(b.id, 'all');
  push('ผลงานเพลง', `${wa.length} เพลง`, `${wb.length} เพลง`, null);

  const ca = wa.filter(w=>w.centre).length, cb = wb.filter(w=>w.centre).length;
  if(ca || cb) push('เซ็นเตอร์', `${ca} เพลง`, `${cb} เพลง`, null);

  // Songs both of them are on is the thing a list of two profiles cannot show.
  const shared = wa.filter(w => wb.some(x => x.work.id === w.work.id && x.track === w.track));
  rows.shared = shared;
  return rows;
}

// A stage seen from the audience: the floor recedes upstage, but the members
// standing on it are drawn upright rather than skewed with it, so faces and
// names stay readable. Depth is carried by how far in a row sits, how wide it
// spreads and how large its avatars are.
const STAGE = { front:{ y:71, w:95, s:1 }, back:{ y:24, w:64, s:0.66 } };
const lerp = (a, b, t) => a + (b - a) * t;

function renderStage(work, trackIndex, track){
  const grid = (SEED_FORMATION[work.id] || {})[trackIndex];
  if(!grid || !grid.length) return '';
  const n = grid.length;
  const depth = i => n > 1 ? i / (n - 1) : 0;          // 0 downstage, 1 upstage
  const at = (i, k) => lerp(STAGE.front[k], STAGE.back[k], depth(i));

  // floor edges, a touch outside the front and back rows
  const edge = (t, pad) => {
    const w = lerp(STAGE.front.w, STAGE.back.w, t) + pad;
    return [50 - w/2, 50 + w/2];
  };
  // The padding has to leave the floor inside the 0-100 viewBox: the SVG
  // clips anything past it, and since the outline is a stroke, a clipped
  // edge shows as a white sliver cutting the corner off.
  const [fl, fr] = edge(0, 3), [bl, br] = edge(1, 3);
  const yTop = STAGE.back.y - 14, yBot = STAGE.front.y + 17;
  const floorY = t => lerp(yBot, yTop, t);
  const floorX = (t, side) => lerp(side ? fr : fl, side ? br : bl, t);

  const divider = t => `<line x1="${floorX(t,0)}" y1="${floorY(t)}" x2="${floorX(t,1)}" y2="${floorY(t)}"
    stroke="rgba(255,255,255,.7)" stroke-width="1.3" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>`;
  const rowBands = grid.map((_, i) => i === 0 ? '' : divider((depth(i) + depth(i-1)) / 2)).join('');
  const columns = [0.2, 0.4, 0.6, 0.8].map(f => {
    const x0 = lerp(fl, fr, f), x1 = lerp(bl, br, f);
    return `<line x1="${x0}" y1="${floorY(0)}" x2="${x1}" y2="${floorY(1)}"
      stroke="rgba(255,255,255,.42)" stroke-width="1.1" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const rows = grid.map((row, i) => {
    const seats = row.map(id => {
      if(!id) return `<span class="seat is-gap" aria-hidden="true"></span>`;
      const m = getMember(id);
      if(!m) return '';
      const g = getGroup(m.groupId);
      const isCentre = track.centers.includes(id);
      return `<button class="seat${isCentre?' is-centre':''}" style="--c:${g.color}"
        data-action="open-member" data-id="${id}" title="${escapeAttr(m.name+' · '+m.nameTh)}">
        <span class="seat-badge">
          <span class="seat-face">${renderAvatar(m, 'seat-avatar', g.color)}</span>
          <span class="seat-name">${escapeHtml(m.nameTh || m.name)}</span>
        </span>
      </button>`;
    }).join('');
    return { i, html: `<div class="stage-row" style="top:${at(i,'y')}%;width:${at(i,'w')}%;

// ============================== FEED ==============================

function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function toYmd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
    + '-' + String(d.getDate()).padStart(2,'0');
}

/* Days until the next occurrence, so December birthdays surface in January.
   The feed and the stats page must agree, so they share this. */
function daysUntilBirthday(m, today){
  const [, mo, d] = m.birthday.split('-').map(Number);
  let next = new Date(today.getFullYear(), mo-1, d);
  if(next < today) next = new Date(today.getFullYear()+1, mo-1, d);
  return Math.round((next - today)/86400000);
}

function eventLastDay(ev){ return ev.end || ev.start; }

/* "28-30 ส.ค." for a run, "5 ก.ย." for a single day. */
function eventDateLabel(ev){
  const M = monthsShort();
  const [, m1, d1] = ev.start.split('-').map(Number);
  if(!ev.end) return d1 + ' ' + M[m1-1];
  const [, m2, d2] = ev.end.split('-').map(Number);
  return m1===m2 ? d1 + '-' + d2 + ' ' + M[m1-1]
                 : d1 + ' ' + M[m1-1] + ' - ' + d2 + ' ' + M[m2-1];
}

/* Everything that says "today" or "in N days" is worked out once, when the
   screen is drawn. Left open overnight the app keeps yesterday's answer: the
   birthdays of the new day never arrive, and a run that has started still reads
   as upcoming. A ticker notices the date has turned and redraws — and on the way
   past, moves the hours-and-minutes countdown on whatever is on today. */
let _drawnDay = null;

function startsInLabel(ms){
  const mins = Math.floor(ms / 60000);
  if(mins >= 60){
    const h = Math.floor(mins / 60), m = mins % 60;
    return `เริ่มใน ${h} ชม.` + (m ? ` ${m} นาที` : '');
  }
  return `เริ่มใน ${Math.max(1, mins)} นาที`;
}

/** Today's start time for an event running today and carrying a time. A run
    over several days repeats its time each day — the roadshow is the same
    programme on both dates — so every day of it counts down, not only the first. */
/* Rotas. A slot is { date, time, until, members }. */
const slotsOn = (ev, iso) => (ev.slots || []).filter(s => s.date === iso)
  .sort((a, b) => a.time.localeCompare(b.time));
const slotsFor = (ev, id) => (ev.slots || []).filter(s => s.members.includes(id))
  .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
const slotTime = (iso, hhmm) => { const d = parseYmd(iso); const [h, m] = hhmm.split(':').map(Number); d.setHours(h, m || 0, 0, 0); return d.getTime(); };

/** Today's slots and where the clock is among them: the one on now, the next
    one to start, or null for both once the day's last has ended. */
function slotNow(ev, iso){
  const today = slotsOn(ev, iso);
  const now = Date.now();
  return {
    today,
    current: today.find(s => slotTime(iso, s.time) <= now && now < slotTime(iso, s.until)) || null,
    next: today.find(s => slotTime(iso, s.time) > now) || null,
  };
}

/* When today's part of an event is over. A rota ends with its last turn of
   the day; an event can say `until:'HH:MM'`; one with only a start time is
   taken to run two hours; one with no time at all runs all day (null). */
const DEFAULT_RUN_MS = 2 * 3600000;
function endsAtToday(ev, iso){
  if(ev.slots){
    const today = slotsOn(ev, iso);
    return today.length ? slotTime(iso, today[today.length - 1].until) : slotTime(iso, '00:00');
  }
  if(ev.until) return slotTime(iso, ev.until);
  if(ev.time) return slotTime(iso, ev.time) + DEFAULT_RUN_MS;
  return null;
}
const doneForToday = (ev, iso) => { const end = endsAtToday(ev, iso); return end != null && end <= Date.now(); };

function startsAt(ev, todayIso){
  if(ev.slots){
    const { next } = slotNow(ev, todayIso);
    return next ? slotTime(todayIso, next.time) : null;
  }
  if(!ev.time || ev.start > todayIso || eventLastDay(ev) < todayIso) return null;
  const [hh, mm] = ev.time.split(':').map(Number);
  if(!Number.isFinite(hh)) return null;
  const d = parseYmd(todayIso);
  d.setHours(hh, mm || 0, 0, 0);
  return d.getTime();
}

/** The same words whether the screen was just drawn or the clock just ticked. */
function startsLabel(at){
  const left = at - Date.now();
  return left > 0 ? startsInLabel(left) : 'เริ่มแล้ว';
}

let _feedLiveKey = null;
function tickClock(){
  syncTicker();
  document.querySelectorAll('[data-starts-at]').forEach(el=>{
    el.textContent = startsLabel(Number(el.dataset.startsAt));
    localize(el.parentElement || el);
  });

  const now = toYmd(new Date());
  if(state.view === 'feed' && !state.query && !state.selectedId && !state.selectedEvent && !state.posterOf) {
    const iso = toYmd(todayStart());
    const live = SEED_SCHEDULE.filter(e => (!filteringByOshi() || hasMyOshi(e)) && !e.period
      && e.start <= iso && eventLastDay(e) >= iso && !doneForToday(e, iso)).sort((a,b) => a.start.localeCompare(b.start)).map(e => e.id).join(',');
    if(_feedLiveKey !== null && live !== _feedLiveKey){ renderMain(); return; }
  }
  if(!_drawnDay || now === _drawnDay) return;
  // Redrawing under someone loses their place, so the date is left unturned
  // until they have nothing open — the next tick finds it again.
  if(state.selectedId || state.selectedEvent || state.posterOf || state.comparePicking) return;
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  render();
}

function startClock(){
  setInterval(tickClock, 20000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') tickClock();
  });
}

function eventWhenLabel(ev, todayIso){
  const last = eventLastDay(ev);
  if(ev.start <= todayIso && last >= todayIso){
    if(!ev.period) return 'วันนี้';
    const left = Math.round((parseYmd(last) - parseYmd(todayIso)) / 86400000);
    return left === 0 ? 'วันสุดท้าย' : `เหลือ ${left} วัน`;
  }
  const days = Math.round((parseYmd(ev.start) - parseYmd(todayIso)) / 86400000);
  if(days === 1) return 'พรุ่งนี้';
  if(days > 1) return 'อีก ' + days + ' วัน';
  return '';
}
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function renderEventCard(ev, todayIso){
  const runsToday = ev.start <= todayIso && eventLastDay(ev) >= todayIso;
  const over = runsToday && !ev.period && doneForToday(ev, todayIso);
  const when = over ? 'จบแล้ว' : eventWhenLabel(ev, todayIso);
  const isNow = runsToday && !over;
  // a rota on the day it ran: the people who were there, not the whole run
  const ids = over && ev.slots ? [...new Set(slotsOn(ev, todayIso).flatMap(s => s.members))] : (ev.members || []);
  const people = ids.map(getMember).filter(Boolean);
  const mine = people.filter(m => state.oshi.includes(m.id));
  const groupTags = (ev.groups || []).map(getGroup).filter(Boolean);
  const accent = ev.poster ? ev.poster.accent
    : groupTags.length === 1 ? groupTags[0].color
    : (people.length ? getGroup(people[0].groupId).color : 'var(--ink-soft)');
  const theme = ev.poster ? `; --pc:${ev.poster.accent}; --sheet-bg:${ev.poster.surface}; --sheet-ink:${ev.poster.ink}` : '';
  const hasMore = eventHasMore(ev);
  const shown = people.slice(0, 6);
  const rest = people.length - shown.length;
  return `
  <article class="ev-card${isNow?' is-now':''}${hasMore?' is-openable':''}${ev.poster?' is-themed':''}" style="--c:${accent}${theme}"
    ${hasMore ? `data-action="open-event" data-id="${ev.id}"` : ''}>
    <div class="ev-date">
      <span class="ev-d">${eventDateLabel(ev)}</span>
      ${ev.time ? `<span class="ev-time">${ev.time}</span>` : ''}
      ${when ? `<span class="ev-when">${when}</span>` : ''}
    </div>
    <div class="ev-body">
      ${(()=>{ const at = over ? null : startsAt(ev, todayIso);
        return at ? `<span class="ev-starts" data-starts-at="${at}">${startsLabel(at)}</span>` : ''; })()}
      <h3 class="ev-title">${ev.tag==='media'?'<span class="ev-tag">Media</span>':''}${escapeHtml(ev.title)}</h3>
      ${ev.venue ? `<p class="ev-venue">${escapeHtml(ev.venue)}</p>` : ''}
      ${groupTags.length ? `<div class="ev-groups">${groupTags.map(g=>
        groupTag(g)).join('')}</div>` : ''}
      ${ev.lineupTba ? `<p class="ev-tba">รอประกาศรายชื่อ</p>` : ''}
      ${shown.length ? `<div class="ev-people">${shown.map(m=>{
        const g = getGroup(m.groupId);
        return `<button class="ev-person${state.oshi.includes(m.id)?' is-oshi':''}" style="--c:${g.color}"
          data-action="open-member" data-id="${m.id}" title="${escapeAttr(m.name)}">
          ${renderAvatar(m,'avatar-sm',g.color)}<span>${escapeHtml(m.nameTh||m.name)}</span>
        </button>`; }).join('')}${rest>0?`<span class="ev-more-people">+${rest}</span>`:''}</div>` : ''}
      ${mine.length ? `<p class="ev-mine">มีโอชิของคุณ ${mine.length} คน</p>` : ''}
      ${hasMore ? `<p class="ev-open">ดูรายละเอียด</p>` : ''}
    </div>
  </article>`;
}

/* Today's events, as the first thing under the date: the whole poster where
   there is one, a band in the event's colour where there is not. Posters keep
   their own shape — the image sits whole over a blurred copy of itself rather
   than being cropped to fit a box. */
function renderTodayHero(ev, todayIso){
  // A rota shows only who is on today, and today's hours.
  const rota = ev.slots ? slotNow(ev, todayIso) : null;
  const people = (rota ? [...new Set(rota.today.flatMap(s => s.members))] : (ev.members || []))
    .map(getMember).filter(Boolean);
  const groupTags = (ev.groups || []).map(getGroup).filter(Boolean);
  const accent = (ev.poster && ev.poster.accent)
    || (groupTags.length === 1 ? groupTags[0].color
    : (people.length ? getGroup(people[0].groupId).color : 'var(--accent)'));
  const img = ev.poster && ev.poster.img;
  const at = startsAt(ev, todayIso);
  const dayOf = ev.end ? Math.round((parseYmd(todayIso) - parseYmd(ev.start)) / 86400000) + 1 : 0;
  const days = ev.end ? Math.round((parseYmd(ev.end) - parseYmd(ev.start)) / 86400000) + 1 : 0;
  const status = rota && rota.current ? 'อยู่ที่บูธตอนนี้'
    : at ? `<span data-starts-at="${at}">${startsLabel(at)}</span>`
    : rota && rota.today.length ? 'รอบวันนี้จบแล้ว'
    : (ev.time ? 'กำลังจัดอยู่' : 'วันนี้');
  const hours = rota ? rota.today.map(s => `${s.time}–${s.until}`).join(', ') : (ev.time || '');
  const shown = people.slice(0, 8);
  const rest = people.length - shown.length;
  const open = eventHasMore(ev);
  return `
  <article class="today-hero${open ? ' is-openable' : ''}${ev.poster ? ' is-themed' : ''}" style="--c:${accent}${ev.poster ? `; --pc:${ev.poster.accent}; --sheet-bg:${ev.poster.surface}; --sheet-ink:${ev.poster.ink}` : ''}"
    ${open ? `data-action="open-event" data-id="${ev.id}"` : ''}>
    <div class="today-hero-body">
      <p class="today-hero-status"><span class="today-live" aria-hidden="true"></span>${status}${days > 1 ? ` · วันที่ ${dayOf} จาก ${days}` : ''}</p>
      <h3 class="today-hero-title">${escapeHtml(ev.title)}</h3>
      <p class="today-hero-meta">${hours ? `${hours} น.` : ''}${hours && ev.venue ? ' · ' : ''}${ev.venue ? escapeHtml(ev.venue) : ''}</p>
    </div>
    ${img ? `<div class="today-hero-art" style="--art:url('${escapeAttr(img)}')">
      <img src="${escapeAttr(img)}"${ev.poster.w ? ` width="${ev.poster.w}" height="${ev.poster.h}"` : ''} alt="โปสเตอร์งาน ${escapeAttr(ev.title)}" decoding="async">
    </div>` : (ev.theme === 'birthday' ? `<div class="today-hero-band">${renderBirthdayBanner(ev)}</div>` : '')}
    <div class="today-hero-body today-hero-foot">
      ${groupTags.length ? `<div class="ev-groups">${groupTags.map(g => groupTag(g)).join('')}</div>` : ''}
      ${shown.length ? `<div class="ev-people">${shown.map(m => {
        const g = getGroup(m.groupId);
        return `<button class="ev-person${state.oshi.includes(m.id)?' is-oshi':''}" style="--c:${g.color}"
          data-action="open-member" data-id="${m.id}" title="${escapeAttr(m.name)}">
          ${renderAvatar(m,'avatar-sm',g.color)}<span>${escapeHtml(m.nameTh||m.name)}</span>
        </button>`; }).join('')}${rest > 0 ? `<span class="ev-more-people">+${rest}</span>` : ''}</div>` : ''}
      ${open ? `<p class="today-hero-open">ดูรายละเอียด</p>` : ''}
    </div>
  </article>`;
}

/* Anything with a line-up or a write-up opens; the "to be announced"
   placeholders have nothing behind them yet, so they stay flat rather than
   leading to an empty sheet. */
function eventHasMore(ev){
  return !!(ev.info || ev.detail || (ev.members || []).length);
}


/* A birthday fanmeet gets a party header rather than the plain sheet: the
   celebrants' own portraits under hand-lettering, with the confetti drawn in
   CSS so it costs nothing to ship. */
function renderBirthdayBanner(ev){
  const faces = (ev.celebrants || []).map(getMember).filter(Boolean);
  if(!faces.length) return '';
  const confetti = [
    [6,14,-18],[17,52,24],[29,9,42],[41,64,-9],[52,20,15],
    [63,58,-33],[74,12,8],[85,46,29],[93,24,-14],[36,34,50],[58,38,-22],[81,66,12]
  ].map(([x,y,r],i)=>
    `<i class="cfi cfi${i%5}" style="left:${x}%;top:${y}%;transform:rotate(${r}deg)"></i>`).join('');
  return `
  <div class="evm-fest" aria-hidden="false">
    <span class="evm-fest-deco" aria-hidden="true">${confetti}</span>
    <span class="evm-fest-word">Birthday</span>
    <span class="evm-fest-sub">FANMEET</span>

/** Who is at the booth when: one row per slot, today's picked out, finished
    ones dimmed. Tapping a name opens that member. */
function renderSlotTable(ev){
  const iso = toYmd(todayStart());
  const now = Date.now();
  const M = monthsShort();
  const rows = ev.slots.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).map(s => {
    const [, mo, d] = s.date.split('-').map(Number);
    const done = slotTime(s.date, s.until) <= now;
    const on = !done && slotTime(s.date, s.time) <= now;
    const who = s.members.map(getMember).filter(Boolean).map(m => {
      const g = getGroup(m.groupId);
      return `<button class="ev-person${state.oshi.includes(m.id)?' is-oshi':''}" style="--c:${g.color}"
        data-action="open-member" data-id="${m.id}">${renderAvatar(m,'avatar-sm',g.color)}<span>${escapeHtml(m.nameTh||m.name)}</span></button>`;
    }).join('');
    return `<div class="slot-row${s.date === iso ? ' is-today' : ''}${done ? ' is-done' : ''}${on ? ' is-on' : ''}">
      <div class="slot-when"><span class="slot-date">${d} ${M[mo-1]}</span><span class="slot-time">${s.time}–${s.until}</span>
        ${on ? '<span class="slot-now">ตอนนี้</span>' : s.date === iso && !done ? '<span class="slot-now">วันนี้</span>' : ''}</div>
      <div class="slot-who">${who}</div>
    </div>`;
  }).join('');
  return `<h3 class="evm-head">ตารางสมาชิกประจำบูธ</h3><div class="slot-table">${rows}</div>`;
}

/* A birthday only happens once a year, so the day's card gets fireworks.
   Rockets rise from the bottom and burst in the group's colours. One rAF
   loop that stops itself when the canvas leaves the page, so switching tabs
   does not leave it spinning. */
let _fxStop = null;
function startBirthdayFireworks(){
  if(_fxStop){ _fxStop(); _fxStop = null; }
  const canvas = document.querySelector('.bday-fx');
  if(!canvas) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const ctx = canvas.getContext('2d');
  const COLOURS = GROUPS.map(g=>g.color).concat(['#E8C25A','#FFFFFF']);
  let w = 0, h = 0, dpr = 1, raf = 0, running = true;
  let rockets = [], sparks = [], next = 0;

  function size(){
    const r = canvas.getBoundingClientRect();
    if(!r.width) return false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }
  if(!size()) return;

  const rand = (a,b) => a + Math.random()*(b-a);

  function launch(){
    rockets.push({
      x: rand(w*0.15, w*0.85), y: h,
      vy: -rand(h*0.011, h*0.016),
      target: rand(h*0.16, h*0.46),
      colour: COLOURS[(Math.random()*COLOURS.length)|0]
    });
  }
  function burst(r){
    const n = 22 + ((Math.random()*10)|0);
    for(let i=0; i<n; i++){
      const a = (Math.PI*2*i)/n + rand(-0.09, 0.09);
      const sp = rand(0.9, 2.7);
      sparks.push({ x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, decay:rand(0.012, 0.024), colour:r.colour });
    }
  }

  function frame(t){
    if(!running) return;
    if(!canvas.isConnected){ stop(); return; }
    ctx.clearRect(0, 0, w, h);

    if(t > next){ launch(); next = t + rand(650, 1500); }

    rockets = rockets.filter(r=>{
      r.y += r.vy; r.vy += 0.045;
      const done = r.y <= r.target || r.vy >= 0;
      if(done){ burst(r); return false; }
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = r.colour;
      ctx.beginPath(); ctx.arc(r.x, r.y, 1.8, 0, Math.PI*2); ctx.fill();
      return true;
    });

    sparks = sparks.filter(s=>{
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.032; s.vx *= 0.985; s.vy *= 0.985;
      s.life -= s.decay;
      if(s.life <= 0) return false;
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.colour;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.9 * s.life + 0.5, 0, Math.PI*2); ctx.fill();
      return true;
    });

    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  function onResize(){ size(); }
  function stop(){
    running = false;
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
  _fxStop = stop;
  raf = requestAnimationFrame(frame);
}

/* The search box reaches everything in the database, not just the member
   table it used to filter, so it renders its own screen over whichever view
   is current for as long as there is a query. */
function searchEverything(q){
  const ql = q.toLowerCase();
  const hit = s => !!s && (String(s).toLowerCase().includes(ql) || String(s).includes(q));
  const any = (...fields) => fields.some(hit);

  return {
    members: state.members.filter(m => any(m.name, m.nameTh, m.realName, m.realNameTh)),
    tracks:  allTracks(true).filter(t => hit(t.track)),
    works:   [...ALL_WORKS(), ...SEED_SPECIALS].filter(w => any(w.title, w.alt)),
    events:  SEED_SCHEDULE.filter(e => any(e.title, e.venue)
               || (e.info || []).some(hit) || (e.detail || []).some(hit)),
    teams:   TEAMS.filter(t => hit(t.name)),
    groups:  GROUPS.filter(g => any(g.name, g.full, g.desc))
  };
}

function renderSearch(){
  const q = state.query.trim();
  const r = searchEverything(q);
  const total = r.members.length + r.tracks.length + r.works.length
    + r.events.length + r.teams.length + r.groups.length;
  const iso = toYmd(todayStart());

  // A broad query can match most of the database; showing every hit on every
  // keystroke is slow to draw and useless to read, so each group shows the
  // first few and says how many more there were.
  const section = (label, items, cap, draw) => {
    if(!items.length) return '';
    const shown = items.slice(0, cap);
    const rest = items.length - shown.length;
    return `
    <section class="feed-block">
      <h2 class="section-label">${label} · ${items.length}</h2>
      ${draw(shown)}
      ${rest ? `<p class="sr-more">และอีก ${rest} รายการ — พิมพ์ให้เจาะจงขึ้นเพื่อดูทั้งหมด</p>` : ''}
    </section>`;
  };

  const workRow = w => {
    const g = getGroup(w.groupId);
    return `<button class="sr-row" style="--c:${g.color}" data-action="open-single" data-id="${w.id}">
      <span class="sr-kind">${workLabel(w)}</span>
      <span class="sr-main">${escapeHtml(w.title)}</span>
      <span class="sr-sub">${escapeHtml(w.alt || '')}${w.alt?' · ':''}${workGroupNames(w)} · ${w.year}</span>
    </button>`;
  };

  return `
  <div class="feed-page">
    <header class="feed-head">
      <p class="feed-today">ผลการค้นหา</p>
      <h1 class="feed-title">${escapeHtml(q)}</h1>
      <p class="sr-count">${total ? 'พบ '+total+' รายการ' : 'ไม่พบอะไรที่ตรงกับคำนี้'}</p>
    </header>

    ${section('สมาชิก', r.members, 30, list =>
      `<div class="grid-mini grid-mini-oshi">${list.map(m => renderMiniCard(m)).join('')}</div>`)}

    ${section('เพลง', r.tracks, 15, list =>
      list.map(t => {
        const g = getGroup(t.work.groupId);
        return `<button class="sr-row" style="--c:${g.color}" data-action="open-single" data-id="${t.work.id}">
          <span class="sr-kind">เพลง</span>
          <span class="sr-main">${escapeHtml(t.track)}</span>
          <span class="sr-sub">${escapeHtml(t.work.title)} · ${workGroupNames(t.work)} · ${t.work.year}</span>
        </button>`; }).join(''))}

    ${section('ซิงเกิลและอัลบั้ม', r.works, 15, list => list.map(workRow).join(''))}

    ${section('ตารางงาน', r.events, 10, list =>
      list.map(e => renderEventCard(e, iso)).join(''))}

    ${section('วงและทีม', [...r.groups, ...r.teams], 12, () =>
      r.groups.map(g =>
        `<button class="sr-row" style="--c:${g.color}" data-action="filter-team-direct"
          data-group="${g.id}" data-team="all">
          <span class="sr-kind">วง</span>
          <span class="sr-main">${escapeHtml(g.name)}</span>
          <span class="sr-sub">${escapeHtml(g.full)}</span>
        </button>`).join('')
      + r.teams.map(t => {
        const g = getGroup(t.groupId);
        return `<button class="sr-row" style="--c:${g?g.color:'var(--ink-soft)'}" data-action="filter-team-direct"
          data-group="${t.groupId||'all'}" data-team="${t.id}">
          <span class="sr-kind">ทีม</span>
          <span class="sr-main">${escapeHtml(t.name)}</span>
          <span class="sr-sub">${g?g.name:''}</span>
        </button>`; }).join(''))}

    ${total ? '' : `<p class="muted-note">ลองค้นด้วยชื่อสมาชิก ชื่อเพลง ชื่อซิงเกิล ชื่องาน หรือสถานที่</p>`}
  </div>`;
}

  const mine = filteringByOshi();
  const withBday = activeMembers().filter(m => m.birthday).filter(m => !mine || isMyOshi(m));
  const todays = withBday.filter(m => m.birthday.slice(5) === iso.slice(5));
  const upcoming = withBday.map(m => ({ m, d: daysUntilBirthday(m, today) }))

/* Who answers to whom, drawn as a family tree: the manager, the group's captain
   and vice, each team with its captain and vice over the rest of its members,
   then the trainees not yet placed in a team — everyone, once. Rank reads as
   colour as well as position: the higher the seat, the stronger its fill.
   Every person opens their profile.

   With everyone on it the tree is wider than a phone, so each is drawn at a
   fixed size inside its own frame and can be zoomed: pinched, with the
   buttons, or ctrl-scrolled on a trackpad. It opens fitted to the frame. */
const ORG_TEAM_W = 250, ORG_GAP = 12, ORG_PAD = 12;
const _orgZoom = {};

function renderOrgChart(){
  const node = (m, role, g, rank, term) => m
    ? `<button class="org-node rank-${rank}" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
        ${renderAvatar(m, 'org-avatar', g.color)}
        <span class="org-role">${role}</span>
        <span class="org-name">${escapeHtml(m.nameTh || m.name)}</span>
        ${term ? `<span class="org-term">${term}</span>` : ''}
      </button>`
    : `<div class="org-node rank-${rank} is-empty" style="--c:${g.color}">
        <span class="org-role">${role}</span>
        <span class="org-name">ยังไม่มีข้อมูล</span>
      </div>`;
  const tier = (slots, cls) => slots.length
    ? `<div class="org-tier${cls ? ' ' + cls : ''}">${slots.map(s => `<div class="org-slot">${s}</div>`).join('')}</div>`
    : '';
  const chips = (list, g) => list.map(m => `<button class="ev-person" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
      ${renderAvatar(m, 'avatar-sm', g.color)}<span>${escapeHtml(m.nameTh || m.name)}</span></button>`).join('');

  const tree = g => {
    const held = SHIHAININ.filter(r => r.groupId === g.id);
    const now = held.find(r => r.current);
    const before = held.filter(r => !r.current && getMember(r.memberId));
    const years = r => r.from ? ` <span class="org-term">${r.from.slice(0,4)}–${r.to ? r.to.slice(0,4) : ''}</span>` : '';
    const top = node(now && getMember(now.memberId), 'ชิไฮนิน', g, 1, now && now.from ? `ตั้งแต่ ${formatDate(now.from)}` : '')
      + (before.length ? `<div class="org-past">ก่อนหน้า ${before.map(r => linkMember(getMember(r.memberId)) + years(r)).join(' · ')}</div>` : '');

    const captains = [];
    if(g.captain) captains.push(node(memberNamed(g.captain, g.id), 'กัปตันวง', g, 2));
    if(g.viceCaptain) captains.push(node(memberNamed(g.viceCaptain, g.id), 'รองกัปตันวง', g, 2));

    // Everyone appears once, in the highest seat they hold: a group captain who
    // also belongs to a team is drawn as group captain, not again in that team.
    const placedAbove = new Set([memberNamed(g.captain, g.id), memberNamed(g.viceCaptain, g.id)].filter(Boolean));
    const teams = getTeamsForGroup(g.id).filter(t => !/trainee/.test(t.id));
    const teamCols = teams.map(t => {
      const cap = memberNamed(t.captain, g.id), vice = memberNamed(t.viceCaptain, g.id);
      const roster = activeMembers().filter(m => m.teamId === t.id);
      const rest = roster
        .filter(m => m !== cap && m !== vice && !placedAbove.has(m))
        .sort((a, b) => a.name.localeCompare(b.name));
      // A team with no vice on record still shows the seat, so the gap is visible.
      return `<div class="org-team">
        <div class="org-team-name">${linkTeam(t)} · ${roster.length} คน</div>
        <div class="org-leads">
          ${node(cap, 'กัปตันทีม', g, 3)}
          ${node(vice, 'รองกัปตันทีม', g, 3)}
        </div>
        ${rest.length ? `<div class="org-members"><div class="ev-people">${chips(rest, g)}</div></div>` : ''}
      </div>`;
    });

    const traineeTeam = getTeamsForGroup(g.id).find(t => /trainee/.test(t.id));
    const trainees = activeMembers().filter(m => m.groupId === g.id && /trainee/.test(m.teamId || ''))
      .sort((a, b) => a.name.localeCompare(b.name));
    const traineeBox = trainees.length ? `<div class="org-trainees">
        <div class="org-team-name">${traineeTeam ? linkTeam(traineeTeam, 'เด็กฝึก') : 'เด็กฝึก'} · ${trainees.length} คน</div>
        <div class="ev-people">${chips(trainees, g)}</div>
      </div>` : '';

    const width = Math.max(370, teams.length * ORG_TEAM_W + (teams.length - 1) * ORG_GAP) + ORG_PAD * 2;
    return `<div class="group-card org-tree" style="--c:${g.color}">
      <div class="group-head">
        <h2 style="color:${g.color}">${linkGroup(g)}</h2>
        <div class="org-zoom" data-group="${g.id}">
          <button type="button" data-org-zoom="out" aria-label="ซูมออก">−</button>
          <button type="button" data-org-zoom="fit" aria-label="พอดีกรอบ">พอดี</button>
          <button type="button" data-org-zoom="in" aria-label="ซูมเข้า">+</button>
        </div>
      </div>
      <div class="org-viewport" data-group="${g.id}">
        <div class="org-canvas" data-w="${width}" style="width:${width}px">
          ${tier([top], 'is-first')}
          ${tier(captains)}
          ${tier(teamCols, 'is-teams')}
          ${tier(traineeBox ? [traineeBox] : [], 'is-wide')}
        </div>
      </div>
    </div>`;
  };

  const legend = [['ชิไฮนิน', 1], ['กัปตันวง', 2], ['กัปตันทีม', 3], ['สมาชิกทีม', 4], ['เด็กฝึก', 5]];
  return renderMembersTabs() + `
    <div class="org-legend" style="--c:${GROUPS[0].color}">
      ${legend.map(([label, r]) => `<span class="org-key"><i class="rank-swatch rank-${r}"></i>${label}</span>`).join('<span class="org-key-arrow">›</span>')}
    </div>
    <p class="org-hint">บีบนิ้วหรือกด + − เพื่อซูม · แตะชื่อเพื่อดูโปรไฟล์</p>
    <div class="org-groups">${GROUPS.map(tree).join('')}</div>`;
}

function bindOrgZoom(){
  document.querySelectorAll('.org-viewport').forEach(vp => {
    const canvas = vp.querySelector('.org-canvas');
    const gid = vp.dataset.group;
    const w = Number(canvas.dataset.w);
    const fit = Math.min(1, vp.clientWidth / w);
    let z = Math.min(2, Math.max(fit, _orgZoom[gid] || fit));

    const apply = () => {
      canvas.style.zoom = z;
      _orgZoom[gid] = z;
    };
    // Zoom about a point in the frame, so what is under the fingers stays there.
    const zoomTo = (nz, fx, fy) => {
      nz = Math.min(2, Math.max(fit, nz));
      const cx = (vp.scrollLeft + fx) / z, cy = (vp.scrollTop + fy) / z;
      z = nz; apply();
      vp.scrollLeft = cx * z - fx;
      vp.scrollTop = cy * z - fy;
    };
    apply();

    let pinch = null;
    const spread = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    vp.addEventListener('touchstart', e => {
      if(e.touches.length !== 2) return;
      const r = vp.getBoundingClientRect();
      pinch = { d: spread(e.touches), z,
        fx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left,
        fy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top };
    }, { passive:true });
    vp.addEventListener('touchmove', e => {
      if(!pinch || e.touches.length !== 2) return;
      if(e.cancelable) e.preventDefault();
      zoomTo(pinch.z * spread(e.touches) / pinch.d, pinch.fx, pinch.fy);
    }, { passive:false });
    vp.addEventListener('touchend', e => { if(e.touches.length < 2) pinch = null; });
    vp.addEventListener('wheel', e => {
      if(!e.ctrlKey) return;                       // a trackpad pinch arrives as ctrl+wheel
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      zoomTo(z * (1 - e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    }, { passive:false });

    const bar = document.querySelector(`.org-zoom[data-group="${gid}"]`);
    if(bar) bar.onclick = e => {
      const b = e.target.closest('[data-org-zoom]');
      if(!b) return;
      const cx = vp.clientWidth / 2, cy = Math.min(vp.clientHeight, 240) / 2;
      if(b.dataset.orgZoom === 'fit'){ zoomTo(fit, 0, 0); vp.scrollLeft = 0; vp.scrollTop = 0; }
      else zoomTo(z * (b.dataset.orgZoom === 'in' ? 1.25 : 0.8), cx, cy);
    };
  });
}

function renderBar(label, value, max, color, drill){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  const inner = `<span class="bar-label">${escapeHtml(label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
    <span class="bar-val">${value}</span>`;
  const style = `--c:${color||'var(--ink)'}`;
  if(!drill || !value) return `<div class="bar-row" style="${style}">${inner}</div>`;
  // HTML attribute names are case-insensitive, so a camelCase key would arrive
  // as dataset.agemin. Emit kebab-case and the dataset camelCases it back.
  const attrs = Object.entries(drill)
    .map(([k,v])=>`data-${k.replace(/[A-Z]/g, c=>'-'+c.toLowerCase())}="${escapeAttr(v)}"`).join(' ');
  return `<button class="bar-row" style="${style}" data-action="drill" ${attrs}>${inner}</button>`;
}

function renderStatsSongs(){

    for(const id of t.centers) centres.set(id, (centres.get(id)||0)+1);
  }
  // A track can be a solo or a duet, so the mean says more than the range alone.
  const sizes = tracks.map(t=>t.members.length);
  const mean = sizes.length ? Math.round(sizes.reduce((s,n)=>s+n,0)/sizes.length) : 0;

  const top = (map, n) => [...map.entries()]
    .filter(([id])=>getMember(id))
    .sort((a,b)=> b[1]-a[1] || getMember(a[0]).name.localeCompare(getMember(b[0]).name))
