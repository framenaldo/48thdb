<style>
  :root{
    --ink:#1C1329;
    --paper:#FFF3F7;
    --paper-dim:#FCE8F0;
    --card:#FFFFFF;
    --bnk:#E4457E;
    --bnk-soft:#FBE4EE;
    --cgm:#2E8C82;
    --cgm-soft:#E1F1EE;
    --gold:#C08A2E;
    --ink-soft:#6E6577;
    --line:#EBDCE4;
    --pink:#FF6FA5;
    --pink-soft:#FFD6E8;
    --mint:#2FD8A9;
    --mint-soft:#C9FBEA;
    --radius:8px;
    --danger:#B84545;
    --danger-soft:#FBEAEA;
    --cgm-soft-edge:#BFDFDA;
    --scrim:rgba(28,19,41,.42);
    /* One knob scales every frosted-white overlay, so the whole glass
       treatment can be dialled down at once for the dark palette. */
    --glass-k:1;
    --shadow-rgb:28,19,41;
    --bg-body:
      radial-gradient(circle at 8% 8%, rgba(255,111,165,.35), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(47,216,169,.30), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(47,216,169,.28), transparent 42%),
      radial-gradient(circle at 90% 92%, rgba(255,111,165,.30), transparent 45%),
      linear-gradient(160deg, #FFF3F7 0%, #FFF7EF 45%, #EFFDF7 100%);
    --bg-header:linear-gradient(135deg, rgba(255,111,165,.32), rgba(47,216,169,.28));
    --bg-nav:linear-gradient(135deg, rgba(255,111,165,.4), rgba(47,216,169,.36));
    color-scheme:light;
  }

  /* Dark palette. Only the tokens change — every rule above is written in
     terms of them, so nothing here needs to restate layout or structure. */
  :root[data-theme="dark"]{
    --ink:#F0E9F5;
    --ink-soft:#A99DB6;
    --paper:#16111E;
    --paper-dim:#251E32;
    --card:#1E1729;
    --line:#362C45;
    --bnk:#FF6C9F;
    --bnk-soft:#3E2130;
    --cgm:#48C4B6;
    --cgm-soft:#16332E;
    --cgm-soft-edge:#2A5B54;
    --gold:#D3A14A;
    --danger:#F08585;
    --danger-soft:#3B2020;
    --scrim:rgba(0,0,0,.62);
    --glass-k:.14;
    --shadow-rgb:0,0,0;
    --bg-body:
      radial-gradient(circle at 8% 8%, rgba(255,111,165,.16), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(47,216,169,.13), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(47,216,169,.12), transparent 42%),
      radial-gradient(circle at 90% 92%, rgba(255,111,165,.13), transparent 45%),
      linear-gradient(160deg, #17111F 0%, #191320 45%, #111C1B 100%);
    --bg-header:linear-gradient(135deg, rgba(255,111,165,.15), rgba(47,216,169,.13));
    --bg-nav:linear-gradient(135deg, rgba(255,111,165,.2), rgba(47,216,169,.17));
    color-scheme:dark;
    /* motion */
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  @keyframes viewFadeIn{ from{opacity:0;} to{opacity:1;} }
  .view-fade-in{ animation:viewFadeIn .18s linear; }
  @keyframes starPop{
    0%{ transform:scale(1) rotate(0deg); }
    28%{ transform:scale(1.5) rotate(-14deg); }
    52%{ transform:scale(.88) rotate(7deg); }
    74%{ transform:scale(1.14) rotate(-3deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .star-pop{ animation:starPop .55s var(--ease-out); }
  body.modal-locked{ position:fixed; left:0; right:0; overflow:hidden; }
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai',sans-serif;
    background:var(--bg-body);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{font-family:'Noto Sans Thai',sans-serif;}
  .mono{font-family:'Noto Sans Thai',sans-serif;}
  button, select, input, textarea{ font-family:inherit; }
  a{ color:inherit; }

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--bg-header);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    color:var(--ink);
    padding:14px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,calc(.5*var(--glass-k)));
  }
  .wordmark{
    font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:21px; letter-spacing:.3px;
    display:flex; flex-direction:column; line-height:1.15; margin-right:4px;
  }
  .wordmark small{
    font-family:'Noto Sans Thai',sans-serif; font-weight:500; font-size:9px; letter-spacing:2.5px;
    color:var(--ink-soft); margin-top:5px;
  }
  .search-box{
    flex:1; min-width:150px; max-width:420px;
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
    border-radius:20px;
    padding:9px 16px;
    color:var(--ink);
    font-size:14px;
    outline:none;
  }
  .search-box::placeholder{color:var(--ink-soft);}
  .search-box:focus{ border-color:rgba(255,255,255,calc(.95*var(--glass-k))); background:rgba(255,255,255,calc(.65*var(--glass-k))); }

  .btn-add{
    background:var(--gold); color:#241a06; border:none;
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:14px;
    padding:9px 18px; border-radius:20px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-add:hover{ filter:brightness(1.08); }

  .glass-nav{
    position:fixed; z-index:30;
    left:50%; bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; align-items:center; gap:6px;
    padding:13px 22px;
    border-radius:999px;
    background:var(--bg-nav);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,calc(.55*var(--glass-k)));
    box-shadow:0 10px 30px rgba(var(--shadow-rgb),.18);
    max-width:calc(100vw - 24px);
  }
  .glass-nav button{
    background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    padding:5px 12px;
    transition:color .15s ease, transform .1s ease;
  }
  .glass-nav button:active{ transform:scale(.88); }
  .glass-nav button .gnav-icon{ width:25px; height:25px; }
  .glass-nav button .gnav-icon svg{ width:100%; height:100%; display:block; }
  .glass-nav button.active{ color:var(--ink); }


  .filter-bar{
    display:flex; gap:8px; padding:14px 20px; flex-wrap:wrap; align-items:center;
    border-bottom:1px solid var(--line);
  }
  .pill{
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:500;
    padding:6px 15px; border-radius:14px; border:1.5px solid var(--ink-soft);
    background:var(--paper-dim); cursor:pointer; color:var(--ink);
  }
  /* graduated roster: tucked behind its own pill, muted until switched on */
  .pill-grad{
    display:inline-flex; align-items:center; gap:6px;
    border-style:dashed; border-color:var(--gold);
    color:var(--gold); background:transparent;
  }
  .pill-grad.active{
    background:var(--gold); color:#fff; border-style:solid; border-color:transparent;
  }
  .pill-grad .grad-cap{ display:inline-flex; width:14px; height:14px; }
  .pill-grad .grad-cap svg{ width:100%; height:100%; display:block; }
  .grad-tag{
    display:inline-flex; width:13px; height:13px; margin-left:5px;
    color:var(--gold); vertical-align:-1px;
  }
  .grad-tag svg{ width:100%; height:100%; display:block; }
  .grad-note{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; color:var(--ink-soft);
    background:#FBF4E6; border:1px solid #EBD9B4; border-radius:10px;
    padding:8px 12px; margin:0 0 12px;
  }
  /* transferred between groups rather than graduated from the first one */
  .transfer-tag{ color:var(--cgm); }
  .transfer-note{ background:var(--cgm-soft); border-color:var(--cgm-soft-edge); }
  .transfer-note .grad-cap{ color:var(--cgm)!important; }
  .grad-note .grad-cap{ display:inline-flex; width:15px; height:15px; color:var(--gold); flex-shrink:0; }
  .grad-note .grad-cap svg{ width:100%; height:100%; display:block; }

  select.filter-select{
    font-size:13px; padding:7px 10px;
    border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .count-tag{ font-family:'Noto Sans Thai',sans-serif; font-size:12px; color:var(--ink-soft); margin-left:auto; }
  .gen-filter-chip{
    font-family:'Noto Sans Thai',sans-serif; font-size:12px; font-weight:600;
    background:var(--ink); color:#fff; border:none; border-radius:12px;
    padding:4px 10px; cursor:pointer; margin-left:8px;
  }
  .gen-filter-chip:active{ filter:brightness(1.3); }

  main{ padding:20px 20px calc(104px + env(safe-area-inset-bottom)); max-width:1100px; margin:0 auto; min-height:60vh; }

  .thead-sticky-outer{
    position:sticky; top:120px; z-index:15;
    margin:0 -16px; width:calc(100% + 32px);
    overflow:hidden;
    border-top:1px solid var(--line);
  }
  .thead-sticky-track{ width:max-content; will-change:transform; }
  .table-wrap{
    border-bottom:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden; background:var(--card);
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    margin:0 -16px; width:calc(100% + 32px);
  }
  .dtable{ display:flex; flex-direction:column; min-width:100%; width:max-content; }
  .dtable .row{
    display:flex; align-items:center; position:relative; isolation:isolate;
    border-bottom:1px solid var(--line); border-left:4px solid var(--c,transparent);
    background:var(--card);
  }
  .dtable .row:last-child{ border-bottom:none; }
  .dtable .row:not(.head){ cursor:pointer; transition:background .12s ease; }
  .dtable .row:not(.head):active{ background:var(--paper-dim); }
  .dtable .row.head{
    background:linear-gradient(135deg, rgba(255,111,165,.3), rgba(47,216,169,.26));
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-left:none;
  }
  .dtable .row.head .cell{
    font-family:'Noto Sans Thai',sans-serif; font-size:15px; letter-spacing:.5px;
    color:var(--ink-soft); text-transform:uppercase; font-weight:600;
    scroll-snap-align:start; background:transparent;
  }
  .sortable-th{ cursor:pointer; user-select:none; }
  .sortable-th:active{ background:rgba(255,255,255,calc(.25*var(--glass-k))) !important; }
  .sortable-th.active-sort{ color:var(--ink); }
  .dtable .cell:not(.sticky-name){ border-right:1px solid var(--line); }
  .dtable .row.head .cell:not(.sticky-name){ border-right:1px solid rgba(255,255,255,calc(.4*var(--glass-k))); }
  .dtable .cell{
    flex:0 0 auto; padding:10px 7px; font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:relative; z-index:1; background:var(--card);
  }
  .dtable .cell.mono{ font-family:'Noto Sans Thai',sans-serif; font-size:13px; }
  .dtable .cell.sticky-name{
    display:flex; align-items:center; gap:7px;
    width:158px; background:var(--card); border-right:1px solid var(--line);
  }
  .dtable .row.head .cell.sticky-name{ background:transparent; border-right:1px solid rgba(255,255,255,calc(.45*var(--glass-k))); }
  .dtable .row:not(.head):active .cell.sticky-name{ background:var(--paper-dim); }
  .col-group{ width:94px; }
  .col-team{ width:140px; }
  .col-gen{ width:56px; text-align:center; }
  .col-age{ width:64px; text-align:center; }
  .col-birthday{ width:92px; }
  .col-height{ width:82px; text-align:center; }
  /* the graduation date needs more room than a height does */
  .dtable.grad-mode .col-height{ width:108px; }
  .col-fav{ width:36px; text-align:center; padding-left:6px; padding-right:6px; }

  .captain-badge{
    display:inline-block; text-align:center; line-height:15px;
    min-width:16px; height:15px; padding:0 3px; margin-left:5px;
    background-color:var(--badge-c,var(--gold));
    color:#fff; font-size:8.5px; font-weight:800; border-radius:4px;
    letter-spacing:.2px; vertical-align:middle; box-shadow:0 1px 2px rgba(0,0,0,.25);
  }

  .avatar-sm{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:13px; color:#fff;
  }
  .name-block{ overflow:hidden; }
  .name-block .name-en{ font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:14.5px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; }
  .name-block .name-th{ font-size:12px; line-height:1.3; margin-top:1px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; }
  .group-chip{
    font-family:'Noto Sans Thai',sans-serif; font-size:10.5px; font-weight:600; color:#fff;
    padding:2px 6px; border-radius:7px; display:inline-block;
  }
  .fav-btn-sm{ background:none; border:none; color:var(--gold); font-size:17px; cursor:pointer; padding:2px; line-height:1; }

  .avatar-sm, .detail-avatar{ position:relative; overflow:hidden; }
  .avatar-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .avatar-fallback{ position:relative; z-index:0; }

  .chip-row{ display:flex; gap:5px; margin-top:9px; flex-wrap:wrap; }
  .chip{
    font-family:'Noto Sans Thai',sans-serif; font-size:9.5px; padding:3px 8px; border-radius:8px;
    background:var(--paper-dim); color:var(--ink-soft); letter-spacing:.2px; white-space:nowrap;
  }
  .chip.gold{ background:var(--gold); color:#fff; }

  .fav-btn{
    position:absolute; top:12px; right:12px; background:none; border:none;
    font-size:19px; cursor:pointer; color:var(--gold); line-height:1; padding:2px;
  }

  .empty-state{ text-align:center; padding:70px 20px; color:var(--ink-soft); grid-column:1/-1; }
  .empty-state p{ font-size:14px; }

  /* detail view */
  .back-btn{
    background:none; border:none; font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:14px;
    color:var(--ink-soft); cursor:pointer; padding:0; margin-bottom:18px; display:inline-block;
  }
  .back-btn:hover{ color:var(--ink); }
  .modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:var(--scrim);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:24px 18px;
    animation:modalFadeIn .2s ease;
  }
  @keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPopIn{ from{transform:scale(.94) translateY(10px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
  .modal-glass-card{
    position:relative; width:100%; max-width:460px; max-height:calc(100% - 8px);
    background:rgba(255,255,255,calc(.7*var(--glass-k)));
    backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,calc(.55*var(--glass-k)));
    border-radius:24px;
    box-shadow:0 20px 60px rgba(var(--shadow-rgb),.35);
    animation:modalPopIn .22s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column;
  }
  .modal-scroll{ overflow-y:auto; padding:22px 18px 28px; -webkit-overflow-scrolling:touch; }
  .modal-close-btn{
    position:absolute; top:14px; right:14px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,calc(.7*var(--glass-k))); border:1px solid rgba(255,255,255,calc(.6*var(--glass-k)));
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .modal-close-btn svg{ width:16px; height:16px; }
  .modal-close-btn:active{ background:rgba(255,255,255,calc(.95*var(--glass-k))); }

  .back-btn-sticky{
    position:sticky; top:132px; z-index:20;
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    color:var(--ink); margin-bottom:14px;
  }
  .back-btn-sticky svg{ width:17px; height:17px; display:block; }
  .back-btn-sticky:active{ background:var(--paper-dim); }
  .detail-head{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px; }
  .detail-avatar{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:34px; color:#fff; flex-shrink:0;
  }
  .detail-name-th{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:29px; line-height:1.15; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail-name-en{ font-size:14px; color:var(--ink-soft); margin-top:3px; }
  .badge{
    display:inline-block; font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:12px;
    padding:4px 12px; border-radius:12px; color:#fff; margin-right:6px; margin-top:9px;
    border:none;
  }
  .badge-link{ cursor:pointer; }
  .badge-link:active{ filter:brightness(.88); }

  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:22px 0 18px;
  }
  .stat-cell{ background:var(--card); padding:12px 14px; }
  .stat-cell .label{ font-family:'Noto Sans Thai',sans-serif; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; }
  .stat-cell .value{ font-family:'Noto Sans Thai',sans-serif; font-size:16px; font-weight:600; margin-top:5px; }

  h3.section-label{ font-family:'Noto Sans Thai',sans-serif; font-size:14px; font-weight:600; color:var(--ink-soft); margin:22px 0 6px; text-transform:uppercase; letter-spacing:.4px; }
  .facts-list{ list-style:none; padding:0; margin:8px 0; }
  .facts-list li{ padding:9px 0 9px 18px; position:relative; font-size:14.5px; border-bottom:1px solid var(--line); }
  .facts-list li:before{ content:'\2013'; position:absolute; left:0; color:var(--ink-soft); }
  .muted-note{ color:var(--ink-soft); font-size:14px; }

  .team-history{ list-style:none; padding:0; margin:8px 0 0; }
  .team-history li{
    display:flex; align-items:center; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .team-history li:last-child{ border-bottom:none; }
  .th-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .th-team{ font-weight:600; }
  .th-range{ margin-left:auto; color:var(--ink-soft); font-size:12.5px; white-space:nowrap; }
  .th-now{ color:var(--ink); font-weight:600; }

  .works-count{ color:var(--ink-soft); font-size:12.5px; margin:6px 0 0; }
  .work-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .work-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--paper-dim); border:1px solid var(--line); border-radius:11px;
    padding:9px 12px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .work-row:hover{ border-color:var(--ink-soft); }
  .work-row.is-centre{
    border-color:var(--gold);
    background:color-mix(in srgb, var(--gold) 12%, var(--paper-dim));
  }
  .work-main{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .work-track{ font-weight:600; font-size:14px; }
  .work-from{ font-size:11.5px; color:var(--ink-soft); }
  .work-centre{
    flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em;
    background:var(--gold); color:#fff; padding:3px 7px; border-radius:6px;
  }

  .action-row{ display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; }
  .btn-secondary{
    background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:14px; padding:9px 18px; border-radius:20px; cursor:pointer;
  }
  .btn-danger{
    background:none; color:var(--danger); border:1px solid var(--danger);
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13px; padding:9px 17px; border-radius:20px; cursor:pointer;
  }

  /* groups view */
  .group-card{
    background:var(--card); border-radius:10px; border-top:4px solid var(--c);
    box-shadow:0 1px 3px rgba(var(--shadow-rgb),.08); padding:22px; margin-bottom:20px;
  }
  .group-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .group-head h2{ margin:0; font-size:27px; font-family:'Noto Sans Thai',sans-serif; font-weight:800; }
  .group-card p{ font-size:14.5px; line-height:1.6; margin:6px 0 12px; }
  .team-row{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-dim); border:none; border-radius:7px; padding:11px 15px; margin-bottom:6px;
    cursor:pointer; font-family:'Noto Sans Thai',sans-serif; font-size:14px; text-align:left; color:var(--ink);
  }
  .team-row:active{ background:var(--line); }
  .team-row span.mono{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; color:var(--ink-soft); }

  /* discography */
  .timeline{ position:relative; padding-left:26px; margin-top:8px; }
  .timeline:before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .timeline-item{ position:relative; padding-bottom:22px; }
  .timeline-item:before{ content:''; position:absolute; left:-26px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--c,var(--ink)); border:2px solid var(--paper); }
  .timeline-year{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; color:var(--ink-soft); }
  .timeline-title{ font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:16.5px; margin-top:2px; }

  /* sub-tabs shared by the stats screens */
  .subtab-bar{ display:flex; gap:6px; margin:0 0 4px; flex-wrap:wrap; }
  .subtab{
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.6*var(--glass-k)));
    color:var(--ink-soft); border-radius:20px; padding:7px 15px; cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:600;
    transition:background .18s var(--ease-out), color .18s var(--ease-out);
  }
  .subtab.active{ background:var(--ink); color:var(--paper); border-color:transparent; }

  /* proportional bars used by the distribution blocks */
  .bar-row{ display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:10px; margin-bottom:7px; }
  .bar-label{ font-size:12.5px; color:var(--ink-soft); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ display:block; background:var(--paper-dim); border-radius:999px; height:16px; overflow:hidden; }
  .bar-fill{ display:block; height:100%; border-radius:999px; background:var(--c,var(--ink)); min-width:2px; transition:width .5s var(--ease-out); }
  .bar-val{ font-size:12.5px; font-weight:600; }
  .stats-note{ color:var(--ink-soft); font-size:12.5px; margin:10px 0 0; }

  /* discography rows and the line-up page */
  button.single-row{
    display:block; width:100%; text-align:left; background:none; border:none;
    font:inherit; color:inherit; cursor:pointer; padding:0 6px 22px 0; margin-left:-6px;
    padding-left:6px; border-radius:8px; transition:background .16s var(--ease-out);
  }
  .single-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  @media (hover:hover){ button.single-row:hover{ background:var(--paper-dim); } }
  .single-head{ border-left:4px solid var(--c); padding:2px 0 2px 14px; margin:4px 0 6px; }
  .single-head h2{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:26px; margin:4px 0 0; }
  .single-th{ color:var(--ink-soft); font-size:14.5px; margin:3px 0 0; }
  .title-alt{ font-weight:500; font-size:13px; color:var(--ink-soft); }
  .album-singles{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
  .chip-link{ cursor:pointer; border:1px solid var(--line); font-family:'Noto Sans Thai',sans-serif; }
  @media (hover:hover){ .chip-link:hover{ background:var(--paper-dim); } }
  .track-block{ margin:0 0 26px; }
  .track-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:18px 0 2px; }
  .track-tag{
    flex-shrink:0; font-family:'Noto Sans Thai',sans-serif; font-size:10px; font-weight:700;
    padding:3px 8px; border-radius:5px; background:var(--paper-dim); color:var(--ink-soft);
  }
  .track-tag.lead{ background:var(--gold); color:#241a06; }
  .track-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15.5px; }
  .track-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 9px; }
  .is-center .mini-card{ box-shadow:0 0 0 2px var(--gold) inset; }
  .is-center .mini-card:after{
    content:'CENTER'; position:absolute; left:50%; transform:translateX(-50%); bottom:-7px;
    font-family:'Noto Sans Thai',sans-serif; font-size:7.5px; font-weight:800; letter-spacing:.5px;
    background:var(--gold); color:#241a06; padding:1px 5px; border-radius:4px;
  }

  /* anything that jumps through to a filtered roster */
  button.bar-row{
    width:100%; background:none; border:none; padding:2px 4px; margin:0 -4px 5px;
    border-radius:7px; cursor:pointer; font:inherit; color:inherit; text-align:left;
    transition:background .16s var(--ease-out);
  }
  button.stat-cell{
    border:none; cursor:pointer; font:inherit; color:inherit; text-align:left; width:100%;
    transition:background .16s var(--ease-out);
  }
  .link-inline{
    background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit;
    text-decoration:underline; text-decoration-color:color-mix(in srgb, currentColor 35%, transparent);
    text-underline-offset:3px;
  }
  .link-inline.strong{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15px; }
  .link-h2{
    background:none; border:none; padding:0; cursor:pointer; text-align:left;
    font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:27px; color:inherit;
  }
  .link-inline:active, .link-h2:active{ opacity:.6; }
  @media (hover:hover){
    button.bar-row:hover{ background:var(--paper-dim); }
    button.stat-cell:hover{ background:var(--paper-dim); }
    .link-inline:hover, .link-h2:hover{ text-decoration-color:currentColor; }
  }

  /* birthdays */
  .bday-next{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch; }
  .bday-next::-webkit-scrollbar{ display:none; }
  .bday-chip{
    flex:0 0 auto; display:flex; align-items:center; gap:9px; cursor:pointer; text-align:left;
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c,var(--ink));
    border-radius:10px; padding:9px 13px 9px 11px; font-family:'Noto Sans Thai',sans-serif;
    color:var(--ink); box-shadow:0 1px 3px rgba(var(--shadow-rgb),.08);
  }
  .bday-chip .when{ font-size:11px; color:var(--ink-soft); }
  .bday-chip .who{ font-size:14px; font-weight:600; margin-top:1px; }
  .bday-chip.today{ border-color:var(--gold); background:var(--bnk-soft); }
  .month-block{ margin-bottom:16px; }
  .month-head{
    display:flex; align-items:baseline; gap:8px; margin:0 0 7px;
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15px;
  }
  .month-head .n{ font-size:12px; font-weight:500; color:var(--ink-soft); }
  .bday-row{
    display:flex; align-items:center; gap:10px; width:100%; cursor:pointer; text-align:left;
    background:var(--card); border:none; border-bottom:1px solid var(--line);
    padding:9px 12px; font-family:'Noto Sans Thai',sans-serif; font-size:14px; color:var(--ink);
  }
  .bday-row:first-child{ border-top-left-radius:9px; border-top-right-radius:9px; }
  .bday-row:last-child{ border-bottom:none; border-bottom-left-radius:9px; border-bottom-right-radius:9px; }
  .bday-row:active{ background:var(--paper-dim); }
  .bday-row .day{ font-weight:700; width:26px; flex-shrink:0; color:var(--c,var(--ink)); }
  .bday-row .age{ margin-left:auto; font-size:12px; color:var(--ink-soft); flex-shrink:0; }
  .age-step{ display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .age-step .from{ opacity:.55; }
  .age-step .arrow{ opacity:.5; font-size:11px; }
  .age-step .to{ font-weight:700; color:var(--ink); }

  /* today's birthday carries the row instead of a label */
  .bday-row.is-today{ background:var(--bnk-soft); }
  .bday-row.is-today .day,
  .bday-row.is-today > span:not(.day):not(.age){ font-weight:800; }
  .bday-row.is-today .age-step .to{
    color:var(--c); font-size:14px;
    animation:agePulse 1.6s var(--ease-out) infinite;
  }
  @keyframes agePulse{ 0%,100%{ transform:scale(1); } 45%{ transform:scale(1.22); } }
  .bday-row.is-today .age-step .to::after{ content:' 🎂'; }
  @media (prefers-reduced-motion:reduce){ .bday-row.is-today .age-step .to{ animation:none; } }

  /* history timeline */
  .year-block{ margin-bottom:4px; }
  .year-head{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:20px; margin:0 0 4px; }
  .ev-row{ display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; padding:3px 0; }
  .ev-dot{ width:8px; height:8px; border-radius:50%; background:var(--c,var(--ink)); margin-top:6px; flex-shrink:0; }
  .ev-names{ color:var(--ink-soft); }

  /* advanced filter panel */
  .adv-panel{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:13px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:15px; margin:0 20px 14px;
  }
  .adv-field{ display:flex; flex-direction:column; gap:6px; }
  .adv-field > label{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .adv-field > label .cover{ font-weight:500; opacity:.8; }
  .adv-range{ display:flex; align-items:center; gap:7px; }
  .adv-range input{
    width:100%; min-width:0; background:var(--paper-dim); color:var(--ink);
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13.5px; outline:none;
  }
  .adv-range input:focus{ border-color:var(--ink-soft); }
  .adv-range span{ color:var(--ink-soft); font-size:13px; }
  .adv-field select{
    background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:8px 10px; font-size:13.5px; outline:none;
  }
  .adv-actions{ display:flex; align-items:flex-end; }
  .adv-actions .btn-secondary:disabled{ opacity:.45; cursor:default; }
  .pill.adv-on{ background:var(--ink); color:var(--paper); border-color:transparent; }
  @media (max-width:640px){ .adv-panel{ margin-left:14px; margin-right:14px; } }

  /* form */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-field{ display:flex; flex-direction:column; gap:5px; }
  .form-field.full{ grid-column:1/-1; }
  .form-field label{ font-family:'Noto Sans Thai',sans-serif; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .form-field input, .form-field select, .form-field textarea{
    font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{ border-color:var(--ink-soft); }
  .form-field textarea{ resize:vertical; font-family:'Noto Sans Thai',sans-serif; }

  .loading{ padding:60px; text-align:center; font-family:'Noto Sans Thai',sans-serif; color:var(--ink-soft); }

  /* profile slot in header */
  #profile-slot{ margin-left:auto; }
  .signin-btn{
    background:rgba(255,255,255,calc(.5*var(--glass-k))); color:var(--ink); border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13.5px;
    padding:8px 18px; border-radius:20px; cursor:pointer;
  }
  .signin-btn:hover{ background:rgba(255,255,255,calc(.7*var(--glass-k))); }
  .profile-slot-wrap{ position:relative; }
  .theme-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; color:var(--ink);
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
    transition:background .18s var(--ease-out), transform .35s var(--ease-spring);
  }
  .theme-btn svg{ width:17px; height:17px; display:block; }
  .theme-btn:active{ transform:scale(.9); }
  .mini-avatar-btn{ background:none; border:none; cursor:pointer; padding:0; display:block; }
  .mini-avatar{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--gold); color:#241a06; font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:14px;
    border:2px solid rgba(255,255,255,calc(.4*var(--glass-k)));
  }
  .profile-dropdown{
    position:absolute; top:44px; right:0; z-index:40; width:220px;
    background:var(--card); border-radius:12px; border:1px solid var(--line);
    box-shadow:0 14px 34px rgba(var(--shadow-rgb),.22); padding:8px; text-align:left;
  }
  .profile-dropdown .dropdown-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:14px; padding:8px 10px 0; color:var(--ink); }
  .profile-dropdown .dropdown-email{ font-size:12px; color:var(--ink-soft); padding:1px 10px 8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .profile-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none;
    font-family:'Noto Sans Thai',sans-serif; font-size:13.5px; color:var(--ink);
    padding:9px 10px; border-radius:8px; cursor:pointer;
  }
  .profile-dropdown button:hover{ background:var(--paper-dim); }
  .profile-dropdown button.danger{ color:var(--danger); }

  /* oshi / kami oshi */
  .crown-ico{ display:inline-flex; width:15px; height:15px; vertical-align:-2px; color:var(--gold); }
  .crown-ico svg{ width:100%; height:100%; display:block; }
  .fav-btn-sm.is-oshi{ color:var(--gold); }
  .oshi-actions{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px; }
  .oshi-btn, .kami-btn{
    display:flex; align-items:center; gap:6px;
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13px;
    padding:8px 16px; border-radius:20px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft);
  }
  .oshi-btn span{ color:var(--gold); font-size:16px; }
  .oshi-btn.active{ background:var(--bnk-soft); border-color:var(--bnk); color:var(--ink); }
  .kami-btn.active{ background:#FBF0DC; border-color:var(--gold); color:var(--ink); }
  .kami-badge{ background:var(--gold)!important; display:inline-flex!important; align-items:center; gap:5px; }
  .kami-badge .crown-ico{ color:#fff; width:12px; height:12px; }

  /* profile page */
  .account-card{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:8px;
  }
  .account-card.guest{ background:var(--paper-dim); }
  .account-card .acc-info{ display:flex; align-items:center; gap:14px; flex:1 1 200px; min-width:0; }
  .account-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-email{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-actions{ display:flex; gap:8px; flex-wrap:wrap; flex:0 0 auto; }

  .kami-feature{
    display:flex; align-items:center; gap:16px; cursor:pointer;
    background:var(--card); border:2px solid var(--gold); border-radius:12px; padding:16px; margin-bottom:4px;
  }
  .kami-feature-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:18px; }
  .kami-feature-name span{ color:var(--ink-soft); font-weight:500; font-size:14px; }

  .grid-mini{ display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:10px; }
  .mini-card{
    position:relative; text-align:center; padding:12px 6px;
    background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c,var(--ink));
    border-radius:9px; cursor:pointer;
  }
  .mini-card .avatar-sm{ margin:0 auto; }
  .mini-crown{ position:absolute; top:5px; right:5px; width:14px; height:14px; color:var(--gold); }
  .mini-crown svg{ width:100%; height:100%; display:block; }
  .mini-name{ font-size:11px; font-weight:600; margin-top:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* auth */
  .auth-card{ max-width:420px; }
  .resume-card{
    display:flex; align-items:center; gap:12px;
    background:var(--paper-dim); border-radius:12px; padding:14px 16px;
  }
  .auth-error{ font-size:13px; color:var(--danger); background:var(--danger-soft); border-radius:8px; padding:10px 12px; margin:0 0 12px; line-height:1.5; }
  .auth-switch{ font-size:13px; color:var(--ink-soft); margin-top:16px; }
  .auth-switch button{ background:none; border:none; color:var(--bnk); font-weight:600; font-size:13px; cursor:pointer; padding:0; }

  /* ======================== INTERACTION MOTION ========================
     Shared feel: quick dip on press, springy release, soft lift on hover. */

  .btn-add, .btn-secondary, .btn-danger, .signin-btn, .pill, .gen-filter-chip,
  .oshi-btn, .kami-btn, .team-row, .mini-card, .kami-feature, .modal-close-btn,
  .back-btn, .fav-btn, .fav-btn-sm, .mini-avatar-btn, .profile-dropdown button,
  .auth-switch button, .dtable .row:not(.head){
    transition:
      transform .34s var(--ease-spring),
      box-shadow .3s var(--ease-out),
      background-color .22s var(--ease-out),
      border-color .22s var(--ease-out),
      color .22s var(--ease-out),
      filter .22s var(--ease-out);
  }

  /* --- ripple: expands from the exact point you touched --- */
  .btn-add, .btn-secondary, .btn-danger, .signin-btn, .pill, .gen-filter-chip,
  .oshi-btn, .kami-btn, .team-row, .profile-dropdown button{
    position:relative; overflow:hidden;
  }
  /* Already absolutely positioned — must keep it, so only clip the ripple. */
  .modal-close-btn{ overflow:hidden; }
  .btn-add::after, .btn-secondary::after, .btn-danger::after, .signin-btn::after,
  .pill::after, .gen-filter-chip::after, .oshi-btn::after, .kami-btn::after,
  .team-row::after, .modal-close-btn::after, .profile-dropdown button::after{
    content:''; position:absolute; pointer-events:none; opacity:0;
    left:var(--rx,50%); top:var(--ry,50%);
    width:var(--rs,140px); height:var(--rs,140px);
    margin:calc(var(--rs,140px) / -2) 0 0 calc(var(--rs,140px) / -2);
    border-radius:50%;
    background:radial-gradient(circle closest-side, currentColor, transparent);
  }
  .dtable .row:not(.head) .cell,
  .dtable .row:not(.head) .group-chip,
  .dtable .row:not(.head) .avatar-sm{
    transition:background-color .25s var(--ease-out), box-shadow .25s var(--ease-out);
  }

  .rippling::after{ animation:rippleOut .6s var(--ease-out) forwards; }
  @keyframes rippleOut{
    0%{ transform:scale(0); opacity:.3; }
    65%{ opacity:.13; }
    100%{ transform:scale(1); opacity:0; }
  }

  /* --- hover (pointer devices only) --- */
  @media (hover:hover){
    .btn-add:hover{ filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 8px 20px rgba(192,138,46,.4); }
    .btn-secondary:hover{ background:var(--card); border-color:var(--ink-soft); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.11); }
    .btn-danger:hover{ background:var(--danger); color:#fff; transform:translateY(-2px); box-shadow:0 7px 18px rgba(184,69,69,.3); }
    .signin-btn:hover{ background:rgba(255,255,255,calc(.75*var(--glass-k))); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.13); }
    .pill:hover{ border-color:var(--bnk); color:var(--bnk); transform:translateY(-1px); }
    .gen-filter-chip:hover{ filter:brightness(1.35); }
    .oshi-btn:hover, .kami-btn:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 7px 18px rgba(var(--shadow-rgb),.1); }
    .team-row:hover{ background:var(--pink-soft); transform:translateX(4px); }
    .mini-card:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 26px rgba(var(--shadow-rgb),.15);
      box-shadow:0 12px 26px -6px color-mix(in srgb, var(--c) 55%, transparent);
      border-color:color-mix(in srgb, var(--c) 40%, var(--line));
    }
    .kami-feature:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(192,138,46,.26); }
    .modal-close-btn:hover{ background:var(--card); transform:rotate(90deg); }
    .fav-btn:hover, .fav-btn-sm:hover{ transform:scale(1.3) rotate(10deg); }
    .back-btn:hover{ transform:translateX(-4px); }
    .mini-avatar-btn:hover{ transform:scale(1.08); }
    .profile-dropdown button:hover{ transform:translateX(3px); }
    /* member rows glow in their own group's colour (--c is set per row) */
    .dtable .row:not(.head):hover{
      z-index:3;
      background:var(--paper-dim);
      background:color-mix(in srgb, var(--c) 15%, var(--card));
      box-shadow:0 6px 22px -4px rgba(var(--shadow-rgb),.28);
      box-shadow:
        0 6px 22px -4px color-mix(in srgb, var(--c) 70%, transparent),
        inset 10px 0 22px -14px var(--c);
    }
    .dtable .row:not(.head):hover .cell{
      background:var(--paper-dim);
      background:color-mix(in srgb, var(--c) 15%, var(--card));
    }
    .dtable .row:not(.head):hover .group-chip{
      box-shadow:0 2px 9px color-mix(in srgb, var(--c) 50%, transparent);
    }
    .dtable .row:not(.head):hover .avatar-sm{
      box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent);
    }
  }

  /* --- press: dips fast, springs back --- */
  .btn-add:active, .btn-secondary:active, .btn-danger:active, .signin-btn:active,
  .pill:active, .gen-filter-chip:active, .oshi-btn:active, .kami-btn:active,
  .modal-close-btn:active, .profile-dropdown button:active{
    transform:scale(.93); transition-duration:.09s;
  }
  .btn-add:active{ box-shadow:0 2px 6px rgba(192,138,46,.3); }
  .team-row:active, .mini-card:active, .kami-feature:active{
    transform:scale(.977); transition-duration:.09s;
  }
  /* rows are too wide to scale nicely — deepen the group tint instead */
  .dtable .row:not(.head):active .cell,
  .dtable .row:not(.head):active .cell.sticky-name{
    background:var(--paper-dim);
    background:color-mix(in srgb, var(--c) 26%, var(--card));
    transition-duration:.08s;
  }
  .back-btn:active{ transform:translateX(-5px); transition-duration:.09s; }
  .mini-avatar-btn:active{ transform:scale(.9); transition-duration:.09s; }
  .fav-btn:active, .fav-btn-sm:active{ transform:scale(.82); transition-duration:.08s; }
  .auth-switch button:active{ transform:scale(.94); transition-duration:.09s; }

  /* --- oshi / kami toggle: star wobble + ring burst, pill gets a gold pulse --- */
  .fav-btn-sm{ position:relative; }
  .fav-btn.star-pop::before, .fav-btn-sm.star-pop::before{
    content:''; position:absolute; left:50%; top:50%;
    width:24px; height:24px; margin:-12px 0 0 -12px;
    border-radius:50%; border:2px solid var(--gold); pointer-events:none;
    animation:ringBurst .6s var(--ease-out) forwards;
  }
  @keyframes ringBurst{
    0%{ transform:scale(.35); opacity:.6; }
    100%{ transform:scale(2.4); opacity:0; }
  }
  .oshi-btn.star-pop, .kami-btn.star-pop{ animation:btnPulse .55s var(--ease-out); }
  @keyframes btnPulse{
    0%{ transform:scale(1); box-shadow:0 0 0 0 rgba(192,138,46,.45); }
    35%{ transform:scale(1.06); }
    100%{ transform:scale(1); box-shadow:0 0 0 15px rgba(192,138,46,0); }
  }

  /* --- glass nav: soft pill slides in behind the active tab --- */
  .glass-nav button{
    position:relative; border-radius:999px;
    transition:color .25s var(--ease-out), transform .34s var(--ease-spring);
  }
  .glass-nav button::before{
    content:''; position:absolute; inset:1px 5px; z-index:0;
    border-radius:999px; background:rgba(255,255,255,calc(.8*var(--glass-k)));
    box-shadow:0 2px 8px rgba(var(--shadow-rgb),.14);
    opacity:0; transform:scale(.55);
    transition:opacity .28s var(--ease-out), transform .4s var(--ease-spring);
  }
  .glass-nav button.active::before{ opacity:1; transform:scale(1); }
  .glass-nav button .gnav-icon{ position:relative; z-index:1; }
  .glass-nav button:active{ transform:scale(.85); transition-duration:.09s; }
  .glass-nav button.active .gnav-icon{ animation:navPop .5s var(--ease-spring); }
  @keyframes navPop{
    0%{ transform:scale(.65); }
    55%{ transform:scale(1.2); }
    100%{ transform:scale(1); }
  }

  /* --- modal: softer spring in --- */
  .modal-glass-card{ animation:modalPopIn .38s var(--ease-spring); }

  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.01ms!important; animation-iteration-count:1!important;
      transition-duration:.01ms!important;
    }
  }

  @media (max-width:640px){
    .form-grid{ grid-template-columns:1fr; }
    .detail-name-th{ font-size:23px; }
    main{ padding:16px 16px calc(104px + env(safe-area-inset-bottom)); }
    header.top{ padding:12px 14px; }
    .filter-bar{ padding-left:14px; padding-right:14px; }
  }

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatDate(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return '-';
  return `${dt.getDate()} ${THAI_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}
function formatDateShort(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return '-';
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function calcAge(d){
  if(!d) return null;
  const b = new Date(d+'T00:00:00'); const t = new Date();
  if(isNaN(b)) return null;
  let age = t.getFullYear()-b.getFullYear();
  const m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}

// ============================= STORAGE (Firestore) =============================
async function loadMembers(){
  const snap = await fbDb.collection('members').get();
  let stored = snap.docs.map(d => d.data());

  if(stored.length === 0){
    const batch = fbDb.batch();
    SEED_ALL_MEMBERS.forEach(m => batch.set(fbDb.collection('members').doc(m.id), m));
    await batch.commit();
    return SEED_ALL_MEMBERS.slice();
  }

  // Reconcile with the current seed: add any brand-new members that weren't
  // there before, and push a fresh photo/data change out to everyone else's
  // saved copy — same idea as the old window.storage version, just backed
  // by Firestore now so it's shared across every device instead of per-browser.
  const byId = new Map(stored.map(m => [m.id, m]));
  const batch = fbDb.batch();
  let changed = false;
  for(const seedM of SEED_ALL_MEMBERS){
    const existing = byId.get(seedM.id);
    if(!existing){
      stored.push({ ...seedM });
      batch.set(fbDb.collection('members').doc(seedM.id), seedM);
      changed = true;
    } else {
      let touched = false;
      if(seedM.photo && existing.photo !== seedM.photo){
        existing.photo = seedM.photo;
        touched = true;
      }
      // Fill gaps the seed has since learned about — heights, Thai names,
      // last teams. A value the stored copy already holds always wins, so
      // anything edited in the app survives.
      for(const [k, v] of Object.entries(seedM)){
        const cur = existing[k];
        if((cur === null || cur === undefined || cur === '') && v !== null && v !== undefined && v !== ''){
          existing[k] = v;
          touched = true;
        }
      }
      if(touched){
        batch.set(fbDb.collection('members').doc(seedM.id), existing);
        changed = true;
      }
    }
  }
  if(changed){ try{ await batch.commit(); }catch(e){} }
  return stored;
}

  const batch = fbDb.batch();
  members.forEach(m => batch.set(fbDb.collection('members').doc(m.id), m));

function syncNav(navContainer){
  if(NAV_HIDDEN_VIEWS.includes(state.view)){
    if(navContainer.firstChild) navContainer.innerHTML = '';
    return;
  }
  if(!navContainer.querySelector('.glass-nav')){
    navContainer.innerHTML = renderNav();
    return;
  }
  const current = currentNavValue();
  navContainer.querySelectorAll('.glass-nav button').forEach(btn=>{
    const isActive = btn.dataset.value === current;
    if(btn.classList.contains('active') === isActive) return;
    const opt = NAV_OPTIONS.find(o=>o.value === btn.dataset.value);
    btn.classList.toggle('active', isActive);
    const ico = btn.querySelector('.gnav-icon');
    if(ico && opt) ico.innerHTML = isActive ? opt.iconActive : opt.icon;
  });

const CAPTAIN_LABELS = { 'group-captain':'กัปตันวง', 'group-vc':'รองกัปตันวง', 'team-captain':'กัปตันทีม', 'team-vc':'รองกัปตันทีม' };
function isCaptainType(m, type){
  const g = getGroup(m.groupId);
  const t = getTeam(m.teamId);
  if(type==='group-captain') return g.captain===m.name;
  if(type==='group-vc') return g.viceCaptain===m.name;
  if(type==='team-captain') return t && t.captain===m.name;
  if(type==='team-vc') return t && t.viceCaptain===m.name;
  return false;
}

// A blank bound means "no limit"; a member missing the value drops out only
// once a bound is actually set.
function applyRange(list, min, max, valueOf){
  const lo = min==='' ? null : Number(min);
  const hi = max==='' ? null : Number(max);
  if(lo===null && hi===null) return list;
  return list.filter(m=>{
    const v = valueOf(m);
    if(v==null || isNaN(v)) return false;
    return (lo===null || v>=lo) && (hi===null || v<=hi);
  });
}

// The roster as it stands before the advanced panel narrows it — kept so the
// panel can report data coverage instead of silently returning nothing.
let _advBase = [];
function applyAdvFilters(list){
  if(state.birthMonth!=='all') list = list.filter(m=>m.birthday && m.birthday.slice(5,7)===state.birthMonth);
  list = applyRange(list, state.ageMin, state.ageMax, m=>calcAge(m.birthday));
  list = applyRange(list, state.heightMin, state.heightMax, m=>m.height);
  return list;
}

function activeAdvCount(){
  return (state.ageMin!==''||state.ageMax!=='' ? 1 : 0)
       + (state.heightMin!==''||state.heightMax!=='' ? 1 : 0)
       + (state.birthMonth!=='all' ? 1 : 0);
}

function filterAndSort(){
  let list = state.members.slice();
  const q = state.query.trim();
  // Graduated members are hidden from the default roster. The "จบการศึกษา"
  // tab shows them on their own, and a search reaches them from anywhere so
  // they stay findable without leaving the main list.
  if(state.showGraduated) list = list.filter(m=>!!m.graduated);
  else if(!q && !state.favoritesOnly) list = list.filter(m=>!m.graduated);
  if(state.favoritesOnly) list = list.filter(m=>state.oshi.includes(m.id));
  if(state.groupFilter!=='all') list = list.filter(m=>m.groupId===state.groupFilter);
  if(state.teamFilter!=='all') list = list.filter(m=>m.teamId===state.teamFilter);
  if(state.genFilter!=='all') list = list.filter(m=>m.gen===state.genFilter);
  if(state.captainFilter!=='all') list = list.filter(m=>isCaptainType(m, state.captainFilter));
  _advBase = list.slice();
  list = applyAdvFilters(list);
  if(q){
    const ql = q.toLowerCase();
    list = list.filter(m=>
      (m.name||'').toLowerCase().includes(ql) ||
      (m.nameTh||'').includes(q) ||
      (m.realName||'').toLowerCase().includes(ql) ||
      (m.realNameTh||'').includes(q)
    );
  }
  const cmp = {
    name: (a,b)=>a.name.localeCompare(b.name),
    group: (a,b)=>getGroup(a.groupId).name.localeCompare(getGroup(b.groupId).name),
    team: (a,b)=>shortTeamLabel(getTeam(a.teamId)).localeCompare(shortTeamLabel(getTeam(b.teamId))),
    gen: (a,b)=>(a.gen||99)-(b.gen||99),
    age: (a,b)=>(a.birthday||'9999-99-99').localeCompare(b.birthday||'9999-99-99'),
    birthday: (a,b)=>{
      const norm = d => d ? d.slice(5) : '99-99'; // compare month-day only, ignore birth year
      return norm(a.birthday).localeCompare(norm(b.birthday));
    },
    height: (a,b)=> state.showGraduated
      ? (a.graduated||'').localeCompare(b.graduated||'')
      : (a.height||0)-(b.height||0),
  }[state.sortBy] || ((a,b)=>a.name.localeCompare(b.name));
  list.sort(cmp);
  if(state.sortDir==='desc') list.reverse();
  return list;
}

function renderAvatar(m, cls, bg, styleExtra){
  const initial = m.nameTh ? m.nameTh[0] : (m.name?m.name[0]:'?');
  return `<div class="${cls}" style="background:${bg};${styleExtra||''}">
    <span class="avatar-fallback">${initial}</span>
    ${m.photo ? `<img class="avatar-img" src="${escapeAttr(m.photo)}" alt="" onerror="this.remove()">` : ''}
  </div>`;
}

function getMemberTitle(m){
  const g = getGroup(m.groupId);
  const t = getTeam(m.teamId);
  if(g.captain===m.name) return 'กัปตันวง';
  if(g.viceCaptain===m.name) return 'รองกัปตันวง';
  if(t && t.captain===m.name) return 'กัปตันทีม';
  if(t && t.viceCaptain===m.name) return 'รองกัปตันทีม';
  return '-';
}

function getGroupCaptainBadge(m){
  const g = getGroup(m.groupId);
  if(g.captain===m.name) return 'C';
  if(g.viceCaptain===m.name) return 'VC';
  return null;
}

const ALL_WORKS = () => [...SEED_SINGLES, ...SEED_ALBUMS];
const WORK_KIND = w => w.id.includes('-a') ? 'album' : 'single';

function allTracks(){
  const out = [];
  for(const w of ALL_WORKS()){
    for(const t of (SEED_SENBATSU[w.id] || [])) out.push({ work:w, ...t });
  }
  return out;
}

function worksOf(id){
  return allTracks()
    .filter(t => t.members.includes(id))
    .map(t => ({ work:t.work, track:t.track, centre:t.centers.includes(id) }))
    .sort((a,b) => b.work.year-a.work.year || b.work.num-a.work.num);
}

function renderBarLink(label, value, max, color, action, data){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  const attrs = Object.entries(data)
    .map(([k,v])=>`data-${k.replace(/[A-Z]/g, c=>'-'+c.toLowerCase())}="${escapeAttr(v)}"`).join(' ');
  return `<button class="bar-row" style="--c:${color}" data-action="${action}" ${attrs}>
    <span class="bar-label">${escapeHtml(label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
    <span class="bar-val">${value}</span></button>`;
}

function renderMemberWorks(m){
  const works = worksOf(m.id);
  if(!works.length) return `<h3 class="section-label">ผลงานเพลง</h3>
    <p class="muted-note">ยังไม่มีเพลงที่บันทึกไว้</p>`;
  const centres = works.filter(w=>w.centre).length;
  const rows = works.map(w=>{
    const kind = WORK_KIND(w.work)==='album' ? 'อัลบั้มที่' : 'ซิงเกิลที่';
    // A title track shares its name with the release, so naming the release
    // again would just repeat the line above it.
    const from = w.track === w.work.title
      ? `${kind} ${w.work.num} · ${w.work.year}`
      : `${kind} ${w.work.num} · ${escapeHtml(w.work.title)} · ${w.work.year}`;
    return `<button class="work-row${w.centre?' is-centre':''}" data-action="open-single" data-id="${w.work.id}">
      <span class="work-main">
        <span class="work-track">${escapeHtml(w.track)}</span>
        <span class="work-from">${from}</span>
      </span>
      ${w.centre?'<span class="work-centre">CENTER</span>':''}
    </button>`;
  }).join('');
  return `<h3 class="section-label">ผลงานเพลง</h3>
    <p class="works-count">${works.length} เพลง${centres?` · เซ็นเตอร์ ${centres} เพลง`:''}</p>
    <div class="work-list">${rows}</div>`;
}

function renderTeamHistory(m){
  const spans = SEED_TEAM_HISTORY[m.id];
  if(!spans || !spans.length) return '';
  const rows = spans.map(s=>{
    const t = getTeam(s.team);
    const colour = t ? getGroup(t.groupId).color : 'var(--ink-soft)';
    const end = s.to ? formatDateShort(s.to) : `<span class="th-now">ปัจจุบัน</span>`;
    return `<li>
      <span class="th-dot" style="background:${colour}"></span>
      <span class="th-team">${t ? t.name : s.team}</span>
      <span class="th-range mono">${formatDateShort(s.from)} – ${end}</span>
    </li>`;
  }).join('');
  return `<h3 class="section-label">ประวัติทีม</h3><ol class="team-history">${rows}</ol>`;
}

function getTeamCaptainBadge(m){
  const t = getTeam(m.teamId);
  if(t && t.captain===m.name) return 'C';
  if(t && t.viceCaptain===m.name) return 'VC';
  return null;
}

function shortTeamLabel(t){
  if(!t) return '-';
  return t.name === 'เด็กฝึก (Trainee)' ? 'Trainee' : t.name;
}

const SORTABLE_COLS = [
  { key:'name', cellClass:'sticky-name', label:'สมาชิก' },
  { key:'group', cellClass:'col-group', label:'วง' },
  { key:'team', cellClass:'col-team', label:'ทีม' },
  { key:'gen', cellClass:'col-gen', label:'รุ่น' },
  { key:'age', cellClass:'col-age', label:'อายุ' },
  { key:'birthday', cellClass:'col-birthday', label:'วันเกิด' },
  { key:'height', cellClass:'col-height', label:'ส่วนสูง' },
];
function renderTableHeader(){
  const cells = SORTABLE_COLS.map(c=>{
    const active = state.sortBy===c.key;
    const arrow = active ? (state.sortDir==='desc' ? ' \u25BC' : ' \u25B2') : '';
    // Graduated members have no recorded height, so that column carries the
    // graduation date instead and the team column keeps showing their team.
    const label = (c.key==='height' && state.showGraduated) ? 'จบการศึกษา' : c.label;
    return `<div class="cell ${c.cellClass} sortable-th ${active?'active-sort':''}" data-action="sort-column" data-column="${c.key}">${label}${arrow}</div>`;
  }).join('');
  return `
  <div class="row head">
    ${cells}
    <div class="cell col-fav">\u2605</div>
  </div>`;
}

function renderRow(m){

  const teamBadge = getTeamCaptainBadge(m);
  const badgeHtml = (badge, color)=> badge?`<span class="captain-badge" style="--badge-c:${color}" title="${badge==='C'?'กัปตัน':'รองกัปตัน'}">${badge}</span>`:'';
  return `
  <div class="row" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
    <div class="cell sticky-name">
      ${renderAvatar(m, 'avatar-sm', g.color)}
      <div class="name-block">
        <div class="name-en">${m.name}${m.transfer?`<span class="grad-tag transfer-tag" title="ย้ายจาก ${getGroup(m.transfer.fromGroupId).name} เมื่อ ${formatDateShort(m.transfer.date)}">${ICONS.transfer}</span>`:''}${m.graduated?`<span class="grad-tag" title="จบการศึกษา ${formatDateShort(m.graduated)}">${ICONS.cap}</span>`:''}</div>

    <div class="cell col-age mono">${age!==null?age:'-'}</div>

function renderBar(label, value, max, color, drill){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  const inner = `<span class="bar-label">${escapeHtml(label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
    <span class="bar-val">${value}</span>`;
  const style = `--c:${color||'var(--ink)'}`;
  if(!drill || !value) return `<div class="bar-row" style="${style}">${inner}</div>`;
  // HTML attribute names are case-insensitive, so a camelCase key would arrive
  // as dataset.agemin. Emit kebab-case and the dataset camelCases it back.
  const attrs = Object.entries(drill)
    .map(([k,v])=>`data-${k.replace(/[A-Z]/g, c=>'-'+c.toLowerCase())}="${escapeAttr(v)}"`).join(' ');
  return `<button class="bar-row" style="${style}" data-action="drill" ${attrs}>${inner}</button>`;
}

function renderStatsOverview(){
  const active = activeMembers();
  const grads = state.members.filter(m=>m.graduated);
  const ages = active.map(m=>calcAge(m.birthday)).filter(a=>a!=null);
  const heights = active.map(m=>m.height).filter(Boolean);
  const avg = arr => arr.length ? Math.round(arr.reduce((s,n)=>s+n,0)/arr.length) : null;

  const buckets = [[0,15,'ต่ำกว่า 16'],[16,18,'16–18'],[19,21,'19–21'],[22,24,'22–24'],[25,99,'25 ขึ้นไป']];
  const maxBucket = Math.max(...buckets.map(([lo,hi])=>ages.filter(a=>a>=lo&&a<=hi).length), 1);

  return `
  <div class="stat-grid">
    <button class="stat-cell" data-action="drill"><div class="label">สมาชิกปัจจุบัน</div><div class="value">${active.length} คน</div></button>
    <button class="stat-cell" data-action="drill" data-grad="1"><div class="label">จบการศึกษาแล้ว</div><div class="value">${grads.length} คน</div></button>
    <div class="stat-cell"><div class="label">อายุเฉลี่ย</div><div class="value">${avg(ages)??'-'} ปี</div></div>
    <div class="stat-cell"><div class="label">ส่วนสูงเฉลี่ย</div><div class="value">${avg(heights)??'-'} ซม.</div></div>
  </div>

  ${GROUPS.map(g=>{
    const mine = active.filter(m=>m.groupId===g.id);
    const gradMine = grads.filter(m=>m.groupId===g.id);
    const gens = [...new Set(mine.map(m=>m.gen).filter(n=>n!=null))].sort((a,b)=>a-b);
    const teams = getTeamsForGroup(g.id);
    const maxGen = Math.max(...gens.map(n=>mine.filter(m=>m.gen===n).length), 1);
    const maxTeam = Math.max(...teams.map(t=>mine.filter(m=>m.teamId===t.id).length), 1);
    return `
    <div class="group-card" style="--c:${g.color}">
      <div class="group-head">
        <button class="link-h2" data-action="drill" data-group="${g.id}" style="color:${g.color}">${g.name}</button>
        <span class="mono" style="font-size:12px;color:var(--ink-soft);">
          <button class="link-inline" data-action="drill" data-group="${g.id}">${mine.length} คน</button> ·
          <button class="link-inline" data-action="drill" data-group="${g.id}" data-grad="1">จบแล้ว ${gradMine.length} คน</button>
        </span>
      </div>
      <h3 class="section-label" style="margin-top:6px;">แยกตามทีม</h3>
      ${teams.map(t=>renderBar(t.name, mine.filter(m=>m.teamId===t.id).length, maxTeam, g.color,
          {group:g.id, team:t.id})).join('')}
      <h3 class="section-label">แยกตามรุ่น</h3>
      ${gens.map(n=>renderBar('รุ่น '+n, mine.filter(m=>m.gen===n).length, maxGen, g.color,
          {group:g.id, gen:n})).join('')
        || '<p class="muted-note">ไม่มีข้อมูลรุ่น</p>'}
    </div>`;
  }).join('')}

  <div class="group-card" style="--c:var(--gold)">
    <div class="group-head"><h2 style="font-size:21px;">ช่วงอายุ (ทุกวง)</h2></div>
    ${buckets.map(([lo,hi,label])=>renderBar(label, ages.filter(a=>a>=lo&&a<=hi).length, maxBucket, 'var(--gold)',
        {ageMin:lo||'', ageMax:hi>=99?'':hi})).join('')}
    <p class="stats-note">นับจาก ${ages.length} คนที่มีข้อมูลวันเกิด</p>
  </div>`;
}

function renderStatsSongs(){
  const tracks = allTracks();
  const appearances = new Map(), centres = new Map();
  for(const t of tracks){
    for(const id of t.members) appearances.set(id, (appearances.get(id)||0)+1);
    for(const id of t.centers) centres.set(id, (centres.get(id)||0)+1);
  }
  // A track can be a solo or a duet, so the mean says more than the range alone.
  const sizes = tracks.map(t=>t.members.length);
  const mean = sizes.length ? Math.round(sizes.reduce((s,n)=>s+n,0)/sizes.length) : 0;

  const top = (map, n) => [...map.entries()]
    .filter(([id])=>getMember(id))
    .sort((a,b)=> b[1]-a[1] || getMember(a[0]).name.localeCompare(getMember(b[0]).name))
    .slice(0, n);
  const byAppearance = top(appearances, 12);
  const byCentre     = top(centres, 12);
  const biggest = [...tracks].sort((a,b)=> b.members.length-a.members.length).slice(0, 8);

  const label = t => `${t.track} · ${WORK_KIND(t.work)==='album'?'อัลบั้ม':'ซิงเกิล'}ที่ ${t.work.num}`;
  const colour = id => getGroup(getMember(id).groupId).color;

  return `
  <div class="stat-grid">
    <div class="stat-cell"><div class="label">เพลงทั้งหมด</div><div class="value">${tracks.length} เพลง</div></div>
    <div class="stat-cell"><div class="label">ผลงาน</div><div class="value">${SEED_SINGLES.length + SEED_ALBUMS.length} ชิ้น</div></div>
    <div class="stat-cell"><div class="label">มีเพลงอย่างน้อย 1</div><div class="value">${appearances.size} คน</div></div>
    <div class="stat-cell"><div class="label">เซ็มบัตสึเฉลี่ย</div><div class="value">${mean} คน</div></div>
  </div>

  <div class="group-card" style="--c:var(--gold)">
    <div class="group-head"><h2 style="font-size:21px;">ติดเพลงมากที่สุด</h2></div>
    ${byAppearance.map(([id,n])=>renderBarLink(getMember(id).name+' · '+getMember(id).nameTh,
        n, byAppearance[0][1], colour(id), 'open-member', {id})).join('')}
    <p class="stats-note">นับทุกเพลงทั้งเพลงหลักและเพลงรอง รวมสมาชิกที่จบการศึกษาแล้ว</p>
  </div>

  <div class="group-card" style="--c:var(--gold)">
    <div class="group-head"><h2 style="font-size:21px;">เป็นเซ็นเตอร์มากที่สุด</h2></div>
    ${byCentre.length
      ? byCentre.map(([id,n])=>renderBarLink(getMember(id).name+' · '+getMember(id).nameTh,
          n, byCentre[0][1], colour(id), 'open-member', {id})).join('')
      : '<p class="muted-note">ไม่มีข้อมูลเซ็นเตอร์</p>'}
    <p class="stats-note">เพลงที่มีเซ็นเตอร์ร่วมกันหลายคน นับให้ทุกคน</p>
  </div>

  <div class="group-card" style="--c:var(--gold)">
    <div class="group-head"><h2 style="font-size:21px;">เซ็มบัตสึมากที่สุด</h2></div>
    ${biggest.map(t=>renderBarLink(label(t), t.members.length, biggest[0].members.length,
        getGroup(t.work.groupId).color, 'open-single', {id:t.work.id})).join('')}
  </div>`;
}

function renderStatsBirthdays(){
  const today = new Date(); today.setHours(0,0,0,0);
  const withBday = activeMembers().filter(m=>m.birthday);

  // Days until the next occurrence, so December birthdays surface in January.
  const daysUntil = m => {
    const [, mo, d] = m.birthday.split('-').map(Number);
    let next = new Date(today.getFullYear(), mo-1, d);
    if(next < today) next = new Date(today.getFullYear()+1, mo-1, d);
    return Math.round((next - today)/86400000);
  };
  const upcoming = withBday.map(m=>({m, d:daysUntil(m)})).sort((a,b)=>a.d-b.d).slice(0,8);
  const whenLabel = d => d===0 ? 'วันนี้!' : d===1 ? 'พรุ่งนี้' : `อีก ${d} วัน`;
  // calcAge counts birthdays already had, so the next one is always one more —
  // except on the day itself, where it has just been counted.
  const ageStep = (m, d) => {
    const a = calcAge(m.birthday);
    if(a==null) return '';
    const [from, to] = d===0 ? [a-1, a] : [a, a+1];
    return `<span class="age-step"><span class="from">${from}</span><span class="arrow">→</span><span class="to">${to}</span></span>`;
  };

  return `
  <h3 class="section-label" style="margin-top:4px;">วันเกิดที่ใกล้ถึง</h3>
  <div class="bday-next">
    ${upcoming.map(({m,d})=>{
      const g = getGroup(m.groupId);
      return `<button class="bday-chip ${d===0?'today':''}" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
        ${renderAvatar(m,'avatar-sm',g.color)}
        <span><span class="when">${whenLabel(d)} · ${ageStep(m, d)}</span><span class="who" style="display:block;">${escapeHtml(m.nameTh||m.name)}</span></span>
      </button>`;
    }).join('')}
  </div>

  ${MONTH_NAMES.map((name,i)=>{
    const mm = String(i+1).padStart(2,'0');
    const inMonth = withBday.filter(m=>m.birthday.slice(5,7)===mm)
      .sort((a,b)=>a.birthday.slice(8).localeCompare(b.birthday.slice(8)));
    if(!inMonth.length) return '';
    return `<div class="month-block">
      <div class="month-head">
        <button class="link-inline strong" data-action="drill" data-month="${mm}">${name}</button>
        <span class="n">${inMonth.length} คน</span>
      </div>
      ${inMonth.map(m=>{
        const g = getGroup(m.groupId);
        const d = daysUntil(m);
        return `<button class="bday-row ${d===0?'is-today':''}" style="--c:${g.color}" data-action="open-member" data-id="${m.id}">
          <span class="day">${+m.birthday.slice(8)}</span>
          ${renderAvatar(m,'avatar-sm',g.color)}
          <span>${escapeHtml(m.nameTh||m.name)}</span>
          <span class="age">${ageStep(m, d)}</span>
        </button>`;
      }).join('')}
    </div>`;
  }).join('')}`;
}

function renderStatsTimeline(){
  // One entry per year, merging what the database actually knows: group
  // debuts, single releases and graduations.
  const years = {};
  const slot = y => (years[y] = years[y] || { debuts:[], singles:[], grads:[] });
  GROUPS.forEach(g=> slot(+g.debut.slice(0,4)).debuts.push(g));
  SEED_SINGLES.forEach(s=> slot(s.year).singles.push(s));
  state.members.filter(m=>m.graduated).forEach(m=> slot(+m.graduated.slice(0,4)).grads.push(m));

  const sorted = Object.keys(years).map(Number).sort((a,b)=>b-a);
  return `
  <div class="timeline" style="margin-top:6px;">
    ${sorted.map(y=>{
      const e = years[y];
      const byGroup = gid => e.grads.filter(m=>m.groupId===gid);
      return `<div class="timeline-item" style="--c:var(--ink-soft)">
        <div class="year-head">${y}</div>
        ${e.debuts.map(g=>`<div class="ev-row" style="--c:${g.color}"><span class="ev-dot"></span>
          <span><b>${g.name}</b> เดบิวต์ · ${formatDate(g.debut)}</span></div>`).join('')}
        ${e.singles.length ? GROUPS.map(g=>{
          const ss = e.singles.filter(s=>s.groupId===g.id).sort((a,b)=>a.num-b.num);
          if(!ss.length) return '';
          return `<div class="ev-row" style="--c:${g.color}"><span class="ev-dot"></span>
            <span>${g.name} ปล่อย ${ss.length} ซิงเกิล <span class="ev-names">${ss.map(s=>escapeHtml(s.title)).join(' · ')}</span></span></div>`;
        }).join('') : ''}
        ${GROUPS.map(g=>{
          const gs = byGroup(g.id);
          if(!gs.length) return '';
          return `<div class="ev-row" style="--c:${g.color}"><span class="ev-dot"></span>
            <span>${gs.length} คนจบการศึกษาจาก ${g.name}
            <span class="ev-names">${gs.map(m=>`<button class="link-inline" data-action="open-member" data-id="${m.id}">${escapeHtml(m.nameTh||m.name)}</button>`).join(' · ')}</span></span></div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function renderSingleDetail(){
  const isAlbum = /-a\d+$/.test(state.selectedSingle||'');
  const s = (isAlbum?SEED_ALBUMS:SEED_SINGLES).find(x=>x.id===state.selectedSingle);
  if(!s) return '';
  const g = getGroup(s.groupId);
  const tracks = SEED_SENBATSU[s.id];
  const card = id => { const m = getMember(id); return m ? renderMiniCard(m) : ''; };

  // The first track is the single's title song; the rest are its coupling songs.
  const renderTrack = (t, i) => {
    const rest = t.members.filter(id=>!t.centers.includes(id));
    const tag = isAlbum ? (i===0?'เพลงไตเติล':'เพลงในอัลบั้ม') : (i===0?'เพลงหลัก':'เพลงรอง');
    return `
    <div class="track-block">
      <div class="track-head">
        <span class="track-tag ${i===0?'lead':''}">${tag}</span>
        <span class="track-name">${escapeHtml(t.track)}</span>
      </div>
      <div class="track-sub">${t.members.length} คน${t.centers.length
        ? ' · เซ็นเตอร์ ' + t.centers.map(id=>escapeHtml(getMember(id)?.nameTh||getMember(id)?.name||'')).join(', ')
        : ''}</div>
      <div class="grid-mini">
        ${t.centers.map(id=>`<div class="is-center">${card(id)}</div>`).join('')}
        ${rest.map(card).join('')}
      </div>
    </div>`;
  };

  return `
  <button class="back-btn" data-action="go-back">← กลับ</button>
  <div class="single-head" style="--c:${g.color}">
    <div class="timeline-year">${g.name} · ${isAlbum?'อัลบั้มที่':'ซิงเกิลที่'} ${s.num} · ${s.year}</div>
    <h2>${escapeHtml(s.title)}</h2>
    ${s.alt?`<p class="single-th">${escapeHtml(s.alt)}</p>`:''}
  </div>
  ${isAlbum && s.singles.length ? `
    <h3 class="section-label">ซิงเกิลที่รวมอยู่ในอัลบั้ม</h3>
    <div class="album-singles">
      ${s.singles.map(sid=>{ const x=SEED_SINGLES.find(y=>y.id===sid); return x
        ? `<button class="chip chip-link" data-action="open-single" data-id="${x.id}">${escapeHtml(x.title)}</button>` : ''; }).join('')}
    </div>` : ''}
  ${!tracks ? `
    <div class="empty-state">
      <p>ยังไม่มีข้อมูลเซ็มบัตสึของซิงเกิลนี้</p>
      <p class="muted-note">เพิ่มได้ที่ SEED_SENBATSU ในไฟล์ index.html</p>
    </div>`
  : tracks.map(renderTrack).join('')}`;
}

const DISC_TABS = [{ id:'singles', label:'ซิงเกิล' }, { id:'albums', label:'อัลบั้ม' }];

function renderWorkRow(w, kind){
  const g = getGroup(w.groupId);
  const tracks = SEED_SENBATSU[w.id];
  const lead = tracks && tracks[0];
  const nick = id => { const m = getMember(id); return escapeHtml(m ? (m.nameTh||m.name) : ''); };
  const label = kind==='album' ? 'อัลบั้มที่' : 'ซิงเกิลที่';
  return `<button class="timeline-item single-row" style="--c:${g.color}" data-action="open-single" data-id="${w.id}">
    <div class="timeline-year">${w.year} · ${g.name} · ${label} ${w.num}</div>
    <div class="timeline-title">${escapeHtml(w.title)}${w.alt?` <span class="title-alt">${escapeHtml(w.alt)}</span>`:''}</div>
    <div class="single-meta">${lead
      ? `${kind==='album'?'เพลงประจำอัลบั้ม':'เซ็มบัตสึ'} ${lead.members.length} คน`
        + (lead.centers.length?' · เซ็นเตอร์ '+lead.centers.map(nick).join(', '):'')
        + (tracks.length>1 ? ` · อีก ${tracks.length-1} เพลง` : '')
      : 'ยังไม่มีข้อมูลเซ็มบัตสึ'}</div>
  </button>`;
}

function renderDiscography(){
  const inGroup = x => state.groupFilter==='all' || x.groupId===state.groupFilter;
  const tabBar = `
  <div class="filter-bar">
    ${renderGroupPills()}
    <div class="subtab-bar" style="margin-left:auto;">
      ${DISC_TABS.map(t=>`<button class="subtab ${state.discTab===t.id?'active':''}"
        data-action="disc-tab" data-value="${t.id}">${t.label}</button>`).join('')}
    </div>
  </div>`;

  if(state.discTab==='albums'){
    const albums = SEED_ALBUMS.filter(inGroup).sort((a,b)=> b.year-a.year || b.num-a.num);
    return tabBar + `<div class="timeline">
      ${albums.map(a=>renderWorkRow(a,'album')).join('')}
    </div>
    <p class="muted-note" style="margin-top:10px;">อัลบั้มรวมเพลงจากซิงเกิลที่ออกก่อนหน้า และมีเพลงเฉพาะอัลบั้มเพิ่มมา — แสดงเฉพาะเพลงเฉพาะอัลบั้ม</p>`;
  }
  let singles = SEED_SINGLES.filter(inGroup);
  singles.sort((a,b)=> b.year-a.year || b.num-a.num);
  return tabBar + `
  <div class="timeline">
    ${singles.map(s=>renderWorkRow(s,'single')).join('')}
  </div>`;
}
