  /* The layout is built for one width and scrolls vertically. Panning the

  html,body{

    overflow-x:clip;

  main{ padding:20px 20px calc(104px + env(safe-area-inset-bottom)); max-width:1100px; margin:0 auto; min-height:60vh; }

  /* ---- Wide screens ----
     A phone gets one column in the order the feed was written in. The feed's
     two wrappers dissolve there (display:contents) and each block takes back
     its place with `order`, so the side column's birthdays still come before
     the schedule. From a laptop up the page uses the width it is given. */
  .feed-cols{ display:flex; flex-direction:column; }
  /* order only reaches boxes that exist, so the sections stay blocks and only
     the column wrappers dissolve */
  .sheet-top, .sheet-col, .evm-layout, .evm-media, .evm-body{ display:contents; }
  .sheet-body{ display:flex; flex-direction:column; }
  .sec-stats{ order:1; } .sec-history{ order:2; } .sec-events{ order:3; } .sec-works{ order:4; } .sec-facts{ order:5; } .sec-actions{ order:6; }
  .feed-main, .feed-side{ display:contents; }
  .today-hero-block{ order:1; } .is-over-today{ order:1; } .is-periods{ order:2; } .is-bday-today{ order:3; }
  .is-bday-next{ order:4; } .is-schedule{ order:5; } .is-calendar{ order:6; } .is-past{ order:7; }


  /* Room to scroll past the end. Collapsing a stage plot makes the page
     shorter, and without slack the browser clamps the scroll and drags the
     reader up the page; with it, the panel they pressed stays put. */
  .thead-sticky-outer{
    position:sticky; top:120px; z-index:15;
    margin:0 -16px; width:calc(100% + 32px);
    overflow:hidden;
    border-top:1px solid var(--line);
  }
  .thead-sticky-track{ width:max-content; will-change:transform; }
  .table-wrap{
    border-bottom:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden; background:var(--card);
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    margin:0 -16px; width:calc(100% + 32px);
  }
  .dtable{ display:flex; flex-direction:column; min-width:100%; width:max-content; }
  .dtable .row{
    display:flex; align-items:center; position:relative; isolation:isolate;
    border-bottom:1px solid var(--line); border-left:4px solid var(--c,transparent);
    background:var(--card);
  }
  .dtable .row:last-child{ border-bottom:none; }
  .dtable .row:not(.head){ cursor:pointer; transition:background .12s ease; }
  body:not(.is-scrolling) .dtable .row:not(.head):active{ background:var(--paper-dim); }
  .dtable .row.head{
    background:linear-gradient(135deg, rgba(255,111,165,.3), rgba(47,216,169,.26));
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-left:none;
  }
  .dtable .row.head .cell{
    font-family:'Noto Sans Thai',sans-serif; font-size:15px; letter-spacing:.5px;
    color:var(--ink-soft); text-transform:uppercase; font-weight:600;
    scroll-snap-align:start; background:transparent;
  }
  .sortable-th{ cursor:pointer; user-select:none; }
  .sortable-th:active{ background:rgba(255,255,255,calc(.25*var(--glass-k))) !important; }
  .sortable-th.active-sort{ color:var(--ink); }
  .dtable .cell:not(.sticky-name){ border-right:1px solid var(--line); }
  .dtable .row.head .cell:not(.sticky-name){ border-right:1px solid rgba(255,255,255,calc(.4*var(--glass-k))); }
  .dtable .cell{
    flex:0 0 auto; padding:10px 7px; font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:relative; z-index:1; background:var(--card);
  }
  .dtable .cell.mono{ font-family:'Noto Sans Thai',sans-serif; font-size:13px; }
  .dtable .cell.sticky-name{
    display:flex; align-items:center; gap:7px;
    width:214px; background:var(--card); border-right:1px solid var(--line);
  }
  .dtable .row.head .cell.sticky-name{ background:transparent; border-right:1px solid rgba(255,255,255,calc(.45*var(--glass-k))); }
  body:not(.is-scrolling) .dtable .row:not(.head):active .cell.sticky-name{ background:var(--paper-dim); }
  /* On a phone the name column is a big share of the screen, so it is cut to
     what the longest Thai full name actually measures (123px of text plus the
     avatar and the padding). The longest English names run past that and end
     in an ellipsis; on a wider screen nothing has to. */
  @media (max-width:560px){
    .dtable .cell.sticky-name{ width:176px; }
    /* Latin full names run about half again as long as the Thai ones, so
       English gets a little more of the screen — not enough for the very
       longest, which still end in an ellipsis. */
    html[lang="en"] .dtable .cell.sticky-name{ width:200px; }
  }

    position:fixed; inset:0; z-index:60;
    background:var(--scrim);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);

  @keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPopIn{ from{transform:scale(.94) translateY(10px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
  .modal-glass-card{
    position:relative; width:100%; max-width:460px; max-height:calc(100% - 8px); overflow:hidden;
    background:rgba(255,255,255,calc(.7*var(--glass-k)));
    backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,calc(.55*var(--glass-k)));
    border-radius:24px;
    box-shadow:0 20px 60px rgba(var(--shadow-rgb),.35);
    animation:modalPopIn .22s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column;

  /* A sheet only ever scrolls up and down; anything too wide wraps instead. */
  .modal-scroll{ overflow-y:auto; overflow-x:hidden; overscroll-behavior-x:none; touch-action:pan-y; padding:22px 18px 28px; -webkit-overflow-scrolling:touch; }
  /* The close and share buttons sit over whatever is at the top of the sheet.
     On a themed sheet that is the poster band, and the usual near-transparent
     glass leaves them invisible against it — so the colours are variables the
     band's own palette can take over. */
  .modal-glass-card{
    --chrome-bg:rgba(255,255,255,calc(.7*var(--glass-k)));
    --chrome-edge:rgba(255,255,255,calc(.6*var(--glass-k)));
    --chrome-fg:var(--ink);
  }
  .modal-close-btn{
    position:absolute; top:14px; right:14px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:var(--chrome-bg); border:1px solid var(--chrome-edge);
    display:flex; align-items:center; justify-content:center;
    color:var(--chrome-fg); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .modal-close-btn svg{ width:16px; height:16px; }
  .modal-close-btn:active{ background:rgba(255,255,255,calc(.95*var(--glass-k))); }

  .modal-share-btn{
    position:absolute; top:14px; right:54px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:var(--chrome-bg); border:1px solid var(--chrome-edge);
    display:flex; align-items:center; justify-content:center;
    color:var(--chrome-fg); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .modal-share-btn svg{ width:15px; height:15px; }
  .modal-share-btn:active{ background:rgba(255,255,255,calc(.95*var(--glass-k))); }

  /* A shortcut out to the group's own app. It cannot show who is live — that
     is closed to us — so it says what it is rather than pretending to know. */
  .iam-link{
    display:flex; align-items:center; gap:11px; margin:2px 0 16px;
    padding:11px 14px; border-radius:15px;
    background:var(--glass-card); border:1px solid var(--glass-edge);
    text-decoration:none; color:inherit;
  }
  .iam-icon{
    width:34px; height:34px; border-radius:9px; flex:none; display:block;
    border:1px solid var(--line); background:#fff;
  }
  .iam-text{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .iam-name{
    font-family:'Noto Sans Thai',sans-serif; font-size:14px; font-weight:800; color:var(--ink);
  }
  .iam-sub{ font-size:11.5px; color:var(--ink-soft); }
  .iam-go{ flex:none; color:var(--ink-soft); font-size:15px; }
  .iam-link:active{ background:var(--card); }

  /* A sheet can take the poster's colours the whole way down rather than only
     at the top. Everything inside already draws from the theme tokens, so the
     palette is swapped by redefining those on this one card — no element needs
     to know it is on a themed sheet. The sheet stays light in either mode,
     because the poster is a printed thing and that is what it looks like. */
  .modal-glass-card.is-postered, .ev-card.is-themed, .today-hero.is-themed{
    --paper-dim:color-mix(in srgb, var(--sheet-ink) 8%, var(--sheet-bg));
    --ink:var(--sheet-ink);
    --ink-soft:color-mix(in srgb, var(--sheet-ink) 66%, transparent);
    --paper:var(--sheet-bg);
    --card:color-mix(in srgb, #fff 64%, var(--sheet-bg));
    --glass-card:color-mix(in srgb, #fff 58%, var(--sheet-bg));
    --glass-edge:color-mix(in srgb, var(--sheet-ink) 15%, transparent);
    --line:color-mix(in srgb, var(--sheet-ink) 14%, transparent);
    --glass-k:1;
    --danger:#B84545;
    --danger-soft:#FBEAEA;
    background:var(--sheet-bg);
    color:var(--sheet-ink);
  }
  /* Headings and their marker stay on the sheet's own text colour, which is
     chosen against the surface and so cannot disappear into it. A poster accent
     is picked to read on the band — the festival's cream reads on its dark red
     and vanishes on cream paper — so it is not safe to reuse down here. */
  .modal-glass-card.is-postered .evm-head::before{ background:var(--ink); }
  /* The same palette on the cards in the feed, so an event looks like itself
     before it is opened. */
  .ev-card.is-themed{ border-color:color-mix(in srgb, var(--c) 32%, transparent); box-shadow:0 5px 20px color-mix(in srgb, var(--c) 14%, transparent); }
  .ev-card.is-themed.is-now{ border-color:color-mix(in srgb, var(--c) 60%, transparent); }
  .today-hero.is-themed{ background:var(--sheet-bg); }
  /* In dark mode the feed cards go dark too, tinted with the event's colour,
     so a themed card sits among the others instead of glaring. (The opened
     sheet stays light, like the printed poster.) Accent-coloured text is
     lifted towards white so a navy or maroon accent still reads. */
  :root[data-theme="dark"] .ev-card.is-themed, :root[data-theme="dark"] .today-hero.is-themed,
  :root[data-theme="dark"] .modal-glass-card.is-postered{
    --sheet-dark:color-mix(in srgb, var(--pc) 26%, #15111b);
    --ink:color-mix(in srgb, var(--sheet-bg) 90%, #fff);
    --ink-soft:color-mix(in srgb, var(--sheet-bg) 62%, #8a8497);
    --paper:var(--sheet-dark);
    --paper-dim:color-mix(in srgb, var(--pc) 34%, #15111b);
    --card:color-mix(in srgb, var(--pc) 30%, #1c1724);
    --glass-card:var(--sheet-dark);
    --glass-edge:color-mix(in srgb, var(--pc) 45%, rgba(255,255,255,.14));
    --line:rgba(255,255,255,.12);
    --c-text:color-mix(in srgb, var(--pc) 45%, #fff);
    background:var(--sheet-dark);
    color:var(--ink);
    border-color:color-mix(in srgb, var(--pc) 55%, rgba(255,255,255,.2));
    box-shadow:0 6px 22px color-mix(in srgb, var(--pc) 22%, transparent);
  }
  /* filled pills keep the true accent under their white text; only text
     drawn in the accent is lifted */
  :root[data-theme="dark"] .modal-glass-card.is-postered{
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    --danger:#F28B8B;
    --danger-soft:color-mix(in srgb, #B84545 30%, var(--sheet-dark));
  }
  :root[data-theme="dark"] .is-postered .evm-price.is-link,
  :root[data-theme="dark"] .is-postered .evm-closed{ color:#fff; }
  :root[data-theme="dark"] .is-postered .evm-closed{ background:#B84545; }
  :root[data-theme="dark"] .is-postered .evm-price:not(.is-link):not(.is-closed),
  :root[data-theme="dark"] .is-postered .evm-map svg,
  :root[data-theme="dark"] .is-postered .slot-date,
  :root[data-theme="dark"] .is-postered .ev-starts,
  :root[data-theme="dark"] .is-postered .evm-related .chip-link,
  :root[data-theme="dark"] .ev-card.is-themed .ev-open,
  :root[data-theme="dark"] .today-hero.is-themed .today-hero-open,
  :root[data-theme="dark"] .ev-card.is-themed .ev-d{ color:var(--c-text); }
  :root[data-theme="dark"] .ev-card.is-themed .ev-when,
  :root[data-theme="dark"] .today-hero.is-themed .today-hero-status{ box-shadow:0 0 0 1px rgba(255,255,255,.18); }

  .cal-wrap{
    background:var(--glass-card); border:1px solid var(--glass-edge);
    border-radius:18px; padding:14px 12px 12px; margin-top:10px;
  }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-title{ font-family:'Noto Sans Thai',sans-serif; font-size:15px; font-weight:800; color:var(--ink); }
  .cal-nav{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:19px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-dow{
    display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px;
  }
  .cal-dow span{
    text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-soft);
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-cell{
    position:relative; aspect-ratio:1; border:0; background:transparent; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border-radius:10px; cursor:default; font-family:'Noto Sans Thai',sans-serif;
  }
  .cal-cell.is-empty{ visibility:hidden; }
  .cal-cell.has-any{ cursor:pointer; }
  .cal-num{ font-size:13px; font-weight:600; color:var(--ink); }
  .cal-cell:not(.has-any) .cal-num{ color:var(--ink-soft); opacity:.55; }
  .cal-dots{ display:flex; gap:2px; height:5px; align-items:center; }
  .cal-dots i{ width:5px; height:5px; border-radius:50%; display:block; }
  .cal-dots i.is-bday{ background:var(--gold); }
  .cal-cell.is-today{ background:color-mix(in srgb, var(--bnk) 13%, transparent); }
  .cal-cell.is-today .cal-num{ color:var(--bnk); font-weight:800; }
  .cal-cell.is-picked{ background:var(--ink); }
  .cal-cell.is-picked .cal-num{ color:var(--paper); font-weight:800; }

  .cal-hint{ text-align:center; margin:12px 0 2px; font-size:12px; }
  .cal-day-detail{ margin-top:12px; border-top:1px solid var(--line); padding-top:11px; }
  .cal-day-title{
    font-family:'Noto Sans Thai',sans-serif; font-size:12.5px; font-weight:800;
    color:var(--ink-soft); margin-bottom:8px;
  }
  .cal-item{
    width:100%; box-sizing:border-box; display:flex; align-items:center; gap:9px;
    text-align:left; padding:10px 12px; margin-bottom:6px;
    border:1px solid var(--line); border-left:3px solid var(--c);
    border-radius:11px; background:var(--card); cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .cal-item-tag{
    flex:none; font-size:10.5px; font-weight:800; color:var(--c);
    background:color-mix(in srgb, var(--c) 13%, transparent);
    padding:3px 7px; border-radius:999px;
  }

  .cmp-open-btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px;
    border:1px solid var(--line); background:var(--card);
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:700;
    color:var(--ink); cursor:pointer;
  }

  .cmp-search{
    width:100%; box-sizing:border-box; margin-top:4px;
    padding:11px 15px; border-radius:999px;
    border:1px solid var(--line); background:var(--card);
    font-family:'Noto Sans Thai',sans-serif; font-size:14px; color:var(--ink);
  }
  .cmp-search:focus{ outline:none; border-color:var(--bnk); }

  .cmp-heads{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:20px; }
  .cmp-who{ text-align:center; min-width:0; }
  .cmp-face{
    width:84px; height:84px; margin:0 auto 9px; border-radius:50%;
    overflow:hidden; border:3px solid var(--c); background:var(--card);
  }
  .cmp-face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cmp-name{ font-family:'Noto Sans Thai',sans-serif; font-size:16px; font-weight:800; color:var(--ink); }
  .cmp-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .cmp-vs{
    font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--ink-soft);
    padding:5px 9px; border-radius:999px; border:1px solid var(--line); white-space:nowrap;
  }

  .cmp-rows{ border-top:1px solid var(--line); }
  .cmp-row{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
    padding:11px 0 5px;
  }
  .cmp-val{
    font-family:'Noto Sans Thai',sans-serif; font-size:14.5px; font-weight:700;
    color:var(--ink); text-align:center; min-width:0; word-break:break-word;
  }
  .cmp-label{
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); white-space:nowrap;
  }
  /* The difference is the reason for the screen, so it is spelled out rather
     than left for the reader to work out from the two numbers. */
  .cmp-note{
    text-align:center; font-size:12px; color:var(--ink-soft);
    padding-bottom:11px; border-bottom:1px solid var(--line);
  }
  .cmp-row:has(+ .cmp-note){ padding-bottom:0; }
  .cmp-row:not(:has(+ .cmp-note)){ padding-bottom:11px; border-bottom:1px solid var(--line); }

  .backup-card{
    background:var(--glass-card); border:1px solid var(--glass-edge);
    border-radius:16px; padding:16px;
  }
  .backup-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .app-version{ margin:26px 0 6px; text-align:center; font-size:11.5px; color:var(--ink-soft); }

  .toast{
    position:fixed; left:50%; bottom:calc(var(--nav-h, 84px) + 18px);
    transform:translate(-50%, 14px); z-index:200;
    padding:11px 18px; border-radius:999px;
    background:var(--glass-card); border:1px solid var(--glass-edge);
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    font-family:'Noto Sans Thai',sans-serif; font-size:13.5px; font-weight:700; color:var(--ink);
    box-shadow:0 10px 30px rgba(var(--shadow-rgb),.18);
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease-out), transform .22s var(--ease-out);
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  .back-btn-sticky{
    position:sticky; top:132px; z-index:20;
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    color:var(--ink); margin-bottom:14px;
  }
  .back-btn-sticky svg{ width:17px; height:17px; display:block; }
  .back-btn-sticky:active{ background:var(--paper-dim); }
  .detail-head{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px; }
  .detail-avatar{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:34px; color:#fff; flex-shrink:0;
  }
  .detail-name-th{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:29px; line-height:1.15; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail-name-en{ font-size:14px; color:var(--ink-soft); margin-top:3px; }
  .badge{
    display:inline-block; font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:12px;
    padding:4px 12px; border-radius:12px; color:#fff; margin-right:6px; margin-top:9px;
    border:none;
  }
  .badge-link{ cursor:pointer; }
  .badge-link:active{ filter:brightness(.88); }

  .stat-grid{
    display:flex; flex-wrap:wrap;
    gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:22px 0 18px;
  }
  .stat-cell{ background:var(--card); padding:12px 14px; flex:1 1 105px; }
  .stat-cell .label{ font-family:'Noto Sans Thai',sans-serif; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; }
  .stat-cell .value{ font-family:'Noto Sans Thai',sans-serif; font-size:16px; font-weight:600; margin-top:5px; }
  /* A list of hobbies runs to a sentence, so it takes a row of its own. */
  .stat-cell.stat-wide{ flex-basis:100%; }
  .stat-cell.stat-wide .value{ font-size:14.5px; font-weight:500; line-height:1.5; }

  h3.section-label{ font-family:'Noto Sans Thai',sans-serif; font-size:14px; font-weight:600; color:var(--ink-soft); margin:22px 0 6px; text-transform:uppercase; letter-spacing:.4px; }
  .facts-list{ list-style:none; padding:0; margin:8px 0; }
  .facts-list li{ padding:9px 0 9px 18px; position:relative; font-size:14.5px; border-bottom:1px solid var(--line); }
  .facts-list li:before{ content:'\2013'; position:absolute; left:0; color:var(--ink-soft); }
  .muted-note{ color:var(--ink-soft); font-size:14px; }

  .team-history{ list-style:none; padding:0; margin:8px 0 0; }
  .team-history li{
    display:flex; align-items:center; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .team-history li:last-child{ border-bottom:none; }
  .th-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .th-team{ font-weight:600; }
  .th-range{ margin-left:auto; color:var(--ink-soft); font-size:12.5px; white-space:nowrap; }
  .th-now{ color:var(--ink); font-weight:600; }

  .stage-wrap{ position:relative; margin:12px 0 2px; }
  .stage{ position:relative; aspect-ratio:16/9; min-height:210px; }
  .stage-floor{ position:absolute; inset:0; width:100%; height:100%; }
  .stage-row{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    display:flex; justify-content:center; align-items:flex-end;
  }
  /* Each seat takes an equal share of its own row, and the row is a share of
     the stage, so a row always fits the floor at that depth — on any screen
     width, without a pixel minimum that would break the perspective. */
  .seat{
    background:none; border:none; padding:0 2px 12px; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center;
    width:var(--seat); max-width:78px; flex:none; min-width:0;
  }
  .seat-badge{ position:relative; display:block; width:min(54px, 84%); }
  .seat.is-gap{ pointer-events:none; }
  .seat-badge{ transition:transform .22s cubic-bezier(.34,1.4,.64,1); }
  .seat:hover .seat-badge, .seat:focus-visible .seat-badge{ transform:scale(1.14); }
  .seat-face{
    width:100%; aspect-ratio:1; border-radius:50%;
    overflow:hidden; border:none; background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.42), 0 3px 10px rgba(0,0,0,.26);
    display:grid; place-items:center;
    transition:box-shadow .22s ease;
  }
  .seat:hover .seat-face, .seat:focus-visible .seat-face{
    box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 7px 20px rgba(0,0,0,.34);
  }
  /* The centre wears the same faint rim as everyone else, with a soft gold
     halo outside it — the mark reads without the hard ring breaking the glass. */
  .seat.is-centre .seat-face{
    box-shadow:0 0 0 1.5px rgba(255,255,255,.55),
               0 0 0 4.5px color-mix(in srgb, var(--gold) 62%, transparent),
               0 3px 12px rgba(0,0,0,.3);
  }
  .seat.is-centre:hover .seat-face{
    box-shadow:0 0 0 2px rgba(255,255,255,.9),
               0 0 0 6px color-mix(in srgb, var(--gold) 78%, transparent),
               0 8px 22px rgba(0,0,0,.36);
  }
  /* .avatar-img inside is absolutely positioned, so this has to be the
     positioned, clipping ancestor or the photo escapes to the whole stage. */
  .seat-avatar{
    position:relative; overflow:hidden; width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; color:#fff;
    font-size:clamp(11px, 2.2vw, 17px);
  }
  /* The name rides on the portrait rather than sitting under it, so a seat
     takes the height of its circle and rows can pack closer together.
     Turned off at the owner's request: the roster under each track already
     names everyone, so the stage reads cleaner without them. Kept whole —
     delete the display line below to put the names back. */
  .seat-name{
    display:none;
    position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    max-width:132%; padding:2px 8px; border-radius:999px;
    /* tinted glass: enough of the group colour to still read as the group */
    background:color-mix(in srgb, var(--c) 46%, rgba(255,255,255,.22));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.4); color:#fff;
    font-size:clamp(8.5px, calc(10.5px * var(--s)), 12px); font-weight:700; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    box-shadow:0 2px 7px rgba(0,0,0,.22);
  }
  .seat.is-centre .seat-name{
    background:color-mix(in srgb, var(--gold) 68%, rgba(255,255,255,.28));
    border:1px solid rgba(255,255,255,.62);
  }

  /* Sits on the panel rather than in a card of its own: the arrow is what
     says it can be pressed, so the border was only drawing a second box. */
  .stage-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin:10px 0 0; padding:9px 12px 4px; cursor:pointer;
    background:none; border:none; font-family:inherit; color:var(--ink-soft);
    transition:color .18s ease;
  }
  .stage-toggle:hover{ color:var(--ink); }
  .stage-toggle-label{ font-weight:700; font-size:13px; letter-spacing:.02em; }
  .stage-toggle-sub{ font-size:11.5px; }
  .stage-caret{ width:16px; height:16px; transition:transform .26s cubic-bezier(.34,1.3,.64,1); }
  .stage-caret svg{ width:100%; height:100%; display:block; }
  .stage-toggle:hover .stage-caret{ transform:translateY(2px); }
  .stage-toggle.is-open .stage-caret,
  .stage-toggle.is-open:hover .stage-caret{ transform:rotate(180deg); }

  @keyframes stageIn{
    from{ opacity:0; transform:translateY(-10px) scale(.96); }
    to{ opacity:1; transform:none; }
  }
  .stage-wrap{ animation:stageIn .4s cubic-bezier(.34,1.32,.64,1) both; }
  @media (prefers-reduced-motion:reduce){
    .stage-wrap{ animation:none; }
    .stage-caret, .seat-badge, .seat-face{ transition:none; }
  }
  @media (max-width:560px){
    .stage{ aspect-ratio:1/1; min-height:260px; }
  }

  .social-row{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 2px; }
  .social-chip{
    display:inline-flex; align-items:center; justify-content:center;
    width:42px; height:42px; border-radius:50%; text-decoration:none;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    box-shadow:0 2px 8px rgba(var(--shadow-rgb),.08);
    transition:transform .18s var(--ease-out), border-color .18s ease, background .18s ease;
  }
  .social-chip:hover{ border-color:var(--c); background:color-mix(in srgb, var(--c) 8%, var(--card)); }
  .social-chip:active{ transform:scale(.9); transition-duration:.08s; }
  .social-ico{ width:19px; height:19px; flex:none; color:var(--c); }
  .social-ico svg{ width:100%; height:100%; display:block; }
  .social-handle{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:15ch; }

  .works-count{ color:var(--ink-soft); font-size:12.5px; margin:6px 0 0; }
  .stat-cell .sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .shared-day{ padding:9px 0; border-bottom:1px solid var(--line); }
  .shared-day:last-of-type{ border-bottom:none; }
  .shared-date{ display:flex; align-items:baseline; gap:8px; font-weight:600; font-size:14px; }
  .shared-date span{ font-size:11.5px; color:var(--ink-soft); font-weight:400; }
  .shared-who{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .work-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .work-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--paper-dim); border:1px solid var(--line); border-radius:11px;
    padding:9px 12px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .work-row:hover{ border-color:var(--ink-soft); }
  .work-row.is-centre{
    border-color:var(--gold);
    background:color-mix(in srgb, var(--gold) 12%, var(--paper-dim));
  }
  .work-main{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .work-track{ font-weight:600; font-size:14px; }
  .work-from{ font-size:11.5px; color:var(--ink-soft); }
  .work-centre{
    flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em;
    background:var(--gold); color:#fff; padding:3px 7px; border-radius:6px;
  }

  .action-row{ display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; }
  .btn-secondary{
    background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:14px; padding:9px 18px; border-radius:20px; cursor:pointer;
  }
  .btn-danger{
    background:none; color:var(--danger); border:1px solid var(--danger);
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13px; padding:9px 17px; border-radius:20px; cursor:pointer;
  }

  /* groups view */
  .group-card{
    background:var(--card); border-radius:10px; border-top:4px solid var(--c);
    box-shadow:0 1px 3px rgba(var(--shadow-rgb),.08); padding:22px; margin-bottom:20px;
  }
  .group-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .group-head h2{ margin:0; font-size:27px; font-family:'Noto Sans Thai',sans-serif; font-weight:800; }
  .group-card p{ font-size:14.5px; line-height:1.6; margin:6px 0 12px; }
  .official-colour{ display:flex; align-items:center; gap:9px; margin:-2px 0 14px; font-size:13px; color:var(--ink-soft); }
  .official-colour b{ color:var(--ink); font-weight:700; }
  .official-swatch{ width:22px; height:22px; border-radius:7px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), 0 2px 6px rgba(var(--shadow-rgb),.15); }
  .team-row{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-dim); border:none; border-radius:7px; padding:11px 15px; margin-bottom:6px;
    cursor:pointer; font-family:'Noto Sans Thai',sans-serif; font-size:14px; text-align:left; color:var(--ink);
  }
  .team-row:active{ background:var(--line); }
  .team-row span.mono{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; color:var(--ink-soft); }

  /* discography */
  .timeline{ position:relative; padding-left:26px; margin-top:8px; }
  .disc-col{ display:none; }
  .disc-col.is-active{ display:block; }
  .disc-col-head{ display:none; }
  .timeline:before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .timeline-item{ position:relative; padding-bottom:22px; }
  .timeline-item:before{ content:''; position:absolute; left:-26px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--c,var(--ink)); border:2px solid var(--paper); }
  .timeline-year{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; color:var(--ink-soft); }
  .timeline-title{ font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:16.5px; margin-top:2px; }

  /* sub-tabs shared by the stats screens */
  .subtab-bar{ display:flex; gap:6px; margin:0 0 4px; flex-wrap:wrap; }
  .subtab{
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.6*var(--glass-k)));
    color:var(--ink-soft); border-radius:20px; padding:7px 15px; cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:600;
    transition:background .18s var(--ease-out), color .18s var(--ease-out);
  }
  .subtab.active{ background:var(--ink); color:var(--paper); border-color:transparent; }

  /* proportional bars used by the distribution blocks */
  .bar-row{ display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:10px; margin-bottom:7px; }
  .bar-label{ font-size:12.5px; color:var(--ink-soft); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ display:block; background:var(--paper-dim); border-radius:999px; height:16px; overflow:hidden; }
  .bar-fill{ display:block; height:100%; border-radius:999px; background:var(--c,var(--ink)); min-width:2px; transition:width .5s var(--ease-out); }
  .bar-val{ font-size:12.5px; font-weight:600; }
  .stats-note{ color:var(--ink-soft); font-size:12.5px; margin:10px 0 0; }

  /* discography rows and the line-up page */
  button.single-row{
    display:block; width:100%; text-align:left; background:none; border:none;
    font:inherit; color:inherit; cursor:pointer; padding:0 6px 22px 0; margin-left:-6px;
    padding-left:6px; border-radius:8px; transition:background .16s var(--ease-out);
  }
  .single-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  @media (hover:hover){ button.single-row:hover{ background:var(--paper-dim); } }
  .single-head{ border-left:4px solid var(--c); padding:2px 0 2px 14px; margin:4px 0 6px; }
  .single-head h2{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:26px; margin:4px 0 0; }
  .single-th{ color:var(--ink-soft); font-size:14.5px; margin:3px 0 0; }
  .title-alt{ font-weight:500; font-size:13px; color:var(--ink-soft); }
  .album-singles{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
  .chip-link{ cursor:pointer; border:1px solid var(--line); font-family:'Noto Sans Thai',sans-serif; }
  @media (hover:hover){ .chip-link:hover{ background:var(--paper-dim); } }
  /* Each track gets its own panel. Three tracks of near-identical chips ran
     together as one field otherwise, with nothing saying where one ended. */
  /* The accent is painted as background rather than as a thick left border:
     a 3px border meeting 1px ones under a 13px radius tapers at the corners
     and leaves a wedge. As background the radius clips it cleanly, and the
     left border goes transparent so the stripe reaches the very edge. */
  .track-block{
    margin:0 0 14px; padding:14px 15px 16px;
    border:1px solid var(--line); border-left-color:transparent;
    border-radius:13px;
    background:linear-gradient(to right, var(--silver) 0 4px, var(--paper-dim) 4px);
  }
  .track-block.is-lead{
    background:linear-gradient(to right, var(--gold) 0 4px, var(--paper-dim) 4px);
  }
  .track-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 2px; }
  .track-tag{
    flex-shrink:0; font-family:'Noto Sans Thai',sans-serif; font-size:10px; font-weight:700;
    padding:3px 8px; border-radius:5px; background:var(--paper-dim); color:var(--ink-soft);
  }
  .track-tag{ background:var(--silver); color:#fff; }
  .track-tag.lead{ background:var(--gold); color:#241a06; }
  .track-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15.5px; }
  .track-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 9px; }


  /* anything that jumps through to a filtered roster */
  button.bar-row{
    width:100%; background:none; border:none; padding:6px 4px; margin:0 -4px 0;
    border-radius:7px; cursor:pointer; font:inherit; color:inherit; text-align:left;
    transition:background .16s var(--ease-out);
  }
  button.stat-cell{
    border:none; cursor:pointer; font:inherit; color:inherit; text-align:left; width:100%;
    transition:background .16s var(--ease-out);
  }
  .link-inline{
    background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit;
    text-decoration:underline; text-decoration-color:color-mix(in srgb, currentColor 35%, transparent);
    text-underline-offset:3px;
  }
  .link-inline.strong{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15px; }
  .link-h2{
    background:none; border:none; padding:0; cursor:pointer; text-align:left;
    font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:27px; color:inherit;
  }
  .link-inline:active, .link-h2:active{ opacity:.6; }
  @media (hover:hover){
    button.bar-row:hover{ background:var(--paper-dim); }
    button.stat-cell:hover{ background:var(--paper-dim); }
    .link-inline:hover, .link-h2:hover{ text-decoration-color:currentColor; }
  }

  /* birthdays */
  .bday-next{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch; }
  /* A chip sliced in half at the edge reads as broken rather than as "there
     is more"; the row fades out instead, on whichever side still has chips
     past it. */
  .bday-next.fade-end:not(.fade-start){
    -webkit-mask-image:linear-gradient(to right, #000 78%, transparent 100%);
    mask-image:linear-gradient(to right, #000 78%, transparent 100%);
  }
  .bday-next.fade-start:not(.fade-end){
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14%);
    mask-image:linear-gradient(to right, transparent 0, #000 14%);
  }
  .bday-next.fade-start.fade-end{
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14%, #000 78%, transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 14%, #000 78%, transparent 100%);
  }
  .bday-next::-webkit-scrollbar{ display:none; }
  .bday-chip{
    flex:0 0 auto; display:flex; align-items:center; gap:9px; cursor:pointer; text-align:left;
    border:1px solid var(--line); border-left-color:transparent;
    background:linear-gradient(to right, var(--c,var(--ink)) 0 4px, var(--card) 4px);
    border-radius:10px; padding:9px 13px 9px 11px; font-family:'Noto Sans Thai',sans-serif;
    color:var(--ink); box-shadow:0 1px 3px rgba(var(--shadow-rgb),.08);
  }
  .bday-chip{ transition:transform .2s var(--ease-out), border-color .2s ease, box-shadow .2s var(--ease-out); }
  .bday-chip .who{ transition:color .2s ease; }
  .bday-chip .when{ font-size:11px; color:var(--ink-soft); }
  .bday-chip .who{ font-size:14px; font-weight:600; margin-top:1px; }
  .bday-chip.today{ border-color:var(--gold); background:var(--bnk-soft); }
  .month-block{ margin-bottom:16px; }
  .month-head{
    display:flex; align-items:baseline; gap:8px; margin:0 0 7px;
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:15px;
  }
  .month-head .n{ font-size:12px; font-weight:500; color:var(--ink-soft); }
  .bday-row{
    display:flex; align-items:center; gap:10px; width:100%; cursor:pointer; text-align:left;
    background:var(--card); border:none; border-bottom:1px solid var(--line);
    padding:9px 12px; font-family:'Noto Sans Thai',sans-serif; font-size:14px; color:var(--ink);
  }
  .bday-row:first-child{ border-top-left-radius:9px; border-top-right-radius:9px; }
  .bday-row:last-child{ border-bottom:none; border-bottom-left-radius:9px; border-bottom-right-radius:9px; }
  .bday-row:active{ background:var(--paper-dim); }
  .bday-row .day{ font-weight:700; width:26px; flex-shrink:0; color:var(--c,var(--ink)); }
  .bday-row .age{ margin-left:auto; font-size:12px; color:var(--ink-soft); flex-shrink:0; }
  .age-step{ display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .age-step .from{ opacity:.55; }
  .age-step .arrow{ opacity:.5; font-size:11px; }
  .age-step .to{ font-weight:700; color:var(--ink); }

  /* today's birthday carries the row instead of a label */
  .bday-row.is-today{ background:var(--bnk-soft); }
  .bday-row.is-today .day,
  .bday-row.is-today > span:not(.day):not(.age){ font-weight:800; }
  .bday-row.is-today .age-step .to{
    color:var(--c); font-size:14px;
    animation:agePulse 1.6s var(--ease-out) infinite;
  }
  @keyframes agePulse{ 0%,100%{ transform:scale(1); } 45%{ transform:scale(1.22); } }
  .bday-row.is-today .age-step .to::after{ content:' 🎂'; }
  @media (prefers-reduced-motion:reduce){ .bday-row.is-today .age-step .to{ animation:none; } }

  /* history timeline */
  .year-block{ margin-bottom:4px; }
  .year-head{ font-family:'Noto Sans Thai',sans-serif; font-weight:800; font-size:20px; margin:0 0 4px; }
  .ev-row{ display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; padding:3px 0; }
  .ev-dot{ width:8px; height:8px; border-radius:50%; background:var(--c,var(--ink)); margin-top:6px; flex-shrink:0; }
  .ev-names{ color:var(--ink-soft); }

  /* advanced filter panel */
  .adv-panel{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:13px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:15px; margin:0 20px 14px;
  }
  .adv-field{ display:flex; flex-direction:column; gap:6px; }
  .adv-field > label{ font-family:'Noto Sans Thai',sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .adv-field > label .cover{ font-weight:500; opacity:.8; }
  .adv-range{ display:flex; align-items:center; gap:7px; }
  .adv-range input{
    width:100%; min-width:0; background:var(--paper-dim); color:var(--ink);
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13.5px; outline:none;
  }
  .adv-range input:focus{ border-color:var(--ink-soft); }
  .adv-range span{ color:var(--ink-soft); font-size:13px; }
  .adv-field select{
    background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:8px 10px; font-size:13.5px; outline:none;
  }
  .adv-actions{ display:flex; align-items:flex-end; }
  .adv-actions .btn-secondary:disabled{ opacity:.45; cursor:default; }
  .pill.adv-on{ background:var(--ink); color:var(--paper); border-color:transparent; }
  @media (max-width:640px){ .adv-panel{ margin-left:14px; margin-right:14px; } }

  /* form */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-field{ display:flex; flex-direction:column; gap:5px; }
  .form-field.full{ grid-column:1/-1; }
  .form-field label{ font-family:'Noto Sans Thai',sans-serif; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .form-field input, .form-field select, .form-field textarea{
    font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{ border-color:var(--ink-soft); }
  .form-field textarea{ resize:vertical; font-family:'Noto Sans Thai',sans-serif; }

  .loading{ padding:60px; text-align:center; font-family:'Noto Sans Thai',sans-serif; color:var(--ink-soft); }

  /* profile slot in header */
  #profile-slot{ margin-left:auto; }
  .signin-btn{
    background:rgba(255,255,255,calc(.5*var(--glass-k))); color:var(--ink); border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13.5px;
    padding:8px 18px; border-radius:20px; cursor:pointer;
  }
  .signin-btn:hover{ background:rgba(255,255,255,calc(.7*var(--glass-k))); }
  .profile-slot-wrap{ position:relative; }
  .theme-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; color:var(--ink);
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
    transition:background .18s var(--ease-out), transform .35s var(--ease-spring);
  }
  .theme-btn svg{ width:17px; height:17px; display:block; }
  /* Thai and English sit at different sizes; the switch keeps its own width so
     the header does not jump when the label changes. */
  .lang-btn{
    min-width:46px;
    flex-shrink:0; height:34px; padding:0 12px; border-radius:999px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
    font-family:'Noto Sans Thai',sans-serif; font-size:12.5px; font-weight:800; letter-spacing:.02em;
    background:rgba(255,255,255,calc(.5*var(--glass-k)));
    border:1px solid rgba(255,255,255,calc(.7*var(--glass-k)));
  }
  .theme-btn:active{ transform:scale(.9); }
  .mini-avatar-btn{ background:none; border:none; cursor:pointer; padding:0; display:block; }
  .mini-avatar{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--gold); color:#241a06; font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:14px;
    border:2px solid rgba(255,255,255,calc(.4*var(--glass-k)));
  }
  .profile-dropdown{
    position:absolute; top:44px; right:0; z-index:40; width:220px;
    background:var(--card); border-radius:12px; border:1px solid var(--line);
    box-shadow:0 14px 34px rgba(var(--shadow-rgb),.22); padding:8px; text-align:left;
  }
  .profile-dropdown .dropdown-name{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:14px; padding:8px 10px 0; color:var(--ink); }
  .profile-dropdown .dropdown-email{ font-size:12px; color:var(--ink-soft); padding:1px 10px 8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .profile-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none;
    font-family:'Noto Sans Thai',sans-serif; font-size:13.5px; color:var(--ink);
    padding:9px 10px; border-radius:8px; cursor:pointer;
  }
  .profile-dropdown button:hover{ background:var(--paper-dim); }
  .profile-dropdown button.danger{ color:var(--danger); }

  /* ---------------------------- feed ---------------------------- */
  .feed-scope{
    display:inline-flex; gap:3px; margin-top:12px; padding:3px;
    border-radius:999px; background:var(--glass-card); border:1px solid var(--glass-edge);
  }
  .scope-btn{
    padding:6px 13px; border:0; border-radius:999px; background:none; cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif; font-size:12px; font-weight:700;
    color:var(--ink-soft); white-space:nowrap;
  }
  .scope-btn.is-on{ background:var(--bnk); color:#fff; }

  .feed-head{ margin:4px 0 22px; }
  /* the date sits in the same frosted material as the cards below it */
  .feed-today{
    display:inline-flex; align-items:center; gap:7px; margin:0;
    padding:5px 13px 5px 11px; border-radius:999px;
    font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--glass-card); border:1px solid var(--glass-edge);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  }
  .feed-today::before{
    content:''; flex:none; width:6px; height:6px; border-radius:50%;
    background:linear-gradient(135deg, var(--brand-a), var(--brand-b));
  }
  /* The two group colours run through the title, so the masthead carries the
     same pink-to-teal the nav and the background already use. */
  .feed-title{
    /* Thai tone marks ride above the line box, and background-clip:text only
       paints inside it, so a tight line-height drops them entirely. */
    margin:7px 0 0; padding:2px 0 4px; font-size:33px; font-weight:800;
    letter-spacing:-.022em; line-height:1.42;
    background:linear-gradient(100deg, var(--brand-a) 0%, var(--brand-mid) 48%, var(--brand-b) 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
  }
  .feed-block{ margin:0 0 24px; }
  .feed-block .section-label{
    display:flex; align-items:center; gap:9px; margin:0 0 12px;
    font-size:17px; font-weight:800; letter-spacing:-.012em;
    color:var(--ink); text-transform:none;
  }
  .feed-block .section-label::before{
    content:''; flex:none; width:4px; height:18px; border-radius:999px;
    background:linear-gradient(180deg, var(--brand-a), var(--brand-b));
  }
  /* a birthday is the gold moment on the page, so its heading matches */
  .feed-block.is-birthday .section-label::before{
    background:linear-gradient(180deg, var(--gold), #E8C25A);
  }

  .bday-today-wrap{ position:relative; }
  .bday-fx{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  .bday-today-grid{ position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .bday-today{
    flex:1 1 150px; max-width:210px; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:6px 10px 10px; cursor:pointer; text-align:center;
    background:none; border:none;
    transition:transform .2s var(--ease-out);
  }
  .bday-today-face{
    width:96px; height:96px; border-radius:50%; position:relative; overflow:hidden;
    transition:transform .26s var(--ease-out), box-shadow .26s var(--ease-out);
    display:grid; place-items:center; color:#fff; font-size:30px; font-weight:800;
    box-shadow:0 0 0 3px var(--gold), 0 10px 26px rgba(var(--shadow-rgb),.18);
    margin-bottom:11px;
  }
  .bday-today-name{ font-size:16px; font-weight:800; line-height:1.2; }
  .bday-today-sub{ font-size:11.5px; color:var(--ink-soft); }
  .bday-today-age{ font-size:12.5px; font-weight:700; color:var(--gold); margin-top:2px; }
  .bday-today-group{
    margin-top:5px; font-size:10.5px; font-weight:800; letter-spacing:.04em;
    padding:2px 9px; border-radius:999px; color:#fff; background:var(--c);
  }

  .ev-card{
    display:flex; gap:14px; padding:15px 16px; margin:0 0 10px;
    background:var(--glass-card);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-edge);
    border-radius:17px;
    box-shadow:0 5px 20px rgba(var(--shadow-rgb),.07);
  }
  /* Anything on today gets the group's colour on its edge; the rest stay
     plain so the one happening now is the only thing shouting. */
  .ev-card.is-now{
    border-color:color-mix(in srgb, var(--c) 50%, var(--glass-edge));
    box-shadow:0 5px 22px color-mix(in srgb, var(--c) 18%, transparent);
  }
  .ev-date{
    flex:none; width:68px; display:flex; flex-direction:column; gap:4px;
    padding:2px 12px 2px 0;
    border-right:1px solid color-mix(in srgb, var(--ink-soft) 20%, transparent);
  }
  .ev-d{ font-size:15px; font-weight:800; line-height:1.2; letter-spacing:-.01em; }
  .ev-time{ font-size:11.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.01em; }
  .ev-when{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.03em;
    color:#fff; background:var(--c); border-radius:999px; padding:2px 7px;
    align-self:flex-start; white-space:nowrap;
  }
  .ev-body{ min-width:0; flex:1; }
  .ev-title{ margin:0; font-size:16px; font-weight:800; line-height:1.32; letter-spacing:-.01em; }
  .ev-tag{
    display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em;
    padding:2px 7px; border-radius:999px; margin-right:6px; vertical-align:1px;
    background:var(--paper-dim); color:var(--ink-soft);
  }
  .ev-venue{ margin:6px 0 0; font-size:11.5px; color:var(--ink-soft); line-height:1.45; opacity:.9; }
  .ev-groups{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .ev-group{
    font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 8px;
    border-radius:999px; color:#fff; background:var(--c);
    border:0; font-family:inherit; line-height:inherit; cursor:pointer;
  }
  .cal-item.is-past{ opacity:.62; }
  .cal-item.is-today{
    border-width:1px 1px 1px 4px;
    background:color-mix(in srgb, var(--c) 12%, var(--card));
  }

  /* A grid item is as wide as its content by default, and the chart's content is
     wider than a phone on purpose — so the columns are told they may be narrower,
     leaving the frame to scroll and zoom instead of the card spilling off screen. */
  .org-groups{ display:grid; grid-template-columns:minmax(0, 1fr); gap:14px; }
  .org-groups > .org-tree{ min-width:0; overflow:hidden; }
  @media (min-width:760px){ .org-groups{ grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); align-items:start; } }
  .org-tree{ --org-line:color-mix(in srgb, var(--c) 45%, transparent); padding-bottom:14px; }
  .org-tree .group-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .org-legend{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:0 0 6px;
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
  }
  .org-key{ display:inline-flex; align-items:center; gap:5px; }
  .org-key-arrow{ opacity:.5; }
  .rank-swatch{ width:14px; height:14px; border-radius:4px; display:inline-block; box-sizing:border-box; }
  .org-hint{ margin:0 0 12px; font-size:11.5px; color:var(--ink-soft); }

  .org-zoom{ display:inline-flex; gap:4px; flex:none; }
  .org-zoom button{
    min-width:32px; height:30px; padding:0 9px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:800;
  }

  /* The frame scrolls both ways once the tree is larger than it. */
  .org-viewport{
    overflow:auto; max-height:72vh; margin:0 -4px; padding:4px;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  .org-canvas{ padding:0 12px; box-sizing:border-box; }

  .org-tier{ position:relative; display:flex; justify-content:center; gap:12px; padding-top:24px; }
  .org-tier.is-first{ padding-top:4px; }
  .org-slot{ position:relative; flex:0 1 150px; min-width:0; display:flex; flex-direction:column; align-items:center; }
  .org-tier.is-teams > .org-slot{ flex:0 0 250px; }
  .org-tier.is-wide > .org-slot{ flex:1 1 auto; }
  /* The lines: a stem down from the tier above, a bar across from the first
     child's centre to the last's, and a stub up from each child to the bar. */
  .org-tier:not(.is-first)::before,
  .org-tier:not(.is-first) > .org-slot::before{
    content:''; position:absolute; width:2px; height:12px; margin-left:-1px; background:var(--org-line);
  }
  .org-tier:not(.is-first)::before{ top:0; left:50%; }
  .org-tier:not(.is-first) > .org-slot::before{ top:-12px; left:50%; }
  .org-tier:not(.is-first) > .org-slot::after{
    content:''; position:absolute; top:-13px; left:-6px; right:-6px; height:2px; background:var(--org-line);
  }
  .org-tier > .org-slot:first-child::after{ left:50%; }
  .org-tier > .org-slot:last-child::after{ right:50%; }
  .org-tier > .org-slot:only-child::after{ display:none; }

  .org-node{
    width:100%; max-width:150px; box-sizing:border-box; margin:0;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 8px 9px; border-radius:14px; text-align:center;
    font-family:'Noto Sans Thai',sans-serif; cursor:pointer;
  }
  .org-avatar{
    position:relative; overflow:hidden; width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin-bottom:3px;
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:18px; color:#fff;
  }
  .org-role{ font-size:10.5px; font-weight:800; line-height:1.25; }
  .org-name{ font-size:13.5px; font-weight:800; line-height:1.2; overflow-wrap:anywhere; }
  .org-term{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:500; margin-top:2px; }
  .org-past .org-term{ display:inline; }
  .org-past{ margin-top:7px; font-size:11.5px; color:var(--ink-soft); text-align:center; }

  /* Rank as colour, strongest at the top. The fills for the upper ranks are a
     shade darker than the group colour so white text on them stays readable. */
  .org-node.rank-1, .rank-swatch.rank-1{
    background:color-mix(in srgb, var(--gold) 18%, var(--card)); border:2px solid var(--gold);
    color:var(--ink); box-shadow:0 6px 18px rgba(var(--shadow-rgb),.14);
  }
  .org-node.rank-1 .org-role{ color:var(--gold); }
  .org-node.rank-2, .rank-swatch.rank-2{
    background:color-mix(in srgb, var(--c) 80%, #000); border:1px solid transparent; color:#fff;
  }
  .org-node.rank-2 .org-role{ color:rgba(255,255,255,.86); }
  .org-node.rank-3, .rank-swatch.rank-3{
    background:color-mix(in srgb, var(--c) 18%, var(--card));
    border:1px solid color-mix(in srgb, var(--c) 55%, var(--line)); color:var(--ink);
  }
  .org-node.rank-3 .org-role{ color:var(--c); }
  .org-members, .rank-swatch.rank-4{
    background:color-mix(in srgb, var(--c) 7%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 24%, var(--line));
  }
  .org-trainees, .rank-swatch.rank-5{
    background:transparent; border:1px dashed color-mix(in srgb, var(--c) 40%, var(--line));
  }
  .org-node.is-empty{
    background:transparent !important; border:1px dashed color-mix(in srgb, var(--c) 45%, var(--line)) !important;
    box-shadow:none !important; color:var(--ink-soft); cursor:default;
  }
  .org-node.is-empty .org-role{ color:var(--ink-soft) !important; }
  .org-node.is-empty .org-name{ font-weight:600; }

  .org-team{ width:100%; display:flex; flex-direction:column; align-items:center; gap:0; }
  .org-team-name{ font-size:12px; font-weight:800; color:var(--c); margin-bottom:7px; text-align:center; }
  .org-leads{ display:flex; gap:8px; justify-content:center; width:100%; position:relative; padding-bottom:14px; }
  .org-leads .org-node{ flex:1 1 0; }
  .org-leads::after{
    content:''; position:absolute; left:50%; bottom:0; width:2px; height:14px; margin-left:-1px; background:var(--org-line);
  }
  .org-leads:last-child{ padding-bottom:0; }
  .org-leads:last-child::after{ display:none; }
  .org-members, .org-trainees{ width:100%; box-sizing:border-box; padding:10px; border-radius:14px; }
  .org-members .ev-people, .org-trainees .ev-people{ justify-content:center; margin-top:0; }
  .org-members .ev-person{ background:color-mix(in srgb, var(--c) 13%, var(--card)); }
  .ev-tba{ margin:7px 0 0; font-size:12px; color:var(--ink-soft); font-style:italic; }
  .ev-people{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .ev-person{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    padding:3px 9px 3px 3px; border-radius:999px;
    background:var(--glass-card); border:1px solid var(--glass-edge);
    font-size:11.5px; font-weight:700; color:inherit;
    transition:border-color .16s ease, transform .16s ease;
  }
  .ev-person .avatar-sm{ width:20px; height:20px; font-size:10px; flex:none; }
  .ev-person-day{
    font-size:10px; font-weight:800; color:var(--c); flex:none;
    background:color-mix(in srgb, var(--c) 14%, transparent);
    padding:2px 6px; border-radius:999px;
  }
  .ev-person.is-oshi{ border-color:var(--gold); background:color-mix(in srgb, var(--gold) 12%, var(--card)); }
  .ev-detail{ margin:9px 0 0; padding-left:16px; }
  .ev-detail li{ font-size:11.5px; color:var(--ink-soft); line-height:1.55; }
  .ev-mine{ margin:8px 0 0; font-size:11.5px; font-weight:700; color:var(--gold); }

  .today-hero{
    position:relative; overflow:hidden; margin:0 0 14px;
    border-radius:22px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, var(--card)), var(--card) 70%);
    border:2px solid color-mix(in srgb, var(--c) 55%, var(--glass-edge));
    box-shadow:0 10px 32px color-mix(in srgb, var(--c) 22%, transparent), 0 2px 8px rgba(var(--shadow-rgb),.08);
  }
  .today-hero.is-openable{ cursor:pointer; transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out); }
  body:not(.is-scrolling) .today-hero.is-openable:active{ transform:scale(.985); transition-duration:.09s; }
  .today-hero-art{
    position:relative; display:flex; justify-content:center;
    background:#000; isolation:isolate; overflow:hidden;
  }
  .today-hero-art::before{
    content:''; position:absolute; inset:-30px; z-index:-1;
    background:var(--art) center/cover; filter:blur(26px) saturate(140%) brightness(.8);
  }
  .today-hero-art img{
    display:block; width:auto; height:auto; max-width:100%; max-height:min(46vh, 420px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .today-hero-band{ padding:6px 6px 0; }
  .today-hero-body{ padding:16px 18px 14px; }
  .today-hero-foot{ padding-top:14px; padding-bottom:16px; }
  .today-hero-status{
    display:inline-flex; align-items:center; gap:8px; margin:0 0 8px;
    padding:5px 12px 5px 10px; border-radius:999px;
    background:var(--c); color:#fff;
    font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:700; letter-spacing:.2px;
  }
  .today-live{
    width:8px; height:8px; border-radius:50%; background:#fff;
    animation:today-pulse 1.6s ease-out infinite;
  }
  @keyframes today-pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,255,255,.8); }
    100%{ box-shadow:0 0 0 9px rgba(255,255,255,0); }
  }
  @media (prefers-reduced-motion: reduce){ .today-live{ animation:none; } }
  .today-hero-title{
    margin:0 0 6px; font-family:'Noto Sans Thai',sans-serif;
    font-size:clamp(21px, 5.6vw, 27px); line-height:1.22; font-weight:800; color:var(--ink);
  }
  .today-hero-meta{ margin:0; font-size:14px; color:var(--ink-soft); line-height:1.45; }
  .today-hero .ev-groups{ margin-bottom:10px; }
  .today-hero-open{ margin:12px 0 0; font-size:13.5px; font-weight:700; color:var(--c); }
  .today-hero-open::after{ content:' ›'; }
  /* LED sign: amber letters glowing on black, a fine dot grid over them. */
  .ticker{
    position:relative; display:flex; align-items:stretch; width:100%;
    margin:0; padding:0; border:0; text-align:left;
    background:#120605; border-bottom:1px solid #3b120b;
    box-shadow:inset 0 1px 0 rgba(255,140,60,.12), inset 0 -8px 16px rgba(0,0,0,.45);
  }
  .ticker-item{ display:inline-flex; align-items:center; gap:9px; }
  .ticker-kind{
    padding:2px 8px; border-radius:6px; background:var(--k); color:#fff;
    font-size:11.5px; font-weight:800; letter-spacing:.6px; text-shadow:none;
    box-shadow:0 0 10px color-mix(in srgb, var(--k) 70%, transparent);
  }
  .ticker-link{
    all:unset; cursor:pointer; color:inherit; font:inherit; text-shadow:inherit; border-radius:4px;
    position:relative; z-index:3;
  }
  .ticker-link:active{ filter:brightness(1.35); }
  .ticker-dot-sep{ color:#8a5a2a; }
  .ticker-close{
    position:relative; z-index:3; flex:0 0 auto; width:38px; border:0; margin:0; padding:0;
    background:#120605; color:#c9a27a; font-size:20px; line-height:1; cursor:pointer;
    box-shadow:-6px 0 12px rgba(0,0,0,.6);
  }
  .ticker-close:active{ color:#fff; background:#2a0e09; }
  .ticker-close svg{ width:18px; height:18px; display:block; margin:auto; }
  .ticker.is-folded{ cursor:pointer; }
  .ticker.is-folded .ticker-badge{ padding-block:0; font-size:11px; }
  .ticker.is-folded .ticker-close{ display:flex; align-items:center; }
  .ticker-folded-text{
    flex:1 1 auto; display:flex; align-items:center; gap:7px; padding:5px 12px; overflow:hidden; white-space:nowrap;
    font-family:'Noto Sans Thai',sans-serif; font-size:12.5px; font-weight:700; color:#FFB23E;
    text-shadow:0 0 5px rgba(255,170,50,.7);
  }
  .ticker-folded-text .ticker-kind{ font-size:10px; padding:1px 6px; }
  .ticker.is-folded:active{ filter:brightness(1.2); }
  .ticker-badge{
    position:relative; z-index:3; flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:0 12px 0 14px; background:#C8231A; color:#fff;
    font-family:'Noto Sans Thai',sans-serif; font-size:12.5px; font-weight:800; letter-spacing:.8px;
    box-shadow:6px 0 12px rgba(0,0,0,.5);
  }
  .ticker-dot{ width:7px; height:7px; border-radius:50%; background:#fff; animation:today-pulse 1.4s ease-out infinite; }
  .ticker-window{ position:relative; flex:1 1 auto; overflow:hidden; }
  .ticker-window::after{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.55) 0.9px, transparent 1.2px);
    background-size:3px 3px;
  }
  .ticker-track{ display:flex; width:max-content; animation:ticker-run var(--dur) linear infinite; }
  .ticker:hover .ticker-track{ animation-play-state:paused; }
  .ticker-run{
    display:flex; align-items:center; gap:14px; padding:9px 14px 9px 14px; white-space:nowrap;
    font-family:'Noto Sans Thai',sans-serif; font-size:15px; font-weight:800; letter-spacing:.5px;
    color:#FFB23E; text-shadow:0 0 5px rgba(255,170,50,.9), 0 0 14px rgba(255,90,20,.5);
  }
  .ticker-sep{ color:#FF4A36; text-shadow:0 0 6px rgba(255,60,40,.9); font-size:12px; }
  @keyframes ticker-run{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } .ticker-dot{ animation:none; } }
  .slot-table{ display:flex; flex-direction:column; gap:8px; margin:6px 0 4px; }
  .slot-row{
    display:flex; gap:12px; align-items:flex-start; padding:10px 12px;
    border:1px solid var(--line); border-radius:14px;
    background:color-mix(in srgb, var(--c) 4%, transparent);
  }
  .slot-row.is-today{ border-color:color-mix(in srgb, var(--c) 60%, var(--line)); background:color-mix(in srgb, var(--c) 12%, transparent); }
  .slot-row.is-done{ opacity:.55; }
  .slot-when{ flex:0 0 86px; display:flex; flex-direction:column; gap:2px; }
  .slot-date{ font-weight:700; font-size:14px; color:var(--c); }
  .slot-time{ font-size:12.5px; color:var(--ink-soft); }
  .slot-now{ align-self:flex-start; margin-top:3px; padding:1px 8px; border-radius:999px; background:var(--c); color:#fff; font-size:11px; font-weight:700; }
  .slot-who{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
  .slot-who .ev-person{ margin:0; }
  .evm-related{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 6px; }
  .evm-related .chip{ white-space:normal; max-width:100%; text-align:left; line-height:1.4; }
  .ev-card.is-openable{ cursor:pointer; transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out), border-color .2s ease; }
  .ev-more-people{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
    background:var(--glass-card); border:1px solid var(--glass-edge);
  }
  .ev-open{
    margin:10px 0 0; font-size:11.5px; font-weight:800; color:var(--c);
    letter-spacing:.01em;
  }
  .ev-open::after{ content:' \203A'; font-weight:700; }

  .sr-count{ margin:9px 0 0; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .sr-more{ margin:4px 0 0; font-size:11.5px; color:var(--ink-soft); }
  .sr-row{
    display:block; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
    margin:0 0 8px; padding:12px 14px;
    background:var(--glass-card); border:1px solid var(--glass-edge);
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-radius:14px;
    transition:transform .2s var(--ease-out), border-color .2s ease, box-shadow .2s var(--ease-out);
  }
  .sr-kind{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.05em;
    color:#fff; background:var(--c); border-radius:999px; padding:2px 8px; margin-bottom:7px;
  }
  .sr-main{ display:block; font-size:15px; font-weight:800; line-height:1.35; letter-spacing:-.01em; }
  .sr-sub{ display:block; margin-top:3px; font-size:11.5px; color:var(--ink-soft); line-height:1.45; }
  @media (hover:hover){
    .sr-row:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb, var(--c) 55%, var(--glass-edge));
      box-shadow:0 12px 26px rgba(var(--shadow-rgb),.12);
    }
  }
  .sr-row:active{ transform:scale(.992); transition-duration:.09s; }

  /* ---- birthday sheet ---- */
  .evm-fest{
    position:relative; overflow:hidden;
    margin:-22px -18px 0; padding:22px 18px 0;
    border-radius:23px 23px 0 0;
    background:linear-gradient(165deg, var(--fest-a), var(--fest-b));
    text-align:center;
  }
  .evm-fest-deco{ position:absolute; inset:0; pointer-events:none; }
  .evm-fest-deco .cfi{
    position:absolute; display:block; width:9px; height:13px; border-radius:2px; opacity:.75;
  }
  .cfi0{ background:#E4457E; }
  .cfi1{ background:#7C4D9B; }
  .cfi2{ background:#F0B840; }
  .cfi3{ background:#2FD8A9; border-radius:50%; width:8px; height:8px; }
  .cfi4{ background:#FFFFFF; border-radius:50%; width:7px; height:7px; }

  .evm-fest-word{
    position:relative; display:block;
    font-family:'Pacifico', 'Noto Sans Thai', cursive;
    font-size:42px; line-height:1.25; color:var(--fest-ink);
    text-shadow:0 2px 0 rgba(255,255,255,.55);
  }
  .evm-fest-sub{
    position:relative; display:block; margin-top:-4px;
    font-size:13px; font-weight:800; letter-spacing:.42em; text-indent:.42em;
    color:var(--fest-ink); opacity:.72;
  }
  .evm-fest-faces{
    position:relative; display:flex; justify-content:center; gap:16px;
    margin-top:16px; padding-bottom:18px;
  }
  .evm-fest-face{
    background:none; border:none; padding:0; cursor:pointer; font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .evm-face-img{
    width:88px; height:88px; border-radius:50%; position:relative; overflow:hidden;
    display:grid; place-items:center; color:#fff; font-size:28px; font-weight:800;
    box-shadow:0 0 0 3.5px #fff, 0 10px 24px rgba(var(--shadow-rgb),.22);
    transition:transform .26s var(--ease-out);
  }
  .evm-fest-name{
    font-size:13px; font-weight:800; color:var(--fest-ink);
    padding:2px 11px; border-radius:999px; background:rgba(255,255,255,.72);
  }
  @media (hover:hover){
    .evm-fest-face:hover .evm-face-img{ transform:translateY(-3px) scale(1.045); }
  }

  /* the venue opens a map */
  .evm-map{
    display:inline-flex; align-items:flex-start; gap:7px; text-decoration:none;
    color:var(--ink-soft); max-width:100%;
    transition:color .16s ease;
  }
  .evm-map svg{ flex:none; width:15px; height:15px; margin-top:1px; color:var(--c); }
  @media (hover:hover){
    .evm-map:hover{ color:var(--ink); }
    .evm-map:hover span{ text-decoration:underline; text-underline-offset:3px; }
  }
  @media (max-width:560px){
    .evm-fest-word{ font-size:35px; }
    .evm-face-img{ width:76px; height:76px; font-size:24px; }
    .evm-fest-faces{ gap:12px; }
  }

  .evm-date{
    display:inline-flex; align-items:center; gap:7px; margin:0;
    padding:5px 13px 5px 11px; border-radius:999px;
    font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--glass-card); border:1px solid var(--glass-edge);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  }
  .evm-date::before{
    content:''; flex:none; width:6px; height:6px; border-radius:50%; background:var(--c);
  }
  .ev-starts{
    display:inline-block; margin:0 0 5px;
    padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:800; letter-spacing:.02em; white-space:nowrap;
    color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent);
  }
  .evm-starts{
    display:inline-flex; align-items:center; margin:0;
    padding:5px 12px; border-radius:999px;
    font-family:'Noto Sans Thai',sans-serif;
    font-size:11.5px; font-weight:800; letter-spacing:.02em;
    color:var(--paper); background:var(--c);
  }
  .evm-meta{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding-right:76px; }
  /* The price is the thing people go looking for, so it sits next to the date
     rather than partway down a list of notices. */
  .evm-price{
    display:inline-flex; align-items:center; gap:5px; margin:0;
    padding:5px 12px; border-radius:999px;
    font-family:'Noto Sans Thai',sans-serif;
    font-size:11.5px; font-weight:800; letter-spacing:.02em;
    color:var(--c); text-decoration:none;
    background:color-mix(in srgb, var(--c) 13%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
  }
  .evm-price svg{ width:13px; height:13px; flex:none; }
  /* Filled in when it goes somewhere, so a price you can act on does not look
     the same as one that is only being stated. */
  .evm-price.is-link{
    background:var(--c); border-color:var(--c);
    color:var(--paper);
  }
  .evm-price.is-link:active{ filter:brightness(1.15); }
  /* Booking having closed is a dead end, so it keeps its own red rather than
     the sheet's accent and never links anywhere. It says the window shut, not
     that the tickets ran out — those are different things to a fan deciding
     whether it is worth asking around. */
  .evm-price.is-closed{
    color:var(--danger);
    background:var(--danger-soft);
    border-color:color-mix(in srgb, var(--danger) 38%, transparent);
  }
  .evm-price.is-closed .evm-amount{ text-decoration:line-through; opacity:.75; }
  .evm-closed{
    font-size:10px; font-weight:900; letter-spacing:.08em;
    padding:2px 7px; border-radius:999px;
    background:var(--danger); color:var(--paper);
  }
  .evm-poster-btn{
    display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in;
  }
  /* With a poster at the top the buttons sit over a photograph, which can be any
     colour anywhere. A dark scrim and a white mark read on all of them, where
     the sheet's own pale glass disappeared into the bright parts. */
  .modal-glass-card.has-poster-img{
    --chrome-bg:rgba(20,16,26,.55);
    --chrome-edge:rgba(255,255,255,.3);
    --chrome-fg:#fff;
  }

  /* Full screen, on top of the sheet it was opened from. Fixed to the viewport
     rather than the card, because the card is a scroll container. */
  .poster-viewer{
    position:fixed; inset:0; z-index:70;
    background:rgba(8,6,12,.94);
    display:flex; align-items:center; justify-content:center;
    padding:18px; box-sizing:border-box; cursor:zoom-out;
    animation:posterIn .18s var(--ease-out);
  }
  @keyframes posterIn{ from{ opacity:0 } to{ opacity:1 } }
  .poster-full{
    max-width:100%; max-height:100%; width:auto; height:auto;
    object-fit:contain; border-radius:8px; display:block;
    touch-action:none;           /* the gestures are ours, not the browser's */
    transform-origin:center center;
    will-change:transform;
    user-select:none; -webkit-user-drag:none;
  }
  .poster-viewer.is-zoomed{ cursor:grab; }

  .ptr{
    position:fixed; top:-46px; left:50%; z-index:15;
    width:38px; height:38px; border-radius:50%;
    transform:translateX(-50%);
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(var(--shadow-rgb),.18);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); opacity:0; pointer-events:none;
  }
  .ptr svg{ width:18px; height:18px; }
  .ptr.is-ready{ color:var(--bnk); border-color:var(--bnk); }
  .ptr.is-loading svg{ animation:ptrSpin .7s linear infinite; }
  @keyframes ptrSpin{ to{ transform:rotate(360deg) } }
  .poster-close{
    position:absolute; top:16px; right:16px; z-index:1;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .poster-close svg{ width:18px; height:18px; }

  /* The poster itself, where we have one. It is a separate file rather than
     part of the page, so it is fetched only when this sheet is opened and the
     page itself stays the size it was. */
  .evm-poster{
    display:block; width:100%; height:auto; margin:0 0 16px;
    border-radius:14px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--ink) 5%, transparent);
  }

  /* A hairline under the title, fading out as it goes, so the name of the event
     reads on its own before the venue and the lists below it start competing. */
  .evm-rule{
    height:1px; border:0; margin:12px 0 13px;
    background:linear-gradient(90deg,
      color-mix(in srgb, var(--ink) 22%, transparent),
      color-mix(in srgb, var(--ink) 8%, transparent) 55%,
      transparent);
  }
  .evm-title{ margin:6px 0 0; font-size:21px; font-weight:800; line-height:1.3; letter-spacing:-.01em; padding-right:34px; }
  .evm-venue{ margin:8px 0 0; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .evm-head{
    margin:20px 0 9px; font-family:'Noto Sans Thai',sans-serif;
    font-size:13px; font-weight:800; color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .evm-head::before{
    content:''; flex:none; width:3px; height:14px; border-radius:999px; background:var(--c);
  }
  @media (hover:hover){
    .ev-card.is-openable:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb, var(--c) 55%, var(--glass-edge));
      box-shadow:0 12px 28px rgba(var(--shadow-rgb),.13);
    }
  }
  .ev-card.is-openable:active{ transform:scale(.992); transition-duration:.09s; }

  .past-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:11px 14px; cursor:pointer; font:inherit; color:var(--ink-soft);
    font-weight:700; font-size:13px;
    background:var(--glass-card); border:1px solid var(--glass-edge); border-radius:13px;
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  }
  .past-list{ margin-top:10px; }

  /* the two screens sharing one nav tab */
  .sub-tabs{ display:flex; gap:6px; margin:0 0 14px; }
  .sub-tab{
    flex:1; padding:9px 12px; cursor:pointer; font:inherit; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); background:var(--paper-dim);
    border:1px solid var(--line); border-radius:11px;
    transition:background .16s ease, color .16s ease, border-color .16s ease;
  }
  .sub-tab.active{ background:var(--ink); color:var(--card); border-color:var(--ink); }

  @media (hover:hover){
    .bday-chip:hover{
      transform:translateY(-2px);
      border-color:var(--c);
      box-shadow:0 9px 22px rgba(var(--shadow-rgb),.13);
    }
    .bday-chip:hover .who{ color:var(--c); }
    .bday-today:hover .bday-today-face{
      transform:translateY(-3px) scale(1.04);
      box-shadow:0 0 0 3px var(--gold), 0 16px 32px rgba(var(--shadow-rgb),.24);
    }
    .ev-person:hover{ border-color:var(--c); transform:translateY(-1px); }
    .past-toggle:hover{ color:var(--ink); }
  }
  @media (max-width:560px){
    .feed-title{ font-size:28px; }
    .feed-block .section-label{ font-size:16px; }
    .bday-today{ flex:1 1 calc(50% - 5px); max-width:none; padding:4px 6px 8px; }
    .bday-today-face{ width:84px; height:84px; font-size:26px; }
    .ev-card{ padding:13px 13px; gap:11px; }
    .ev-date{ width:64px; padding-right:10px; }
    .ev-d{ font-size:13.5px; }
    .ev-title{ font-size:14.5px; }
  }

  /* oshi / kami oshi */
  .crown-ico{ display:inline-flex; width:15px; height:15px; vertical-align:-2px; color:var(--gold); }
  .crown-ico svg{ width:100%; height:100%; display:block; }
  .fav-btn-sm.is-oshi{ color:var(--gold); }
  /* Two buttons of the same size, side by side, whatever their labels say. */
  .oshi-actions{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; margin:16px 0 4px; }
  .oshi-btn, .kami-btn{
    display:flex; align-items:center; justify-content:center; gap:7px; min-width:0;
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:13.5px; white-space:nowrap;
    padding:11px 12px; border-radius:14px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft);
    box-shadow:0 2px 8px rgba(var(--shadow-rgb),.06);
    transition:transform .18s var(--ease-out), background .18s ease, border-color .18s ease;
  }
  .oshi-btn:active, .kami-btn:active{ transform:scale(.96); transition-duration:.08s; }
  .oshi-btn span{ color:var(--gold); font-size:16px; }
  .oshi-btn.active{ background:var(--bnk-soft); border-color:var(--bnk); color:var(--ink); }
  .kami-btn.active{ background:#FBF0DC; border-color:var(--gold); color:var(--ink); }
  .kami-badge{ background:var(--gold)!important; display:inline-flex!important; align-items:center; gap:5px; }
  .kami-badge .crown-ico{ color:#fff; width:12px; height:12px; }

  /* profile page */
  .account-card{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:8px;
  }
  .account-card.guest{ background:var(--paper-dim); }
  .account-card .acc-info{ display:flex; align-items:center; gap:14px; flex:1 1 200px; min-width:0; }
