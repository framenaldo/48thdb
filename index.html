<!-- ===== FIREBASE SETUP =====
  1) Go to console.firebase.google.com -> create a project.
  2) Project settings -> your apps -> add a Web app -> copy the config into js/firebase.js.
  3) Firestore Database -> create database -> start in production mode.
  4) Authentication -> Sign-in method -> enable "Email/Password", "Google", and "Anonymous".
  5) Firestore Database -> Rules -> paste the rules from docs/02-prep-web.md (§3.3) -> Publish.
-->

<link rel="stylesheet" href="css/app.css">
<script>
  /* Runs before first paint: a stored choice wins, otherwise follow the OS. */
  (function(){
    var t; try{ t = localStorage.getItem('48thdb-theme'); }catch(e){}
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
