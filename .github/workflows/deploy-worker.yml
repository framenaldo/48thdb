# Deploy the api.48thdb.com Worker (worker/wrangler.toml) by hand: Actions → Deploy Worker → Run workflow.
# Same token as the site's deploy (CLOUDFLARE_API_TOKEN). Secrets already set on the Worker stay as they are.
name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8e5e921b23884747506b07a3ba030dcf
        run: npx --yes wrangler@4.135.0 deploy
