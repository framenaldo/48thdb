# Refresh every member's iAM48 live stats and the song videos' view counts
# and publish them. The site reads data/lives.json and data/youtube.json;
# nothing else is touched.
name: Refresh live stats

on:
  schedule:
    # Midnight in Thailand, so a day's lives are counted the moment it ends.
    # GitHub's cron is best-effort and usually a few minutes late, which here
    # only helps: the run wants to be just after midnight, never just before.
    - cron: '0 17 * * *'      # 00:00 in Thailand
    # And again at 03:00, to pick up anyone who went live after midnight
    # rather than leaving those lives to wait a whole day.
    - cron: '0 20 * * *'      # 03:00 in Thailand
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: lives
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect lives
        run: python3 scripts/collect-lives.py

      - name: Collect YouTube views
        continue-on-error: true      # a refused YouTube must not hold back the live stats
        timeout-minutes: 12
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect-youtube.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "48thdb-bot"
          git config user.email "48thdb-bot@users.noreply.github.com"
          git add data/
          git commit -m "Refresh iAM48 live stats and YouTube views"
          git pull --rebase
          git push
