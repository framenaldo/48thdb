# Refresh every member's iAM48 live stats once a day and publish them.
# The site reads data/lives.json; nothing else is touched.
name: Refresh live stats

on:
  schedule:
    - cron: '0 20 * * *'      # 03:00 in Thailand, after the night's lives
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: lives
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect
        run: python3 scripts/collect-lives.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- data/lives.json; then
            echo "No new lives."
            exit 0
          fi
          git config user.name  "48thdb-bot"
          git config user.email "48thdb-bot@users.noreply.github.com"
          git add data/lives.json
          git commit -m "Refresh iAM48 live stats"
          git push
