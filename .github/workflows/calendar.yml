# Rebuild the subscribable calendars whenever the events in index.html change,
# so a phone subscribed to calendar.ics sees the update on its next refresh.
name: Calendar feeds

on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/build-calendar.mjs']
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # to start "Deploy site" after a push, below

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build feeds
        run: node scripts/build-calendar.mjs
      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- '*.ics'; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "48thdb-bot"
          git config user.email "48thdb-bot@users.noreply.github.com"
          git add -- '*.ics'
          git commit -m "Rebuild calendar feeds"
          git pull --rebase
          git push
          # A push made with the workflow's own token starts no other workflow,
          # so "Deploy site" is asked for by name; without this the site keeps
          # serving the old data until someone else pushes.
          gh workflow run deploy.yml --ref main
