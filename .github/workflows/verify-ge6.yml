# Check the GE6 supply card against the chain (scripts/verify-ge6-supply.mjs). Run by hand; reads only.
name: Verify GE6 supply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-ge6-supply.mjs
