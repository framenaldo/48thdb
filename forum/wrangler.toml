# 48thForum: a fans' web board. One Worker renders every page and keeps the board in D1.
# Deploy: GitHub Actions "Deploy 48thForum" (it creates the database on first run and fills in its id),
# or by hand — see README.md.
name = "48thforum"
main = "src/index.js"
compatibility_date = "2026-09-21"
workers_dev = true

# style.css, app.js, the icon and robots.txt; everything else goes to the Worker.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "48thforum"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# Pictures in posts (src/images.js). The deploy workflow creates the bucket if it is missing.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "48thforum-images"

# Optional: Cloudflare Turnstile on the sign-up form. Set both to turn it on
#   TURNSTILE_SITE in [vars], and  npx wrangler secret put TURNSTILE_SECRET
[vars]
TURNSTILE_SITE = ""
# Signing in with a 48thDb account (src/fb.js, public/fb.js): 48thDb's Firebase project, the same values
# 48thdb.com's page carries (an API key for Firebase is not a secret). Leave FIREBASE_PROJECT empty to turn it off.
FIREBASE_PROJECT = "thdatabase"
FIREBASE_API_KEY = "AIzaSyDnh4nwoEyJor6GHFyZL8CqWhq5xVcejOg"
FIREBASE_AUTH_DOMAIN = "thdatabase.firebaseapp.com"
# how long a guest's page is kept at the edge, in seconds (0 = never); see GUEST_PAGES in src/index.js
GUEST_CACHE = "30"

# every night at 03:17 Thai time: clear old read marks, spent rate limits and old sessions
[triggers]
crons = ["17 20 * * *"]
