name = "48thdb-live"
main = "live-worker.js"
compatibility_date = "2026-09-21"

# The site asks this at api.48thdb.com; claiming it here keeps the name and
# the address together, so a rename moves the address with it.
routes = [
  { pattern = "api.48thdb.com", custom_domain = true },
]

# Every 5 minutes: a third of the members' iAM48 catch-up lists (so each is
# looked at every 15 minutes), and in the evening, 17:00–23:59 in Thailand,
# a YouTube answer kept warm for the first visitor.
[triggers]
crons = ["*/5 * * * *"]

# The iAM48 lives each member published in the last three days.
[[kv_namespaces]]
binding = "IAM"
id = "6fa61537e8444dbba588454ec4323753"
