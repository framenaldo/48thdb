# 48thHako: a fans' web board. One Worker renders every page and keeps the board in D1.
# Deploy: GitHub Actions "Deploy 48thHako" (it creates the database on first run and fills in its id),
# or by hand — see README.md.
name = "48thhako"
main = "src/index.js"
compatibility_date = "2026-09-21"
workers_dev = true

# style.css, app.js, the icon and robots.txt; everything else goes to the Worker.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "48thhako"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# Optional: Cloudflare Turnstile on the sign-up form. Set both to turn it on
#   TURNSTILE_SITE in [vars], and  npx wrangler secret put TURNSTILE_SECRET
[vars]
TURNSTILE_SITE = ""
