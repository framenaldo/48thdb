<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1200"></canvas>
<script>
/* A drawn gallery wall for the members page (not a photo): the members' own profile photos (photos/*.jpg) in frames of gold, black
   and white with mats, hung salon-style on a deep painted wall under small picture lights. Seeded. */
window.drawScene = async (urls = []) => {
let seed = 4848; const R = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296, rr = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
const W = 1920, H = 1200, c = document.getElementById('c'), g = c.getContext('2d');
const imgs = (await Promise.all(urls.map(u => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = u; })))).filter(Boolean);
for (let i = imgs.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [imgs[i], imgs[j]] = [imgs[j], imgs[i]]; }
// wall: deep plum paint with a soft wash, a dado rail low down
const wl = g.createLinearGradient(0, 0, 0, H); wl.addColorStop(0, '#3A1D33'); wl.addColorStop(1, '#2A1426'); g.fillStyle = wl; g.fillRect(0, 0, W, H);
for (let i = 0; i < 40; i++) { const x = rr(0, W), y = rr(0, H), r = rr(150, 500), p = g.createRadialGradient(x, y, 0, x, y, r); p.addColorStop(0, R() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,200,230,.05)'); p.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = p; g.fillRect(0, 0, W, H); }
for (let i = 0; i < 30000; i++) { g.fillStyle = `rgba(${R() < .5 ? '0,0,0' : '255,220,240'},${rr(.02, .06)})`; g.fillRect(rr(0, W), rr(0, H), 2, 2); }
g.fillStyle = '#1E0E1B'; g.fillRect(0, H - 120, W, 120); g.fillStyle = '#5A3A2A'; g.fillRect(0, H - 128, W, 10); g.fillStyle = 'rgba(255,220,170,.25)'; g.fillRect(0, H - 128, W, 2);
const FR = [
  { k:'gold', edge:24, mat:22 }, { k:'black', edge:14, mat:26 }, { k:'white', edge:12, mat:0 }, { k:'wood', edge:18, mat:18 }, { k:'gold', edge:18, mat:0 },
];
function frame(x, y, w, h, f, im) {
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 26; g.shadowOffsetX = 8; g.shadowOffsetY = 16;
  const e = f.edge;
  if (f.k === 'gold') { const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, '#F4D58A'); gr.addColorStop(.35, '#B8862E'); gr.addColorStop(.6, '#F1CF7A'); gr.addColorStop(1, '#7A5418'); g.fillStyle = gr; }
  else if (f.k === 'black') g.fillStyle = '#121014'; else if (f.k === 'white') g.fillStyle = '#F3F0EA'; else { const gr = g.createLinearGradient(x, y, x + w, y); gr.addColorStop(0, '#6B4226'); gr.addColorStop(1, '#3E2414'); g.fillStyle = gr; }
  g.fillRect(x, y, w, h); g.restore();
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2; g.strokeRect(x + 3, y + 3, w - 6, h - 6);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + e - 3, y + e - 3, w - 2 * e + 6, h - 2 * e + 6);
  if (f.mat) { g.fillStyle = '#F7F3EC'; g.fillRect(x + e, y + e, w - 2 * e, h - 2 * e); }
  const ix = x + e + f.mat, iy = y + e + f.mat, iw = w - 2 * (e + f.mat), ih = h - 2 * (e + f.mat), k = Math.min(im.naturalWidth / iw, im.naturalHeight / ih);
  g.drawImage(im, (im.naturalWidth - iw * k) / 2, (im.naturalHeight - ih * k) / 2, iw * k, ih * k, ix, iy, iw, ih);
  const gl = g.createLinearGradient(ix, iy, ix + iw, iy + ih); gl.addColorStop(0, 'rgba(255,255,255,.16)'); gl.addColorStop(.4, 'rgba(255,255,255,0)'); g.fillStyle = gl; g.fillRect(ix, iy, iw, ih);
}
function light(x, y, w) {
  const sp = g.createRadialGradient(x, y + 10, 4, x, y + 140, 260); sp.addColorStop(0, 'rgba(255,220,160,.38)'); sp.addColorStop(1, 'rgba(255,220,160,0)'); g.fillStyle = sp; g.fillRect(x - 300, y - 20, 600, 440);
  g.fillStyle = '#2A2224'; g.fillRect(x - w / 2, y - 6, w, 10); g.fillStyle = '#C9A55A'; g.fillRect(x - w / 2, y - 6, w, 3); g.fillStyle = '#1A1416'; g.fillRect(x - 2, y - 26, 4, 20);
}
// salon hang: columns of frames of mixed sizes; a light over some
let k = 0, x = -30;
while (x < W + 40 && imgs.length) {
  const colW = rr(170, 260); let y = rr(10, 60);
  while (y < H - 170) {
    const f = pick(FR), w = colW, h = Math.round(w * pick([1, 1.25, 1.33, .8])), im = imgs[k++ % imgs.length];
    if (y + h > H - 140) break;
    frame(x, y, w, h, f, im);
    if (R() < .3) light(x + w / 2, y - 4, w * .5);
    y += h + rr(26, 46);
  }
  x += colW + rr(30, 56);
}
const v = g.createRadialGradient(W / 2, H * .45, H * .3, W / 2, H * .5, W * .75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
const snap = document.createElement('canvas'); snap.width = W; snap.height = H; snap.getContext('2d').drawImage(c, 0, 0);
g.clearRect(0, 0, W, H); g.filter = 'blur(1.3px)'; g.drawImage(snap, 0, 0); g.filter = 'none';
};
if (!/[?&]wait\b/.test(location.search)) drawScene();
</script>
